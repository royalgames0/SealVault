<style>
/* ============================================================
   SEAL VAULT - single file retro game
   All CSS inline. No external assets. No build step.
   ============================================================ */
:root{
  --bg:#070b1c;
  --bg2:#0d1533;
  --panel:#141d42;
  --panel2:#1b2757;
  --line:#2c3c7a;
  --ink:#e9f2ff;
  --dim:#8fa3d6;
  --accent:#4fd6ff;
  --accent2:#ffd166;
  --good:#5be584;
  --bad:#ff5c7a;
  --r0:#b9c6d6; /* common    */
  --r1:#6fe07a; /* uncommon  */
  --r2:#4aa8ff; /* rare      */
  --r3:#b06bff; /* epic      */
  --r4:#ffb020; /* legendary */
  --r5:#ff4d6d; /* mythic    */
  --r6:#7bffe0; /* exclusive */
  --tap:0px;    /* extra tap padding, raised by accessibility toggle */
  --fs:1;       /* text scale */
}
body.hc{
  --bg:#000000; --bg2:#000000; --panel:#000913; --panel2:#001d2e;
  --line:#5cf0ff; --ink:#ffffff; --dim:#cfe9ff; --accent:#5cf0ff; --accent2:#ffe75c;
  --r0:#ffffff; --r1:#7dff7d; --r2:#68c6ff; --r3:#d69bff; --r4:#ffd24a; --r5:#ff8098; --r6:#8dfff0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);}
body{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  color:var(--ink);
  font-size:calc(13px * var(--fs));
  line-height:1.35;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.hidden{display:none !important;}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
     background:
       radial-gradient(1200px 700px at 50% -10%, #17255c 0%, transparent 60%),
       linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
     padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

#topbar{width:100%;max-width:860px;display:flex;gap:6px;align-items:center;padding:6px 8px;flex-wrap:wrap;}
.stat{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);
      border-radius:6px;padding:3px 7px;white-space:nowrap;font-size:calc(12px * var(--fs));}
.stat b{color:var(--accent2);font-weight:700;letter-spacing:.5px;}
.stat .lbl{color:var(--dim);}
#topbar .spacer{flex:1 1 auto;}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:6px;color:var(--ink);
         padding:calc(4px + var(--tap)) calc(8px + var(--tap));font-weight:700;letter-spacing:.5px;}
.iconbtn:active{transform:translateY(1px);}
.iconbtn:hover{border-color:var(--accent);}
.iconbtn[disabled]{opacity:.45;cursor:not-allowed;}

#stagewrap{position:relative;width:100%;max-width:860px;flex:0 0 auto;display:flex;justify-content:center;}
#stage{position:relative;width:100%;aspect-ratio:3/2;background:#000;border:3px solid var(--line);
       border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px #0a0f24, 0 12px 30px rgba(0,0,0,.6);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#stage.shake{animation:shk .18s linear;}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(0,0)}}
body.noflash #stage.shake{animation:none;}

/* ---------- under-stage status strip ---------- */
#underbar{width:100%;max-width:860px;display:flex;align-items:center;gap:8px;padding:6px 10px 0;flex-wrap:wrap;}
#xpwrap{flex:1 1 120px;min-width:100px;}
#xpwrap .muted{font-size:calc(10px * var(--fs));margin-top:2px;}
#quick{display:flex;gap:5px;}
#quick .iconbtn{font-size:calc(11px * var(--fs));padding:calc(4px + var(--tap)) calc(7px + var(--tap));}

/* ---------- touch controls ---------- */
#pad{width:100%;max-width:860px;display:flex;justify-content:space-between;align-items:flex-end;
     padding:8px 10px 10px;gap:10px;flex:1 1 auto;min-height:0;}
#dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
      width:min(46vw,196px);aspect-ratio:1/1;gap:3px;}
.pbtn{background:var(--panel2);border:2px solid var(--line);border-radius:8px;color:var(--ink);
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(15px * var(--fs));
      touch-action:none;}
.pbtn.on{background:var(--accent);color:#04101f;border-color:var(--accent);}
#dpad .sp{visibility:hidden;}
#abtns{display:flex;gap:10px;align-items:center;}
#abtns .pbtn{width:min(22vw,92px);height:min(22vw,92px);border-radius:50%;font-size:calc(16px * var(--fs));}
#abtns .pbtn.b{background:var(--panel);}
#hintline{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:var(--dim);
          font-size:calc(11px * var(--fs));pointer-events:none;}

/* ---------- overlay screens ---------- */
#screens{position:fixed;inset:0;z-index:40;pointer-events:none;}
.screen{position:absolute;inset:0;background:rgba(4,7,20,.93);backdrop-filter:blur(2px);
        display:none;flex-direction:column;pointer-events:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.screen.show{display:flex;}
.schead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--panel);}
.schead h2{margin:0;font-size:calc(15px * var(--fs));letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
.schead .spacer{flex:1;}
.scbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;}
.scfoot{padding:8px 10px;border-top:2px solid var(--line);background:var(--panel);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ---------- wardrobe ---------- */
#ward{display:flex;flex:1;min-height:0;}
#slotrail{width:118px;flex:0 0 auto;overflow:auto;background:var(--panel);border-right:2px solid var(--line);padding:6px;}
.slotbtn{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:2px solid transparent;
         border-radius:6px;padding:calc(6px + var(--tap)) 6px;margin-bottom:4px;text-align:left;
         color:var(--dim);font-size:calc(11px * var(--fs));line-height:1.1;}
.slotbtn .ic{width:22px;height:22px;flex:0 0 auto;image-rendering:pixelated;}
.slotbtn.sel{background:var(--panel2);border-color:var(--accent);color:var(--ink);}
.slotbtn .cnt{margin-left:auto;color:var(--dim);font-size:calc(10px * var(--fs));}
#wardmain{flex:1;min-width:0;display:flex;flex-direction:column;}
#wardtools{display:flex;gap:6px;padding:6px;flex-wrap:wrap;align-items:center;border-bottom:2px solid var(--line);background:var(--bg2);}
#wardtools input[type=search],#wardtools select{background:var(--panel);border:2px solid var(--line);border-radius:6px;
  padding:calc(4px + var(--tap)) 6px;min-width:0;}
#wardtools input[type=search]{flex:1 1 120px;}
.chk{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:calc(11px * var(--fs));}
#wardsplit{flex:1;min-height:0;display:flex;}
#gridwrap{flex:1;min-width:0;overflow:auto;padding:8px;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;}
.cell{position:relative;background:var(--panel);border:3px solid var(--r0);border-radius:8px;padding:3px;
      display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;}
.cell canvas{width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;}
.cell .nm{font-size:calc(9px * var(--fs));text-align:center;color:var(--ink);line-height:1.05;
          height:2.1em;overflow:hidden;word-break:break-word;}
.cell.locked{filter:grayscale(1) brightness(.55);}
.cell.locked .nm{color:var(--dim);}
.cell.eq{box-shadow:0 0 0 3px var(--accent) inset;}
.cell .tick{position:absolute;top:2px;right:3px;color:var(--accent);font-weight:900;font-size:calc(12px * var(--fs));}
.cell .lock{position:absolute;top:2px;right:3px;font-size:calc(11px * var(--fs));}
.cell .rmark{position:absolute;top:2px;left:3px;width:12px;height:12px;}
.cell.excl{animation:exglow 1.6s ease-in-out infinite;}
@keyframes exglow{0%,100%{box-shadow:0 0 3px var(--r6)}50%{box-shadow:0 0 12px var(--r6)}}
body.noflash .cell.excl{animation:none;box-shadow:0 0 6px var(--r6);}
#preview{width:170px;flex:0 0 auto;border-left:2px solid var(--line);background:var(--panel);
         padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;}
#pvcanvas{width:100%;aspect-ratio:1/1;image-rendering:pixelated;background:linear-gradient(180deg,#0a1030,#132a52);
          border:2px solid var(--line);border-radius:8px;}
#pvname{font-size:calc(11px * var(--fs));color:var(--dim);min-height:3.4em;}
#pvname .t{color:var(--ink);font-weight:700;}
.rtag{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:4px;font-size:calc(10px * var(--fs));
      border:2px solid currentColor;font-weight:700;letter-spacing:.5px;}
@media(max-width:640px){
  #preview{width:130px;}
  #slotrail{width:84px;}
  .slotbtn{flex-direction:column;align-items:flex-start;gap:2px;}
  .slotbtn .cnt{margin-left:0;}
}

/* ---------- generic lists / cards ---------- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;}
.card h3{margin:0 0 4px;font-size:calc(13px * var(--fs));color:var(--accent);letter-spacing:1px;}
.row{display:flex;gap:8px;align-items:center;}
.row .spacer{flex:1;}
.muted{color:var(--dim);font-size:calc(11px * var(--fs));}
.bar{height:10px;background:#0a1130;border:2px solid var(--line);border-radius:6px;overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar.small{height:7px;}
.tagline{font-size:calc(11px * var(--fs));color:var(--dim);}
.done{color:var(--good);}
.pill{border:2px solid var(--line);border-radius:999px;padding:1px 8px;font-size:calc(10px * var(--fs));color:var(--dim);}
ul.plain{margin:4px 0;padding-left:16px;}
ul.plain li{margin:2px 0;}

/* ---------- toast + reveal ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:60;display:flex;
        flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:100%;max-width:520px;padding:0 8px;}
.toast{background:var(--panel2);border:2px solid var(--accent);border-radius:8px;padding:5px 10px;
       font-size:calc(12px * var(--fs));box-shadow:0 6px 18px rgba(0,0,0,.5);animation:tin .25s ease-out;}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
       background:rgba(2,4,12,.86);padding:12px;}
#modal.show{display:flex;}
#modalbox{background:var(--panel);border:3px solid var(--line);border-radius:10px;max-width:460px;width:100%;
          max-height:88vh;overflow:auto;padding:12px;}
#modalbox h3{margin:0 0 6px;color:var(--accent);letter-spacing:1px;}
.lootrow{display:flex;align-items:center;gap:8px;border:3px solid var(--r0);border-radius:8px;padding:5px;margin:5px 0;
         background:#0b1230;animation:pop .28s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
body.noflash .lootrow{animation:none;}
.lootrow canvas{width:44px;height:44px;image-rendering:pixelated;flex:0 0 auto;background:#0a1030;border-radius:6px;}
.lootrow .meta{min-width:0;}
.lootrow .meta .n{font-weight:700;}
.lootrow .new{margin-left:auto;color:var(--accent2);font-weight:800;font-size:calc(10px * var(--fs));}
kbd{background:#0a1130;border:2px solid var(--line);border-radius:4px;padding:0 4px;font-size:calc(11px * var(--fs));}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.vaultcard{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px;text-align:left;}
.vaultcard.sel{border-color:var(--accent);}
input[type=range]{width:100%;accent-color:var(--accent);}
.swatch{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid #0006;}
#dbg{position:fixed;right:4px;bottom:4px;color:#3c4a80;font-size:10px;z-index:80;pointer-events:none;}
</style>

<script>
/* ============================================================
   SEAL VAULT
   Everything below is the whole game: engine, art, audio, data.
   ============================================================ */
(function(){
'use strict';
/* ============================================================
   0. CONSTANTS + SMALL UTILITIES
   ============================================================ */
const VW = 240, VH = 160;              // virtual (pixel) resolution
const SAVE_KEY = 'sealvault.save.v1';
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a=1,b=0)=> b + Math.random()*(a-b);
const rndi  = (n)=> (Math.random()*n)|0;
const pick  = (arr)=> arr[(Math.random()*arr.length)|0];
const chance= (p)=> Math.random() < p;
const dist  = (x1,y1,x2,y2)=> Math.hypot(x1-x2,y1-y2);
const fmt   = (n)=> { n=Math.floor(n); return n>=1e6? (n/1e6).toFixed(2)+'M' : n>=1e4? (n/1e3).toFixed(1)+'K' : ''+n; };
const now   = ()=> performance.now();
const aabb  = (a,b)=> a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* deterministic RNG (used for the daily vault rotation + procedural props) */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
  return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function dayIndex(d){ d = d || new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5) + d.getFullYear()*1000; }

/* ============================================================
   1. PIXEL FONT (5x7, uppercase-only, drawn straight to canvas)
   ============================================================ */
const G = {
 'A':"01110100011000111111100011000110001",'B':"11110100011000111110100011000111110",
 'C':"01110100011000010000100001000101110",'D':"11110100011000110001100011000111110",
 'E':"11111100001000011110100001000011111",'F':"11111100001000011110100001000010000",
 'G':"01110100011000010111100011000101110",'H':"10001100011000111111100011000110001",
 'I':"11111001000010000100001000010011111",'J':"00111000100001000010000101001001100",
 'K':"10001100101010011000101001001010001",'L':"10000100001000010000100001000011111",
 'M':"10001110111010110001100011000110001",'N':"10001110011010110011100011000110001",
 'O':"01110100011000110001100011000101110",'P':"11110100011000111110100001000010000",
 'Q':"01110100011000110001101011001001101",'R':"11110100011000111110101001001010001",
 'S':"01111100001000001110000010000111110",'T':"11111001000010000100001000010000100",
 'U':"10001100011000110001100011000101110",'V':"10001100011000110001100010101000100",
 'W':"10001100011000110001101011101110001",'X':"10001100010101000100010101000110001",
 'Y':"10001100010101000100001000010000100",'Z':"11111000010001000100010000100011111",
 '0':"01110100011001110101110011000101110",'1':"00100011000010000100001000010001110",
 '2':"01110100010000100010001000100011111",'3':"11110000010000101110000010000111110",
 '4':"00010001100101010001111110001000010",'5':"11111100001111000001000011000101110",
 '6':"00110010001000011110100011000101110",'7':"11111000010001000100010000100001000",
 '8':"01110100011000101110100011000101110",'9':"01110100011000101111000010001001100",
 ' ':"00000000000000000000000000000000000",'.':"00000000000000000000000000000000100",
 ',':"00000000000000000000000000010001000",':':"00000001000000000000000010000000000",
 '!':"00100001000010000100001000000000100",'?':"01110100010000100110001000000000100",
 '-':"00000000000000001110000000000000000",'+':"00000000000010001110001000000000000",
 '/':"00001000010001000100010000100001000",'=':"00000000000111000000011100000000000",
 '(':"00010001000100001000010000100000010",')':"01000001000001000001000001000001000",
 '%':"10001100100001000100010000100110001",'*':"00000101000111011111011100101000000",
 '<':"00010001000100010000010000100000010",'>':"01000001000001000001000010001000000",
 '#':"01010010101111101010111110101001010",'\'':"00100001000000000000000000000000000",
 '"':"01010010100000000000000000000000000",'_':"00000000000000000000000000000011111",
 '^':"00100010100000000000000000000000000",'|':"00100001000010000100001000010000100",
 '$':"00100011111010001110001010111100100"
};
function textW(s, sc){ sc = sc||1; return (s.length * 6 - 1) * sc; }
function drawText(c, s, x, y, col, sc, shadow){
  sc = sc||1; s = String(s).toUpperCase();
  if (shadow){ drawText(c, s, x+sc, y+sc, shadow, sc, null); }
  c.fillStyle = col || '#fff';
  let cx = x|0;
  for (let i=0;i<s.length;i++){
    const g = G[s[i]];
    if (g){
      for (let r=0;r<7;r++) for (let q=0;q<5;q++)
        if (g.charCodeAt(r*5+q) === 49) c.fillRect(cx + q*sc, y + r*sc, sc, sc);
    }
    cx += 6*sc;
  }
}
function drawTextC(c, s, cxp, y, col, sc, shadow){ drawText(c, s, (cxp - textW(String(s),sc)/2)|0, y, col, sc, shadow); }

/* ============================================================
   2. AUDIO - tiny chiptune synth + sequencer
   ============================================================ */
const Audio_ = {
  ac:null, master:null, musGain:null, sfxGain:null,
  musVol:0.5, sfxVol:0.7, muted:false,
  track:null, step:0, nextTime:0, timer:null, curName:'',
  init(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = this.muted?0:1; this.master.connect(this.ac.destination);
    this.musGain = this.ac.createGain(); this.musGain.gain.value = this.musVol; this.musGain.connect(this.master);
    this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = this.sfxVol; this.sfxGain.connect(this.master);
  },
  resume(){ this.init(); if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m?0:1; },
  setVol(mus, sfx){
    if (mus!=null){ this.musVol = mus; if (this.musGain) this.musGain.gain.value = mus; }
    if (sfx!=null){ this.sfxVol = sfx; if (this.sfxGain) this.sfxGain.gain.value = sfx; }
  },
  /* one blip */
  blip(freq, dur, type, vol, dest, slideTo){
    if (!this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(); const g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol==null?0.25:vol), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp){
    if (!this.ac) return;
    const t = this.ac.currentTime, len = Math.max(1,(this.ac.sampleRate*dur)|0);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate); const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = hp?'highpass':'lowpass'; f.frequency.value = hp?1200:2400;
    const g = this.ac.createGain(); g.gain.value = vol==null?0.25:vol;
    src.connect(f); f.connect(g); g.connect(this.sfxGain); src.start(t); src.stop(t+dur+0.02);
  },
  sfx(name){
    if (!this.ac || this.muted) return;
    switch(name){
      case 'blip':    this.blip(660, .06, 'square', .16); break;
      case 'select':  this.blip(880, .05, 'square', .18); this.blip(1320,.05,'square',.10); break;
      case 'back':    this.blip(420, .07, 'square', .14, null, 220); break;
      case 'coin':    this.blip(988, .05, 'square', .18); setTimeout(()=>this.blip(1319,.09,'square',.16),45); break;
      case 'fish':    this.blip(740, .05, 'triangle', .22); setTimeout(()=>this.blip(1109,.08,'triangle',.18),40); break;
      case 'hit':     this.noise(.18,.30); this.blip(180,.16,'sawtooth',.18,null,60); break;
      case 'hurt':    this.blip(300,.22,'square',.20,null,90); this.noise(.12,.18); break;
      case 'jump':    this.blip(420,.10,'square',.16,null,760); break;
      case 'splash':  this.noise(.22,.20,true); break;
      case 'swat':    this.noise(.09,.24,true); this.blip(520,.06,'square',.12,null,240); break;
      case 'dig':     this.noise(.10,.18); break;
      case 'good':    this.blip(784,.07,'square',.18); setTimeout(()=>this.blip(1047,.10,'square',.16),60); break;
      case 'perfect': [880,1109,1319,1760].forEach((f,i)=>setTimeout(()=>this.blip(f,.10,'square',.16),i*55)); break;
      case 'fail':    this.blip(220,.28,'sawtooth',.18,null,80); break;
      case 'unlock':  [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.blip(f,.16,'triangle',.20),i*70)); break;
      case 'legend':  [659,880,1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>{this.blip(f,.22,'square',.16);this.blip(f*1.5,.22,'triangle',.10);},i*80)); break;
      case 'levelup': [523,784,1047].forEach((f,i)=>setTimeout(()=>this.blip(f,.14,'square',.18),i*80)); break;
      case 'bubble':  this.blip(300+rnd(500),.08,'sine',.12,null,900); break;
      case 'wave':    this.blip(140,.30,'triangle',.14,null,90); break;
    }
  },
  /* ---- music ---- */
  noteFreq(n){
    if (!n || n === '-') return 0;
    const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0;
    const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0);
    return 440 * Math.pow(2, (base + (+m[3]+1-5)*12 - 9) / 12);
  },
  play(name){
    this.init(); if (!this.ac) return;
    if (this.curName === name) return;
    this.curName = name; this.track = MUSIC[name] || null; this.step = 0;
    this.nextTime = this.ac.currentTime + 0.06;
    if (!this.timer) this.timer = setInterval(()=>this.tick(), 26);
  },
  stop(){ this.curName=''; this.track=null; },
  tick(){
    if (!this.ac || !this.track) return;
    const spb = 60 / this.track.bpm / 2;                     // 8th notes
    while (this.nextTime < this.ac.currentTime + 0.18){
      const t = this.nextTime, s = this.step, tr = this.track;
      const L = tr.lead[s % tr.lead.length], B = tr.bass[s % tr.bass.length], D = tr.drum[s % tr.drum.length];
      if (L && L !== '-') this.tone(this.noteFreq(L), t, spb*0.9, 'square', 0.11);
      if (B && B !== '-') this.tone(this.noteFreq(B), t, spb*1.1, 'triangle', 0.18);
      if (D === 'k'){ this.tone(90, t, 0.11, 'sine', 0.30, 40); }

const Input = {

  _pd:{x:0,y:0},
  key(k){ return !!this.down[k]; },
  hit(k){ return !!this.pressed[k]; },
  clear(){ this.pressed = {}; this.ptr.tapped = false; this.ptr.justDown = false; this.ptr.justUp = false; },
  reset(){ this.down = {}; this.clear(); document.querySelectorAll('#pad .pbtn').forEach(b=>b.classList.remove('on')); },
  set(k, v){
    if (v && !this.down[k]) this.pressed[k] = true;

};
const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right',

  KeyX:'b', ShiftLeft:'b', KeyL:'b', Backspace:'b',
  Escape:'esc', KeyP:'pause'
};
addEventListener('keydown', e=>{
  const k = KEYMAP[e.code];
  if (k){ if (!e.repeat) Input.set(k, true); if (!isTypingTarget(e.target)) e.preventDefault(); }
  if (!isTypingTarget(e.target)) UI.hotkey(e);
  Audio_.resume();
}, {passive:false});
addEventListener('keyup', e=>{ const k = KEYMAP[e.code]; if (k) Input.set(k, false); });

function isTypingTarget(t){ return t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA'); }

document.querySelectorAll('#pad .pbtn').forEach(btn=>{
  const k = btn.dataset.k;
  const on  = e=>{ e.preventDefault(); Audio_.resume(); Input.set(k,true);  btn.classList.add('on'); };
  const off = e=>{ e.preventDefault(); Input.set(k,false); btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);

});
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); Audio_.resume();
  const p = canvasPos(e);
  Input.ptr.x = p.x; Input.ptr.y = p.y; Input.ptr.down = true; Input.ptr.justDown = true;
  Input._pd.x = p.x; Input._pd.y = p.y;
  if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch(_){} }
});
cv.addEventListener('pointermove', e=>{ const p = canvasPos(e); Input.ptr.x = p.x; Input.ptr.y = p.y; });
cv.addEventListener('pointerup', e=>{
  const p = canvasPos(e);
  Input.ptr.x = p.x; Input.ptr.y = p.y;
  Input.ptr.dx = p.x - Input._pd.x; Input.ptr.dy = p.y - Input._pd.y;
  Input.ptr.down = false; Input.ptr.justUp = true;

/* rarity marker shape - colour-blind safe (shape + letter + colour) */
function drawRarityMark(c, x, y, size, rarity){
  const r = RARITY[rarity]; c.fillStyle = r.c; const h = size/2, cx = x+h, cy = y+h;
  c.beginPath();
  switch(r.s){
    case 'circle': c.arc(cx,cy,h*0.85,0,7); break;
    case 'square': c.rect(x+size*0.12,y+size*0.12,size*0.76,size*0.76); break;
    case 'triangle': c.moveTo(cx,y); c.lineTo(x+size,y+size); c.lineTo(x,y+size); break;
    case 'diamond': c.moveTo(cx,y); c.lineTo(x+size,cy); c.lineTo(cx,y+size); c.lineTo(x,cy); break;
    case 'pent': for(let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5; const px=cx+Math.cos(a)*h, py=cy+Math.sin(a)*h; i?c.lineTo(px,py):c.moveTo(px,py);} break;
    case 'star': for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?h*0.45:h; const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr; i?c.lineTo(px,py):c.moveTo(px,py);} break;
    case 'hex': for(let i=0;i<6;i++){ const a=i*Math.PI/3; const px=cx+Math.cos(a)*h, py=cy+Math.sin(a)*h; i?c.lineTo(px,py):c.moveTo(px,py);} break;
  }
  c.closePath(); c.fill();
}
function raritySvg(rarity, size){
  const r = RARITY[rarity]; size = size||12; const h=size/2;
  let shape;
  switch(r.s){
    case 'circle': shape = `<circle cx="${h}" cy="${h}" r="${h*0.85}"/>`; break;
    case 'square': shape = `<rect x="${size*0.12}" y="${size*0.12}" width="${size*0.76}" height="${size*0.76}"/>`; break;
    case 'triangle': shape = `<polygon points="${h},0 ${size},${size} 0,${size}"/>`; break;
    case 'diamond': shape = `<polygon points="${h},0 ${size},${h} ${h},${size} 0,${h}"/>`; break;
    case 'pent': shape = `<polygon points="${poly(5,h,h,h,-90)}"/>`; break;
    case 'star': shape = `<polygon points="${star(5,h,h,h,h*0.45)}"/>`; break;
    default: shape = `<polygon points="${poly(6,h,h,h,0)}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="${r.c}" xmlns="http://www.w3.org/2000/svg">${shape}</svg>`;
  function poly(n,cx,cy,rad,off){ let o=[]; for(let i=0;i<n;i++){const a=(off+i*360/n)*Math.PI/180;o.push((cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1));} return o.join(' '); }
  function star(n,cx,cy,r1,r2){ let o=[]; for(let i=0;i<n*2;i++){const a=(-90+i*180/n)*Math.PI/180,rr=i%2?r2:r1;o.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));} return o.join(' '); }
}

/* ============================================================
   6. SEAL RENDERER
   The seal is drawn procedurally from row spans so fur patterns
   and cosmetics can be layered at fixed anchor points.
   Finished sprites are cached per loadout+pose+frame.
   ============================================================ */
/* silhouette = union of three ellipses (body, head, snout), baked once */
const SEAL_W = 26, SEAL_H = 15, PADX = 6, PADY = 12, CANW = 40, CANH = 33;
const E_BODY = {cx:10.5, cy:8.7, rx:8.7, ry:5.7};
const E_HEAD = {cx:17.9, cy:4.9, rx:6.5, ry:5.1};
const E_SNOUT= {cx:23.4, cy:6.6, rx:2.7, ry:2.4};
/* rear flipper fan: [y, x0, width] - two lobes with a notch, sticking out past the body */
const TAIL = [[4,-1,4],[5,-3,6],[6,-4,7],[7,-3,6],[8,-1,4],[9,-1,4],[10,-3,6],[11,-4,7],[12,-3,6],[13,-1,4]];
const MASK = new Uint8Array(SEAL_W*SEAL_H), EDGE = new Uint8Array(SEAL_W*SEAL_H), BELLY = new Uint8Array(SEAL_W*SEAL_H);
(function bakeSeal(){
  const inE = (e,x,y)=>{ const a=(x-e.cx)/e.rx, b=(y-e.cy)/e.ry; return a*a+b*b <= 1; };
  for (let y=0;y<SEAL_H;y++) for (let x=0;x<SEAL_W;x++){
    const px = x+0.5, py = y+0.5;
    if (inE(E_BODY,px,py) || inE(E_HEAD,px,py) || inE(E_SNOUT,px,py)) MASK[y*SEAL_W+x] = 1;
  }
  const m = (x,y)=> (x<0||y<0||x>=SEAL_W||y>=SEAL_H) ? 0 : MASK[y*SEAL_W+x];
  for (let y=0;y<SEAL_H;y++) for (let x=0;x<SEAL_W;x++){
    if (!MASK[y*SEAL_W+x]) continue;
    if (!m(x-1,y)||!m(x+1,y)||!m(x,y-1)||!m(x,y+1)) EDGE[y*SEAL_W+x] = 1;
    else if (inE({cx:10.2,cy:11.6,rx:6.6,ry:3.3}, x+0.5, y+0.5)) BELLY[y*SEAL_W+x] = 1;
  }
})();
function hash2(x,y){ let h = (Math.imul(x|0,73856093) ^ Math.imul(y|0,19349663)) >>> 0; h ^= h>>>13; return h>>>0; }
const PRISM = ['#ff5c7a','#ffd166','#5be584','#4fd6ff','#b06bff','#ff9ecb'];

function furColor(f, x, y, kind){
  const c = f.c, base = c[0], dark = c[1], light = c[2], pat = c[3], pc = c[4] || c[1];
  if (kind === 1) return dark;
  if (kind === 2) return light;
  switch(pat){
    case 'spot':    return (hash2(x>>1,y>>1)%100 < 26) ? pc : base;
    case 'speckle': return (hash2(x,y)%100 < 26) ? pc : base;
    case 'stripe':  return ((x + y*2) % 7) < 2 ? pc : base;
    case 'saddle':  return (y >= 1 && y <= 4 && x >= 5 && x <= 18) ? pc : base;
    case 'ring':    return (Math.round(Math.hypot((x-11)*0.9,(y-5)*1.5)) % 4) === 0 ? pc : base;
    case 'patch':   return Math.hypot((x-9)*0.8,(y-5)*1.2) < 4.5 ? pc : base;
    case 'aurora':  return [base,pc,'#7bffe0',base][((x + y*2) >> 1) % 4];
    case 'molten':  return ((x*3 + y*7) % 11) < 2 ? pc : base;
    case 'nacre':   return ['#f2e9ff','#dff3ff','#ffe9f6','#e4fffa'][(x + y*2) % 4];
    case 'prism':   return PRISM[(x + y) % 6];
    case 'stars':   return (hash2(x,y) % 100 < 9) ? pc : base;
    case 'frost':   return ((x % 4 === 0) !== (y % 4 === 0)) ? pc : base;
    case 'oldw':    return (hash2(x,y) % 100 < 22) ? pc : base;
    case 'shell':   return (y % 4 === 0 || (x + (y % 2 ? 2 : 0)) % 4 === 0) ? pc : base;
    default:        return base;
  }
}

/* ---- assemble one seal sprite ---- */
function paintSeal(c, o){
  const cos = o.cos || {};
  const fur = COS.byId[cos.fur] || COS.defaults.fur;
  const pose = o.pose || 'idle', fr = o.frame|0;
  const R = (x,y,w,h,col)=>{ c.fillStyle = col; c.fillRect(x,y,w,h); };
  const dark = fur.c[1], mid = furColor(fur, 8, 8, 0), light = fur.c[2];
  const swim = (pose === 'swim');

  /* rear flipper fan, behind the body */
  const ty = swim ? (fr?-1:1) : (fr?0:1);
  for (const [ry,rx,rw] of TAIL){
    R(rx, ry+ty, rw, 1, mid);
    R(rx, ry+ty, 1, 1, dark);                       /* outer edge */
  }
  R(-1,3+ty,5,1,dark); R(-1,14+ty,5,1,dark);        /* top and bottom caps */
  R(-1,8+ty,3,1,dark); R(-1,9+ty,3,1,dark);         /* the notch between the lobes */
  /* far front flipper: peeks out below the belly */
  const ffy = 13 + (swim ? (fr?1:0) : 0), ffx = swim ? 7 : 9;
  R(ffx,ffy,6,2,dark); R(ffx+2,ffy+2,5,1,dark);
  /* body */
  for (let y=0;y<SEAL_H;y++) for (let x=0;x<SEAL_W;x++){
    const i = y*SEAL_W+x;
    if (!MASK[i]) continue;
    R(x, y, 1, 1, furColor(fur, x, y, EDGE[i] ? 1 : BELLY[i] ? 2 : 0));
  }
  /* near front flipper: an outlined paddle angled down and forward */
  const nfy = swim ? (fr?11:9) : (fr?10:11), nfx = swim ? 12 : 14;
  const PADDLE = [[0,5],[0,6],[1,6],[3,4]];          /* [dx, width] per row */
  PADDLE.forEach((p,i)=>{
    R(nfx+p[0], nfy+i, p[1], 1, mid);
    R(nfx+p[0], nfy+i, 1, 1, dark);                  /* left edge */
    R(nfx+p[0]+p[1]-1, nfy+i, 1, 1, dark);           /* right edge */
  });
  R(nfx, nfy, 5, 1, dark); R(nfx+3, nfy+3, 4, 1, dark);
  /* face */
  const blink = (pose === 'sleep' || pose === 'hurt');
  if (blink){ R(18,4,4,1,dark); R(19,5,2,1,dark); }
  else {
    R(18,3,3,3,'#20182c'); R(19,3,1,1,'#f6fbff'); R(18,6,3,1,dark);
  }
  R(24,5,2,2,'#241c30'); R(24,5,1,1,'#57496a');      /* nose on the snout tip */
  R(23,8,2,1,dark); R(22,7,1,1,dark);                /* mouth */
  R(26,6,2,1,dark); R(26,9,2,1,dark);                /* whiskers */
  if (fur.c[3] === 'oldw'){
    R(26,5,3,1,'#ffffff'); R(26,11,3,1,'#ffffff'); R(27,8,3,1,'#ffffff'); R(19,1,4,1,'#ffffff');
  }
  /* cosmetics, back to front. Layer offsets keep the old anchor art aligned. */
  const it = (k)=> COS.byId[cos[k]];
  const layer = (item, table, dx, dy)=>{
    if (!item || !table[item.fam]) return;
    c.save(); c.translate(dx, dy);
    table[item.fam](R, item.c[0], item.c[1], pose);
    c.restore();
  };
  const nk = it('neck'), no = nk ? (NECK_OFF[nk.fam] || NECK_OFF.back) : null;
  if (no) layer(nk, NECK_DRAW, no[0], no[1]);
  layer(it('flip'), FLIP_DRAW, 1, 0);
  layer(it('face'), FACE_DRAW, 2, 1);
  layer(it('head'), HEAD_DRAW, 2, 0);
  /* prestige trim: a thin outline earned by rebirths */
  if (o.trim){
    c.fillStyle = o.trim;
    const m = (x,y)=> (x<0||y<0||x>=SEAL_W||y>=SEAL_H) ? 0 : MASK[y*SEAL_W+x];
    for (let y=-1;y<=SEAL_H;y++) for (let x=-1;x<=SEAL_W;x++){
      if (m(x,y)) continue;
      if (m(x-1,y)||m(x+1,y)||m(x,y-1)||m(x,y+1)) c.fillRect(x,y,1,1);
    }
  }
}
const sealCache = new Map();
function sealKey(o){
  const c = o.cos||{};
  return SLOTK.map(k=>c[k]||'-').join('|') + '|' + (o.pose||'idle') + '|' + (o.frame|0) + '|' + (o.trim||'-');
}
function sealCanvas(o){
  const key = sealKey(o);
  let cn = sealCache.get(key);
  if (cn) return cn;
  cn = document.createElement('canvas'); cn.width = CANW; cn.height = CANH;
  const c2 = cn.getContext('2d'); c2.imageSmoothingEnabled = false;
  c2.save(); c2.translate(PADX, PADY); paintSeal(c2, o); c2.restore();
  if (sealCache.size > 260) sealCache.clear();
  sealCache.set(key, cn);
  return cn;
}
function drawSeal(c, x, y, o){
  o = o || {};
  const cn = sealCanvas(o), s = o.scale || 1;
  x = Math.round(x); y = Math.round(y);
  c.save();
  if (o.alpha != null) c.globalAlpha = o.alpha;
  if (o.rot){ c.translate(x + 13*s, y + 8*s); c.rotate(o.rot); c.translate(-(x + 13*s), -(y + 8*s)); }
  if (o.facing < 0){
    c.translate(x + 13*s, y); c.scale(-1,1);
    c.drawImage(cn, 0,0,CANW,CANH, -(13*s) - PADX*s, -PADY*s, CANW*s, CANH*s);
  } else {
    c.drawImage(cn, 0,0,CANW,CANH, x - PADX*s, y - PADY*s, CANW*s, CANH*s);
  }
  c.restore();
}

const Particles = {
  list:[],
  spawnTrail(id, x, y, vx, vy){
    const it = COS.byId[id]; if (!it) return;
    const cfg = TRAIL_CFG[it.fam]; if (!cfg) return;
    if (State.opt.noflash && Math.random()<0.5) return;
    for (let i=0;i<cfg.n;i++){
      if (Math.random() > 0.5) continue;
      this.list.push({x:x+rnd(4,-4), y:y+rnd(4,-4), vx:(vx||0)*0.2+rnd(.3,-.3), vy:(vy||0)*0.1+cfg.vy+rnd(.1,-.1),
        life:cfg.life, max:cfg.life, sz:cfg.sz, shape:cfg.shape, c:Math.random()<0.5?it.c[0]:it.c[1],
        rain:cfg.rain, seed:rndi(1000)});
    }
    if (this.list.length > 220) this.list.splice(0, this.list.length-220);
  },
  burst(x,y,col,n,spd,shape){
    for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = rnd(spd||1.6,.2);
      this.list.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.2,life:26,max:26,sz:2,shape:shape||'sq',c:col,seed:rndi(1000)}); }
  },
  update(){
    for (let i=this.list.length-1;i>=0;i--){
      const p = this.list[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.shape === 'ring' || p.shape === 'ghost') p.x += Math.sin((p.life+p.seed)*0.2)*0.3;
      if (p.life <= 0) this.list.splice(i,1);
    }
  },
  draw(c){
    for (const p of this.list){
      const t = p.life/p.max;
      let col = p.c;
      if (p.rain === 1) col = PRISM[(((p.seed + p.life)/4)|0) % 6];
      if (p.rain === 2) col = ['#7bffe0','#4fd6ff','#b06bff','#5be584'][(((p.seed + p.life)/6)|0) % 4];
      c.globalAlpha = t < .4 ? t*2.2 : 1;
      c.fillStyle = col;
      const x = p.x|0, y = p.y|0, s = Math.max(1,(p.sz * (t>.3?1:.6))|0);
      switch(p.shape){
        case 'ring': c.fillRect(x,y,s,1); c.fillRect(x,y+s-1,s,1); c.fillRect(x,y,1,s); c.fillRect(x+s-1,y,1,s); break;
        case 'plus': c.fillRect(x,y-1,1,3); c.fillRect(x-1,y,3,1); break;
        case 'star': c.fillRect(x,y-1,1,3); c.fillRect(x-1,y,3,1); c.fillRect(x-1,y-1,1,1); c.fillRect(x+1,y+1,1,1); break;
        case 'heart': c.fillRect(x,y,1,1); c.fillRect(x+2,y,1,1); c.fillRect(x-1,y+1,5,1); c.fillRect(x,y+2,3,1); c.fillRect(x+1,y+3,1,1); break;
        case 'note': c.fillRect(x,y+2,2,2); c.fillRect(x+2,y-1,1,4); c.fillRect(x+3,y-1,1,1); break;
        case 'tri': c.fillRect(x,y+1,3,1); c.fillRect(x+1,y,1,1); break;
        case 'dot': c.fillRect(x,y,1,1); break;
        case 'ghost': c.fillRect(x,y,3,3); c.fillRect(x+1,y-1,1,1); c.fillRect(x,y+3,1,1); c.fillRect(x+2,y+3,1,1); break;
        default: c.fillRect(x,y,s,s);
      }
    }
    c.globalAlpha = 1;
  },
  clear(){ this.list.length = 0; }
};

/* ============================================================
   8b. LINKED SAVE FILE
   Chrome/Edge desktop expose the File System Access API, which lets the
   game keep a real .json on disk in sync and re-open it on the next
   visit. The handle survives reloads inside IndexedDB. Everywhere else
   (Firefox, Safari, all phones) the API does not exist, so the button
   falls back to the ordinary download + import flow.
   ============================================================ */
const FS_OK = typeof window.showSaveFilePicker === 'function' && typeof indexedDB !== 'undefined';
const IDB_DB = 'sealvault', IDB_STORE = 'handles', IDB_KEY = 'saveFile';
function idbOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(IDB_DB, 1);
    r.onupgradeneeded = ()=>{ if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbGet(k){
  try { const db = await idbOpen();
    return await new Promise((res, rej)=>{
      const q = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
      q.onsuccess = ()=> res(q.result); q.onerror = ()=> rej(q.error);
    });

async function idbSet(k, v){
  try { const db = await idbOpen();
    return await new Promise((res, rej)=>{
      const q = db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE)[v === null ? 'delete' : 'put'](v === null ? k : v, v === null ? undefined : k);
      q.onsuccess = ()=> res(1); q.onerror = ()=> rej(q.error);
    });
  } catch(e){ return null; }
}

const FileSave = {
  handle:null, name:'', status: FS_OK ? 'off' : 'unsupported',
  pending:false, lastWrite:0, timer:null,
  supported(){ return FS_OK; },
  /* called on every saveGame - throttled so we do not hammer the disk */
  touch(){
    if (this.status !== 'linked') return;
    this.pending = true;
    if (this.timer) return;
    const wait = Math.max(0, 8000 - (Date.now() - this.lastWrite));
    this.timer = setTimeout(()=>{ this.timer = null; this.flush(); }, wait);
  },
  async flush(){
    if (this.status !== 'linked' || !this.handle || !this.pending) return;
    this.pending = false; this.lastWrite = Date.now();
    try {
      const w = await this.handle.createWritable();
      await w.write(JSON.stringify(State, null, 1));
      await w.close();
    } catch(e){
      this.status = 'needs-permission';
      toast('SAVE FILE LOCKED - RELINK IN SYS');
      if (UI.openIds.indexOf('scr-settings') >= 0) UI.renderSettings();
    }
  },
  async link(){
    if (!FS_OK){ saveGame(); exportSave(); return; }
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: 'sealvault-save.json',
        types: [{description:'Seal Vault save', accept:{'application/json':['.json']}}]
      });
      this.handle = h; this.name = h.name; this.status = 'linked';
      await idbSet(IDB_KEY, h);
      this.pending = true; await this.flush();
      toast('AUTO-SAVING TO ' + h.name.toUpperCase());
    } catch(e){ /* the picker was dismissed - nothing to do */ }
    UI.renderSettings();
  },
  async unlink(){
    this.handle = null; this.name = ''; this.status = FS_OK ? 'off' : 'unsupported';
    await idbSet(IDB_KEY, null);
    toast('SAVE FILE UNLINKED');
    UI.renderSettings();
  },
  /* re-grant after a browser restart; must run from a click */
  async regrant(){
    if (!this.handle) return false;
    try {
      const p = await this.handle.requestPermission({mode:'readwrite'});
      if (p === 'granted'){ this.status = 'linked'; return true; }
    } catch(e){}
    return false;
  },
  async readFile(){
    if (!this.handle) return null;
    try { const f = await this.handle.getFile(); const t = await f.text(); return JSON.parse(t); }
    catch(e){ return null; }
  },
  /* pull the linked file in, but never silently overwrite newer progress */
  async adopt(){
    const data = await this.readFile();
    if (!data || typeof data !== 'object' || data.owned === undefined) return 'empty';
    const fileAt = Number(data.savedAt) || 0, localAt = Number(State.savedAt) || 0;
    if (fileAt >= localAt){
      State = sanitize(deepMerge(defaultState(), data));
      STARTER_ITEMS.forEach(id=> State.owned[id] = 1);
      if (!State.owned[State.equipped.fur]) State.equipped.fur = 'fur_harborgrey';
      applyOptions(); UI.refreshAll(); Hub.init();
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(State)); } catch(e){}
      return 'file';
    }
    this.pending = true; await this.flush();       /* local was ahead - push it out */
    return 'local';
  },
  async boot(){
    if (!FS_OK) return;
    const h = await idbGet(IDB_KEY);
    if (!h) return;
    this.handle = h; this.name = h.name || 'save.json';
    let p = 'prompt';
    try { p = await h.queryPermission({mode:'readwrite'}); } catch(e){ p = 'prompt'; }
    if (p === 'granted'){
      this.status = 'linked';
      const from = await this.adopt();
      if (from === 'file') toast('LOADED ' + this.name.toUpperCase());
    } else if (p !== 'denied'){
      this.status = 'needs-permission';
      this.askResume();
    }
  },
  askResume(){
    modal('Linked save file',
      'This browser has <b>' + this.name + '</b> linked as your save file.<br><br>' +
      'Your browser needs one click to let the game read and write it again.',
      [{t:'CONTINUE FROM FILE', keep:true, fn:null}, {t:'NOT NOW', fn:()=>{ this.status = 'needs-permission'; }}]);
    const btn = $('#modalbox .row button');
    btn.onclick = async ()=>{
      const ok = await this.regrant();
      closeModal();
      if (ok){ const from = await this.adopt();
        toast(from === 'local' ? 'FILE WAS OLDER - KEPT THIS BROWSER SAVE' : 'LOADED ' + this.name.toUpperCase()); }
      else toast('PERMISSION DENIED - USING BROWSER SAVE');
    };
  }
};
function deepMerge(base, src){
  if (!src || typeof src !== 'object') return base;
  for (const k in base){
    if (src[k] === undefined || src[k] === null) continue;
    if (Array.isArray(base[k])) base[k] = Array.isArray(src[k]) ? src[k].slice() : base[k];
    else if (typeof base[k] === 'object') deepMerge(base[k], src[k]);
    else if (typeof src[k] === typeof base[k]) base[k] = src[k];
  }
  /* free-form maps (owned items, per-game stats) merge wholesale */
  ['owned'].forEach(k=>{ if (src[k] && typeof src[k]==='object') for (const id in src[k]) if (COS.byId[id]) base[k][id] = 1; });
  ['plays','best','wins','gamesCleared'].forEach(k=>{
    if (src.stats && src.stats[k] && typeof src.stats[k]==='object')
      for (const id in src.stats[k]) if (typeof src.stats[k][id]==='number') base.stats[k][id] = src.stats[k][id];
  });
  if (src.quests && src.quests.claimed) for (const id in src.quests.claimed) base.quests.claimed[id] = 1;
  if (src.equipped) for (const k in base.equipped){
    const v = src.equipped[k];
    base.equipped[k] = (v && COS.byId[v]) ? v : (k==='fur' ? 'fur_harborgrey' : null);
  }
  return base;
}
/* clamp anything a hand-edited or damaged save could smuggle in */
function sanitize(s){
  const num = (v, lo, hi, dflt)=>{
    v = Number(v);
    if (!isFinite(v)) return dflt;
    return clamp(Math.floor(v), lo, hi);
  };
  s.fish         = num(s.fish, 0, 1e12, 0);
  s.pearls       = num(s.pearls, 0, 1e12, 0);
  s.lifetimeFish = num(s.lifetimeFish, 0, 1e15, 0);
  s.prestige     = num(s.prestige, 0, MAX_PRESTIGE, 0);
  s.level        = num(s.level, 1, MAX_LEVEL, 1);
  s.xp           = num(s.xp, 0, 1e9, 0);
  GEAR.forEach(g=> s.gear[g.k] = num(s.gear[g.k], 0, g.max, 0));
  ['epic','legend','mythic','rolls'].forEach(k=> s.pity[k] = num(s.pity[k], 0, 1e6, 0));
  s.quests.fisherman = num(s.quests.fisherman, 0, 4, 0);
  s.flags.hsPrompted = num(s.flags.hsPrompted, 0, 1, 0);
  s.flags.welcomed   = num(s.flags.welcomed, 0, 1, 0);
  s.quests.lureHeld  = num(s.quests.lureHeld, 0, 2, 0);
  const st = s.stats;
  ['totalRolls','deepest','flawlessAurora','noHitWaves','legendaryCatch','lumina','gilded']
    .forEach(k=> st[k] = num(st[k], 0, 1e9, 0));
  if (!Array.isArray(st.rarityGot) || st.rarityGot.length !== 7) st.rarityGot = [0,0,0,0,0,0,0];
  st.rarityGot = st.rarityGot.map(v=> num(v, 0, 1e9, 0));
  ['plays','best','wins','gamesCleared'].forEach(k=>{
    const m = st[k]; if (!m || typeof m !== 'object'){ st[k] = {}; return; }
    for (const id in m) m[id] = num(m[id], 0, 1e12, 0);
  });
  s.opt.mus = clamp(Number(s.opt.mus)||0, 0, 1);
  s.opt.sfx = clamp(Number(s.opt.sfx)||0, 0, 1);
  s.opt.fs  = clamp(Number(s.opt.fs)||1, 0.85, 1.5);
  s.name = String(s.name || 'PIP').replace(/[^A-Za-z0-9 ]/g,'').slice(0,8).toUpperCase() || 'PIP';
  if (!Array.isArray(s.rotation.list)) s.rotation.list = [];
  s.rotation.list = s.rotation.list.filter(k=> GAME_KEYS.indexOf(k) >= 0).slice(0,5);
  return s;
}

/* ---- progression maths ---- */
const xpNeeded = (lv)=> 70 + (lv-1)*55;
const prestigeMult = ()=> 1 + State.prestige * 0.22;
const luckBonus   = ()=> State.gear.luck * 0.06 + State.prestige * 0.05;
const gearCost = (g)=> Math.round(g.cost * Math.pow(g.grow, State.gear[g.k]));
function addFish(n){ n = Math.max(0, Math.round(n)); State.fish += n; State.lifetimeFish += n; }
function addXP(n){
  State.xp += Math.round(n);
  let ups = 0;
  while (State.level < MAX_LEVEL && State.xp >= xpNeeded(State.level)){
    State.xp -= xpNeeded(State.level); State.level++; ups++;
  }
  if (State.level >= MAX_LEVEL) State.xp = Math.min(State.xp, xpNeeded(MAX_LEVEL));
  if (ups){ Audio_.sfx('levelup'); toast('LEVEL UP! LV ' + State.level); }
  return ups;
}
function trimColor(){ return TRIMS[Math.min(State.prestige, TRIMS.length-1)]; }

/* ---- loot ---- */
function rollRarity(bonus){
  const luck = 1 + (bonus||0) + luckBonus();
  const p = State.pity;
  let forceMin = 0;
  if (p.mythic >= 220) forceMin = R_MYTHIC;
  else if (p.legend >= 65) forceMin = R_LEGEND;
  else if (p.epic >= 22) forceMin = R_EPIC;
  const w = [];
  let softMyth = p.mythic > 150 ? 1 + (p.mythic-150)*0.06 : 1;
  for (let i=0;i<6;i++){
    let ww = RARITY[i].w;
    if (i >= 2) ww *= Math.pow(luck, i-1);
    if (i === 5) ww *= softMyth;
    w.push(i < forceMin ? 0 : ww);
  }
  const tot = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot, out = forceMin;
  for (let i=0;i<6;i++){ r -= w[i]; if (r <= 0){ out = i; break; } }
  p.rolls++;
  p.epic   = out >= R_EPIC   ? 0 : p.epic+1;
  p.legend = out >= R_LEGEND ? 0 : p.legend+1;
  p.mythic = out >= R_MYTHIC ? 0 : p.mythic+1;
  return out;
}
function rollLoot(bonus, slotFilter){
  const rarity = rollRarity(bonus);
  const pool = COS.all.filter(i=> i.rarity === rarity && !i.q && (!slotFilter || i.slot === slotFilter));
  const fresh = pool.filter(i=> !State.owned[i.id]);
  State.stats.totalRolls++;
  if (fresh.length){
    const it = pick(fresh);
    State.owned[it.id] = 1;
    State.stats.rarityGot[rarity] = (State.stats.rarityGot[rarity]||0) + 1;
    return {item:it, dupe:false, rarity:rarity};
  }
  if (pool.length){
    const it = pick(pool);
    const pearls = [1,2,4,8,16,40][rarity];
    State.pearls += pearls;
    State.stats.rarityGot[rarity] = (State.stats.rarityGot[rarity]||0) + 1;
    return {item:it, dupe:true, pearls:pearls, rarity:rarity};
  }
  State.pearls += 5;
  return {item:null, dupe:true, pearls:5, rarity:rarity};
}
function grantItem(id, silent){
  const it = COS.byId[id]; if (!it) return false;
  if (State.owned[id]) return false;
  State.owned[id] = 1;
  if (it.rarity < 6) State.stats.rarityGot[it.rarity] = (State.stats.rarityGot[it.rarity]||0) + 1;
  if (!silent){ Audio_.sfx('unlock'); toast('UNLOCKED: ' + it.name); }
  return true;
}
function ownedCount(){ return Object.keys(State.owned).filter(id=>COS.byId[id]).length; }

/* ---- seasonal events (date driven, works fully offline) ---- */
const EVENTS = [
  {k:'longnight', n:'The Long Night', from:[9,25], to:[10,2],  grants:'trail_ghost',
   blurb:'Ghostly lights over the floes. The Ghost Trail can be earned only now.'},
  {k:'frostfall', n:'Frostfall',      from:[11,18], to:[0,2],  grants:null,
   blurb:'Double fish from every vault run.'},
  {k:'midsummer', n:'Midnight Sun',   from:[5,18], to:[5,26],  grants:null,
   blurb:'The sun never sets: +50% XP.'}
];
function activeEvent(d){
  d = d || new Date(); const m = d.getMonth(), day = d.getDate();
  for (const e of EVENTS){
    const [fm,fd] = e.from, [tm,td] = e.to;
    const after = (m > fm) || (m === fm && day >= fd);
    const before= (m < tm) || (m === tm && day <= td);
    if (fm <= tm ? (after && before) : (after || before)) return e;
  }
  return null;
}
function eventFishMult(){ const e = activeEvent(); return e && e.k === 'frostfall' ? 2 : 1; }

      const cfg = TRAIL_CFG[item.fam] || {shape:'sq'};
      for (let i=0;i<7;i++){
        const px = 4 + i*2.2, py = 22 + Math.sin(i*1.1)*4;
        c.fillStyle = i%2 ? item.c[0] : item.c[1];
        if (cfg.shape === 'ring'){ c.fillRect(px,py,2,1); c.fillRect(px,py+1,2,1); }
        else c.fillRect(px, py, 2, 2);
      }
    }
    if (item.slot === 'emote'){
      c.fillStyle = '#ffd166';
      drawText(c, '!', 30, 6, '#ffd166', 1);
      c.fillRect(6,10,1,3); c.fillRect(4,12,1,3);
    }
  }
  thumbCache.set(item.id, cn);
  return cn;
}
function rarityTagHTML(r){
  const R = RARITY[r];
  return '<span class="rtag" style="color:'+R.c+'">' + raritySvg(r,9) + R.n + '</span>';
}

const UI = {

      $('#pvEquip').disabled = !owned;
    } else {
      box.innerHTML = '<div class="t">'+State.name+' <button class="iconbtn" id="pvRename" '+

    }

  pvDraw(c){
    c.clearRect(0,0,72,72);
    c.fillStyle = State.opt.hc ? '#000' : '#0d1a3a'; c.fillRect(0,0,72,72);
    c.fillStyle = State.opt.hc ? '#001d2e' : '#16305e'; c.fillRect(0,52,72,20);
    for (let i=0;i<6;i++){ c.fillStyle = State.opt.hc?'#003':'#1d3d72'; c.fillRect(i*13+((this.pvT||0)/9+i*3)%13|0, 56+i%3*4, 5,1); }
    const cos = Object.assign({}, State.equipped);
    const sel = this.ward.sel;
    if (sel && COS.byId[sel] && State.owned[sel]) cos[COS.byId[sel].slot] = sel;
    else if (sel && COS.byId[sel]) cos[COS.byId[sel].slot] = sel; /* preview locked items too */
    const t = this.pvT = (this.pvT||0) + 1;
    const bob = Math.sin(t/22) > 0 ? 0 : 1;
    const o = {cos:cos, pose:'idle', frame:(t/26|0)%2, trim:trimColor(), scale:2};
    /* trail preview */
    const tr = cos.trail;
    if (tr && TRAIL_CFG[COS.byId[tr] && COS.byId[tr].fam]){
      const it = COS.byId[tr], cfg = TRAIL_CFG[it.fam];
      for (let i=0;i<9;i++){
        const ph = (t/2 + i*7) % 60;
        const px = 12 - ph*0.35, py = 44 + Math.sin((t/9)+i)*5 + ph*(cfg.vy||0)*2;
        c.fillStyle = i%2 ? it.c[0] : it.c[1];
        c.globalAlpha = 1 - ph/60;
        c.fillRect(px|0, py|0, 3, 3);
      }
      c.globalAlpha = 1;
    }
    drawSeal(c, 14, 22 + bob, o);
    const bg = cos.badge;
    if (bg && COS.byId[bg]) drawBadgeIcon(c, 60, 4, COS.byId[bg].fam, RARITY[COS.byId[bg].rarity].c, 1);
  },
  equipSelected(){
    const id = this.ward.sel; if (!id || !State.owned[id]) return;
    const it = COS.byId[id];
    if (State.equipped[it.slot] === id){
      if (it.slot === 'fur') return;
      State.equipped[it.slot] = null;
    } else State.equipped[it.slot] = id;
    Audio_.sfx('select'); saveGame(); this.renderWardrobe();

function pickRotation(seed){
  const r = mulberry32(seed >>> 0), keys = GAME_KEYS.slice();
  for (let i=keys.length-1;i>0;i--){ const j = (r()*(i+1))|0; const t = keys[i]; keys[i]=keys[j]; keys[j]=t; }
  return keys.slice(0,5);
}
function currentRotation(){
  const d = dayIndex();
  if (State.rotation.day !== d || !State.rotation.list.length){
    State.rotation.day = d; State.rotation.rerolls = 0;
    State.rotation.list = pickRotation(d);
    saveGame();
  }
  return State.rotation.list;
}

   14. SHARED SCENERY PAINTERS
   ============================================================ */
function skyPalette(){
  const h = new Date().getHours();
  if (h < 5 || h >= 21) return {a:'#070f2e', b:'#12224e', night:1};
  if (h < 8)  return {a:'#2b2a5e', b:'#7a5a8c', night:0.4};
  if (h < 17) return {a:'#2f6fb5', b:'#8fd3ff', night:0};
  if (h < 20) return {a:'#3a3a7a', b:'#f2934a', night:0.2};
  return {a:'#141a44', b:'#3a3a7a', night:0.7};
}
function drawSky(c, t, sp){
  sp = sp || skyPalette();
  const g = c.createLinearGradient(0,0,0,110);
  g.addColorStop(0, sp.a); g.addColorStop(1, sp.b);
  c.fillStyle = g; c.fillRect(0,0,VW,110);
  if (sp.night > 0.3){
    for (let i=0;i<40;i++){
      const x = (i*61 % VW), y = (i*37 % 70);
      const tw = (Math.sin(t/28 + i) > 0.3) ? 1 : 0.4;
      c.globalAlpha = tw * sp.night; c.fillStyle = '#ffffff'; c.fillRect(x, y, 1, 1);
    }
    c.globalAlpha = 1;
    /* aurora ribbons */
    for (let b=0;b<3;b++){
      const col = ['#7bffe0','#4fd6ff','#b06bff'][b];
      c.globalAlpha = 0.16 + 0.06*Math.sin(t/60 + b);
      c.fillStyle = col;
      for (let x=0;x<VW;x+=2){
        const y = 16 + b*9 + Math.sin(x/26 + t/48 + b*1.7)*7;
        c.fillRect(x, y, 2, 10 + Math.sin(x/13 + t/30)*4);
      }
    }
    c.globalAlpha = 1;
    c.fillStyle = '#f6fbff'; c.fillRect(196,14,10,10); c.fillStyle = sp.a; c.fillRect(200,12,8,9);
  } else {
    c.fillStyle = '#fff6c8'; c.fillRect(198,16,10,10); c.fillRect(196,18,14,6); c.fillRect(200,14,6,14);
    for (let i=0;i<3;i++){
      const x = ((t/(6+i*3) + i*90) % (VW+60)) - 60, y = 20 + i*13;
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.fillRect(x,y,22,4); c.fillRect(x+5,y-3,12,4); c.fillRect(x+12,y-1,14,3);
    }
  }
}
function drawMountains(c, camx, sp){
  c.fillStyle = sp.night>0.3 ? '#1a2450' : '#5f86b8';
  for (let i=0;i<8;i++){
    const bx = (i*70 - camx*0.25) % 560 - 60;
    const h = 26 + (i%3)*10;
    for (let j=0;j<h;j++) c.fillRect(bx + 30 - j*1.1, 100 - j, j*2.2, 1);
  }
  c.fillStyle = sp.night>0.3 ? '#2a3768' : '#8fb8e0';
  for (let i=0;i<8;i++){
    const bx = (i*70 - camx*0.25) % 560 - 60;
    const h = 26 + (i%3)*10;
    for (let j=h-8;j<h;j++) c.fillRect(bx + 30 - j*1.1, 100 - j, j*0.9, 1);
  }
}
function drawSeaBand(c, y, h, t, deep){
  c.fillStyle = deep || '#1a4a8a'; c.fillRect(0,y,VW,h);
  c.fillStyle = 'rgba(255,255,255,.20)';
  for (let i=0;i<26;i++){
    const x = (i*19 + Math.sin(t/22 + i)*7) % VW;
    c.fillRect(x|0, y + 2 + (i%4)*3, 5, 1);
  }
}
function drawIceEdge(c, y, col, col2){
  c.fillStyle = col; c.fillRect(0,y,VW,VH-y);
  c.fillStyle = col2;
  for (let x=0;x<VW;x+=4){ const d = ((x*7)%3); c.fillRect(x, y-d, 4, d+2); }
}
function shadowUnder(c, x, y, w){
  c.fillStyle = 'rgba(10,20,45,.30)'; c.fillRect(x, y, w, 2);
}

    this.px = clamp(this.px + mv*spd, 12, HUB_W-24);
    if (mv) this.facing = mv;
    this.anim += Math.abs(mv);
    this.frame = (this.anim/7|0) % 2;
    /* trail while moving */
    if (mv && State.equipped.trail && this.t%3===0)
      Particles.spawnTrail(State.equipped.trail, this.px + 4 - this.camx(), WALK_Y+10, -mv, 0);
    /* nearest spot */
    this.near = null;
    let best = 26;
    for (const s of SPOTS){ const d = Math.abs(s.x + 10 - (this.px+12)); if (d < best){ best = d; this.near = s; } }
    let nearNpc = null; best = 22;
    for (const n of this.npcs){ const d = Math.abs(n.x + 12 - (this.px+12)); if (d < best){ best = d; nearNpc = n; } }
    if (Input.hit('a')){
      if (this.near) { Audio_.sfx('select'); this.near.act(); }
      else if (nearNpc){ nearNpc.talk = 150; this.bubble = pick(nearNpc.lines); this.bubbleT = 150; this.bubbleX = nearNpc.x; Audio_.sfx('blip'); }
    }
    if (Input.hit('b')){ this.emoteT = 90; Audio_.sfx('blip'); }
    if (this.emoteT > 0) this.emoteT--;
    if (this.bubbleT > 0) this.bubbleT--;
    /* npc wander */
    for (const n of this.npcs){
      if (n.talk > 0){ n.talk--; continue; }
      if (n.wait > 0){ n.wait--; continue; }
      n.x += n.dir * n.spd;
      if (n.x < n.home - 26 || n.x > n.home + 26 || n.x < 8 || n.x > HUB_W-24){ n.dir *= -1; n.wait = 40 + rndi(120); }
      if (chance(0.004)){ n.dir *= -1; n.wait = 30 + rndi(90); }
    }
    Particles.update();
  },
  camx(){ return clamp(this.px - VW/2 + 12, 0, HUB_W - VW); },
  draw(c){
    const t = this.t, sp = skyPalette(), cam = this.camx();
    drawSky(c, t, sp);
    drawMountains(c, cam, sp);
    drawSeaBand(c, 84, 14, t, sp.night>0.3 ? '#0e2a55' : '#1a4a8a');
    /* ground: ice on the left, sand from x=430 */
    c.fillStyle = sp.night>0.3 ? '#b9d6ef' : '#e6f4ff'; c.fillRect(0,98,VW,VH-98);
    const sandStart = 430 - cam;
    if (sandStart < VW){
      c.fillStyle = sp.night>0.3 ? '#c0a878' : '#e8cf9a';
      c.fillRect(Math.max(0,sandStart), 98, VW - Math.max(0,sandStart), VH-98);
      /* dither the ice/sand seam so it is not a hard vertical edge */
      for (let i=0;i<14;i++){
        const bx = sandStart - 14 + i;
        if (bx < 0 || bx >= VW) continue;
        for (let by=98; by<VH; by+=2) if ((hash2(i, by) % 14) < i) c.fillRect(bx, by, 1, 2);
      }
      c.fillStyle = sp.night>0.3 ? '#a08a5c' : '#c9a86a';
      for (let i=0;i<50;i++){ const x = 430 + i*7 - cam; if (x>0&&x<VW) c.fillRect(x, 110 + (i%6)*8, 2,1); }
    }
    c.fillStyle = sp.night>0.3 ? '#8fb8d8' : '#cfe9ff';
    for (let x=0;x<VW;x+=6){ const w = 98 + ((x+cam)%12<6?0:1); c.fillRect(x, w, 6, 2); }
    /* a packed-snow path along the walk line, then the floe edge and open water */
    c.fillStyle = sp.night>0.3 ? '#a8c8e4' : '#dbecfb';
    c.fillRect(0, WALK_Y+10, VW, 12);
    c.fillStyle = sp.night>0.3 ? '#7fa8cc' : '#b9d6ef';
    for (let x=0;x<VW;x+=5) c.fillRect(x, WALK_Y+22, 5, 1 + ((x+cam)%10<5?1:0));
    drawSeaBand(c, WALK_Y+24, VH-(WALK_Y+24), t, sp.night>0.3 ? '#0e2a55' : '#2a6ab5');
    /* scenery props, then structures - all behind the walk line */
    for (const d of DECOR) this.drawProp(c, d.x - cam, BUILD_Y, d.k, t, sp);
    for (const s of SPOTS) this.drawSpot(c, s.x - cam, BUILD_Y, s.k, t, sp);
    /* one small sign per structure, all at the same height so they never collide */
    for (const s of SPOTS){
      if (s === this.near) continue;
      const x = s.x - cam + 11;
      if (x < -20 || x > VW+20) continue;
      drawTextC(c, s.s, x, BUILD_Y - 46, sp.night>0.3 ? '#8fa3d6' : '#4a6a9a', 1, sp.night>0.3?'#0d1024':'#f6fbff');
    }
    /* npcs */
    for (const n of this.npcs){
      const x = n.x - cam;
      if (x < -40 || x > VW+40) continue;
      const bob = Math.sin((t + n.bob)/24) > 0 ? 0 : 1;
      shadowUnder(c, x+3, WALK_Y+14, 21);
      drawSeal(c, x, WALK_Y+bob, {cos:n.cos, facing:n.dir, frame:(t/16|0)%2});
      if (n.talk > 0 && this.bubble && Math.abs(n.x - this.bubbleX) < 2) this.speech(c, x, WALK_Y-6, this.bubble);
    }
    /* player */
    const px = this.px - cam;
    const bob = Math.sin(t/22) > 0 ? 0 : 1;
    shadowUnder(c, px+3, WALK_Y+14, 21);
    let o = playerLook({facing:this.facing, frame:this.frame, pose:'idle'});
    if (this.emoteT > 0) applyEmote(o, State.equipped.emote, 90 - this.emoteT, px, WALK_Y);
    drawSeal(c, px + (o.dx||0), WALK_Y + bob + (o.dy||0), o);
    Particles.draw(c);
    /* interaction prompt - only for the spot you are standing at, so signs never collide */
    if (this.near){
      const x = clamp(this.near.x - cam + 11, 30, VW-30);
      const yy = BUILD_Y - 52 + (Math.sin(t/12)>0?0:1);
      const w = textW(this.near.n,1) + 8;
      c.fillStyle = 'rgba(13,16,36,.82)'; c.fillRect(x-w/2, yy-2, w, 20);
      c.fillStyle = '#4fd6ff'; c.fillRect(x-w/2, yy-2, w, 1); c.fillRect(x-w/2, yy+17, w, 1);
      drawTextC(c, this.near.n, x, yy+1, '#ffffff', 1);
      drawTextC(c, 'PRESS A', x, yy+9, '#ffd166', 1);
    }
    /* hud */
    this.hud(c);
  },
  speech(c, x, y, txt){
    const w = Math.min(textW(txt,1)+6, 150);
    const bx = clamp(x - w/2 + 12, 2, VW-w-2);
    c.fillStyle = '#0d1024'; c.fillRect(bx-1, y-9, w+2, 13);
    c.fillStyle = '#f6fbff'; c.fillRect(bx, y-8, w, 11);
    drawText(c, txt, bx+3, y-5, '#0d1024', 1);
  },
  drawProp(c, x, y, k, t, sp){
    if (x < -30 || x > VW+20) return;
    const R = (a,b,w,h,col)=>{ c.fillStyle = col; c.fillRect(x+a, y+b, w, h); };
    const night = sp.night > 0.3;
    switch(k){
      case 'mound':
        R(0,-5,16,5,night?'#cfe9ff':'#f6fbff'); R(3,-8,10,3,night?'#dff3ff':'#ffffff'); R(0,-1,16,1,'#b9d6ef'); break;
      case 'berg':
        R(2,-14,10,14,night?'#a8cbe8':'#dff3ff'); R(4,-18,6,4,night?'#c3ddf2':'#f6fbff');
        R(0,-6,14,6,night?'#9dc9f0':'#cfe9ff'); R(5,-16,2,10,'#ffffff'); break;
      case 'crate':
        R(0,-9,12,9,'#8a5a34'); R(1,-8,10,7,'#a87446'); R(0,-6,12,1,'#5e3b21'); R(0,-3,12,1,'#5e3b21');
        R(2,-12,8,3,'#4fd6ff'); R(3,-11,2,1,'#9ee5ff'); break;
      case 'flag':
        R(2,-20,2,20,'#8a5a34'); R(4,-20,9,6,(t/24|0)%2 ? '#4fd6ff':'#39c9c0'); R(4,-14,7,2,'#2a8fb0'); break;
      case 'kelp':
        for (let i=0;i<3;i++){ const w = Math.sin(t/26+i)*2;
          R(i*5+w,-10,2,10,'#3f7a5a'); R(i*5+w-1,-12,4,3,'#5aa86b'); } break;
      case 'fire': {
        R(-1,-3,14,3,'#5e3b21'); R(1,-5,10,2,'#8a5a34');
        const f = (t/6|0)%3;
        R(4,-11-f,4,7,'#f2934a'); R(5,-13-f,2,4,'#ffd166'); R(3,-8,6,4,'#e05a5a');
        if (!State.opt.noflash && t % 7 === 0) Particles.burst(x+6, y-12, '#f2934a', 1, 0.5, 'sq');
        break; }
    }
  },
  drawSpot(c, x, y, k, t, sp){
    if (x < -60 || x > VW+40) return;
    const R = (a,b,w,h,col)=>{ c.fillStyle = col; c.fillRect(x+a, y+b, w, h); };
    switch(k){
      case 'vault':
        R(-4,-40,28,40,'#9dc9f0'); R(-1,-37,22,37,'#cfe9ff'); R(2,-30,16,30,'#2a3768');
        R(4,-27,12,27,'#4a5a8a'); R(8,-16,4,4,'#ffd166');
        R(2,-34,16,3,'#7fd4ff'); R(-6,-42,32,3,'#dff3ff');
        for (let i=0;i<3;i++){ const gy = -24+i*7; R(5,gy,2,1, (t/12|0)%3===i ? '#7bffe0':'#3a5a8a'); R(13,gy,2,1,(t/12|0)%3===i?'#7bffe0':'#3a5a8a'); }
        break;
      case 'ward': {
        /* igloo: stacked snow-block courses under a dome */
        const dome = [[9,10],[5,18],[2,24],[0,28],[-1,30],[-1,30],[-1,30]];
        dome.forEach((d,i)=> R(d[0], -28+i*4, d[1], 4, i%2 ? '#f6fbff' : '#e8f4ff'));
        c.fillStyle = '#c3ddf2';
        for (let i=0;i<7;i++) c.fillRect(x + dome[i][0], y-28+i*4, dome[i][1], 1);
        for (let i=2;i<7;i++) for (let k=0;k<dome[i][1];k+=7) c.fillRect(x + dome[i][0] + k, y-28+i*4, 1, 4);
        R(-4,-12,8,12,'#e8f4ff'); R(-5,-13,10,2,'#f6fbff');    /* entry tunnel */
        R(-3,-10,6,10,'#3a5580'); R(-2,-8,4,8,'#22314f');
        R(11,-34,3,6,'#d94f4f'); R(9,-35,9,2,'#8a5a34');       /* scarf on a pole */
        R(11,-30,7,2,'#ff9ecb');
        break; }
      case 'shop':
        R(0,-8,26,8,'#8a5a34'); R(0,-9,26,2,'#5e3b21');
        R(1,-24,24,8,'#d94f4f'); for(let i=0;i<6;i++) R(1+i*4,-24,2,8,'#f6fbff');
        R(2,-26,2,18,'#5e3b21'); R(22,-26,2,18,'#5e3b21');
        R(4,-14,6,5,'#4aa8ff'); R(12,-14,6,5,'#5be584'); R(5,-13,4,3,'#9ee5ff');
        break;
      case 'gacha':
        R(2,-30,20,30,'#3a2a5a'); R(4,-28,16,18,'#7bffe0'); R(5,-27,14,16,'#1b2a4a');
        for (let i=0;i<5;i++){ const bx=6+((i*5+((t/40|0)%3))%13), by=-26+((i*4)%12);
          R(bx,by,3,3, ['#ff5c7a','#ffd166','#4fd6ff','#b06bff','#5be584'][i]); }
        R(8,-9,8,5,'#ffd166'); R(10,-7,4,2,'#0d1024'); R(2,-33,20,3,'#b06bff');
        break;
      case 'board':
        R(3,-6,3,6,'#5e3b21'); R(17,-6,3,6,'#5e3b21');
        R(-1,-24,26,18,'#8a5a34'); R(1,-22,22,14,'#c9a86a');
        R(3,-20,7,5,'#f6fbff'); R(12,-20,8,4,'#f6fbff'); R(4,-13,9,4,'#f6fbff');
        break;
      case 'totem':
        R(4,-42,16,42,'#7a869c'); R(6,-40,12,40,'#a8b2c4');
        R(7,-36,10,8,'#4a5a8a'); R(9,-34,6,4, (t/20|0)%2 ? '#7bffe0':'#4fd6ff');
        R(7,-24,10,8,'#4a5a8a'); R(9,-22,6,4,'#b06bff');
        R(7,-12,10,8,'#4a5a8a'); R(9,-10,6,4,'#ffd166');
        R(2,-46,20,4,'#dff3ff'); R(0,-44,24,2,'#9dc9f0');
        break;
      case 'marlin': {
        const bob = Math.sin(t/26)>0?0:1;
        R(-8,2,12,5,'#8a5a34'); R(-6,0,8,2,'#5e3b21');            /* bait crate */
        drawSeal(c, x+4, y+6+bob, {cos:{fur:'fur_slate', head:'head_fishermanhat', face:'face_seadogstache'},
                                    facing:-1, frame:(t/30|0)%2});
        c.fillStyle = '#c9a86a'; c.fillRect(x-3, y-6, 1, 14);      /* rod */
        c.fillStyle = '#f6fbff';
        for (let i=0;i<9;i++) c.fillRect(x-4-i, y-6+i*2, 1, 1);    /* line into the water */
        if (State.quests.fisherman === 3){ drawText(c,'!',x+26,y-12,(t/12|0)%2?'#ff5c7a':'#ffd166',2,'#0d1024'); }
        break; }
    }
  },
  hud(c){
    c.fillStyle = 'rgba(13,16,36,.72)'; c.fillRect(0,0,VW,11);
    drawText(c, State.name, 3, 2, '#ffffff', 1);
    const bg = State.equipped.badge;
    if (bg && COS.byId[bg]) drawBadgeIcon(c, 4 + textW(State.name,1) + 4, 2, COS.byId[bg].fam, RARITY[COS.byId[bg].rarity].c, 1);
    drawText(c, 'F' + fmt(State.fish), 74, 2, '#ffd166', 1);
    drawText(c, 'P' + fmt(State.pearls), 122, 2, '#9ee5ff', 1);
    drawText(c, 'LV' + State.level, 166, 2, '#7bffe0', 1);
    if (State.prestige) drawText(c, '*'+State.prestige, 200, 2, TRIMS[Math.min(State.prestige,5)], 1);
    const ev = activeEvent();
    if (ev) drawTextC(c, ev.n + ' EVENT', VW/2, 14, '#ffd166', 1, '#0d1024');
  }
};
function talkMarlin(){

/* ============================================================
   16. EMOTES
   ============================================================ */
function applyEmote(o, id, t, sx, sy){
  const it = COS.byId[id]; if (!it){ return o; }
  const f = it.fam; o.dx = 0; o.dy = 0;
  const P_ = (col,n,shape)=>{ if (t % 6 === 0) Particles.burst(sx+12, sy+2, col, n||2, 1.2, shape); };
  switch(f){
    case 'wave':   o.frame = (t/5|0)%2; break;
    case 'clap':   o.frame = (t/4|0)%2; P_('#ffffff',1,'plus'); break;
    case 'bounce': o.dy = -Math.abs(Math.sin(t/7))*6|0; break;
    case 'shiver': o.dx = (t%4<2?1:-1); break;
    case 'spin':   o.rot = t*0.22; break;
    case 'sleep':  o.pose='sleep'; if (t%20===0) Particles.burst(sx+20, sy-2, '#9ee5ff',1,0.6,'sq'); break;
    case 'dance':  o.dy = -Math.abs(Math.sin(t/6))*4|0; o.facing = (t/12|0)%2?1:-1; break;
    case 'sing':   o.frame=(t/6|0)%2; if (t%8===0) Particles.burst(sx+18, sy, '#ffffff',1,0.8,'note'); break;
    case 'flex':   o.frame = (t/3|0)%2; o.dy = -1; P_('#ffd166',1,'star'); break;
    case 'bow':    o.rot = Math.sin(t/12)*0.25; break;
    case 'roar':   o.frame=1; o.dx = (t%3?0:1); if (t%14===0){ Particles.burst(sx+22,sy+4,'#ffffff',6,2,'ring'); Audio_.sfx('splash'); } break;
    case 'backflip': o.rot = (t/34)*Math.PI*2; o.dy = -Math.sin(t/34*Math.PI)*16|0; break;
    case 'splash': o.dy = Math.min(0, -12 + t*0.5)|0; if (t===26){ Particles.burst(sx+12,sy+12,'#9ee5ff',12,2.4,'ring'); Audio_.sfx('splash'); } break;
    case 'fishtoss': o.frame=(t/6|0)%2; if (t%22===0) Particles.burst(sx+20,sy-4,'#ffd166',3,1.6,'sq'); break;
    case 'snowangel': o.rot = Math.PI/2; o.dy = 6; if (t%5===0) Particles.burst(sx+12,sy+6,'#ffffff',2,1,'sq'); break;
    case 'heart':  P_('#ff5c7a',2,'heart'); o.dy = -Math.abs(Math.sin(t/9))*3|0; break;
    case 'pose':   o.frame=1; o.dy=-2; P_('#ffd166',1,'star'); break;
    case 'discoball': o.dy = -Math.abs(Math.sin(t/5))*5|0; o.facing=(t/8|0)%2?1:-1;
                   if (t%4===0) Particles.burst(sx+12,sy-8,PRISM[(t/4|0)%6],2,1.6,'sq'); break;
    case 'ghostly': o.alpha = 0.4 + 0.6*Math.abs(Math.sin(t/14)); P_('#bfe9ff',1,'ghost'); break;
    case 'float':  o.dy = -4 - Math.sin(t/16)*3|0; o.rot = Math.sin(t/22)*0.2; P_('#9ee5ff',1,'ring'); break;
    case 'founder': o.frame=(t/4|0)%2; o.dy=-2; if (t%6===0) Particles.burst(sx+12,sy-6,'#ffd166',2,1.4,'star'); break;
  }
  return o;
}

/* ============================================================
   17. GAME RUNNER + RESULTS
   ============================================================ */
const Runner = {key:null, g:null, paused:false};
function startGame(key){
  const g = GAMES[key];
  if (!g || !g.start) { toast('VAULT SEALED'); return; }
  Runner.key = key; Runner.g = g; Runner.paused = false;
  Particles.clear();
  g.start();
  setScene('game');
  Audio_.play(g.music || 'action');
  updateHint();
}
function finishGame(o){
  const key = Runner.key;
  const fishMult = prestigeMult() * eventFishMult();
  const fish = Math.round((o.fish||0) * fishMult);
  const xp   = Math.round((o.xp||0) * eventXpMult());
  addFish(fish); addXP(xp);
  recordPlay(key, o.score, o.cleared !== false);
  if (o.win) recordWin(key);
  const loot = [];
  const rolls = clamp(o.rolls||0, 0, 6);
  for (let i=0;i<rolls;i++) loot.push(rollLoot(o.luck||0));
  const unlocked = checkQuests(true);
  saveGame(); UI.refreshTop();
  Results.set({key:key, title:o.title || (o.win ? 'VAULT CLEARED' : 'RUN COMPLETE'),
               score:o.score||0, fish:fish, xp:xp, loot:loot, unlocked:unlocked, note:o.note||''});
  setScene('results');
}
const Results = {
  data:null, reveal:0, t:0,
  set(d){ this.data = d; this.reveal = 0; this.t = 0;
    const best = d.loot.reduce((a,r)=>Math.max(a, r.dupe?-1:r.rarity), -1);
    setTimeout(()=>Audio_.sfx(best>=R_LEGEND?'legend':best>=R_EPIC?'unlock':'good'), 260);
  },
  update(){
    this.t++;
    if (this.t > 40 && this.reveal < this.data.loot.length && this.t % 26 === 0){
      this.reveal++;
      const r = this.data.loot[this.reveal-1];
      Audio_.sfx(r.dupe ? 'blip' : r.rarity >= R_EPIC ? 'unlock' : 'coin');
      if (!r.dupe && r.rarity >= R_EPIC && !State.opt.noflash) shake();
    }
    if (Input.hit('a') || (Input.ptr.tapped && this.t > 20)){
      if (this.reveal < this.data.loot.length && this.t > 40){ this.reveal = this.data.loot.length; }
      else { Hub.init(); setScene('hub'); }
    }
    if (Input.hit('b')) startGame(this.data.key);
    Particles.update();
  },
  draw(c){
    const d = this.data, t = this.t;
    const hasUnlock = d.unlocked && d.unlocked.length;
    drawSky(c, t, {a:'#0a1130', b:'#1b2a56', night:1});
    drawIceEdge(c, 134, '#cfe9ff', '#f6fbff');
    c.fillStyle = 'rgba(9,12,30,.86)'; c.fillRect(6,10,VW-12,108);
    c.strokeStyle = '#4fd6ff'; c.lineWidth = 1; c.strokeRect(6.5,10.5,VW-13,107);
    drawTextC(c, d.title, VW/2, 14, '#7bffe0', 1, '#0d1024');
    drawTextC(c, GAMES[d.key].n, VW/2, 24, '#ffffff', 1);
    drawText(c, 'SCORE ' + fmt(d.score), 12, 38, '#ffffff', 1);
    drawText(c, 'FISH  +' + fmt(d.fish), 12, 48, '#ffd166', 1);
    drawText(c, 'XP    +' + fmt(d.xp), 12, 58, '#7bffe0', 1);
    if ((State.stats.best[d.key]||0) <= d.score && d.score > 0)
      drawText(c, 'NEW BEST!', 12, 70, (t/8|0)%2 ? '#ffd166' : '#ff9ecb', 1);
    if (d.note) drawText(c, d.note.slice(0,15), 12, 82, '#9ee5ff', 1);
    /* loot column */
    const LX = 112, LW = 120, ROWS = hasUnlock ? 3 : 5;
    for (let i=0;i<Math.min(this.reveal, ROWS);i++){
      const r = d.loot[i], y = 32 + i*17;
      const col = RARITY[r.rarity].c;
      c.fillStyle = '#0b1230'; c.fillRect(LX,y,LW,15);

      c.fillStyle = RARITY[R_EXCL].c; c.fillRect(8,94,VW-16,1); c.fillRect(8,115,VW-16,1);
      drawTextC(c, 'QUEST UNLOCK', VW/2, 97, '#7bffe0', 1);
      drawTextC(c, u.name.slice(0,26), VW/2, 106, '#ffffff', 1);
    }
    /* seal doing its victory emote, in front of the panel */
    const o = playerLook({facing:1, frame:(t/8|0)%2});
    applyEmote(o, State.equipped.emote, t, 26, 128);
    drawSeal(c, 26 + (o.dx||0), 128 + (o.dy||0), o);

    drawTextC(c, 'A: HUB    B: PLAY AGAIN', VW/2 + 30, 148, '#2a3f6a', 1, '#dbecfb');

/* ---- floating analog stick -------------------------------------------
   Touch anywhere on the canvas and the stick appears under your thumb;
   drag to steer in any direction, including diagonals. Falls back to the
   d-pad and keyboard, which stay fully usable.                        */
const Stick = {
  active:false, ox:0, oy:0, x:0, y:0, mag:0, R:20,
  reset(){ this.active = false; this.mag = 0; this.x = this.y = 0; },
  poll(){
    if (Input.ptr.down){
      if (!this.active){ this.active = true; this.ox = Input.ptr.x; this.oy = Input.ptr.y; }
      let dx = Input.ptr.x - this.ox, dy = Input.ptr.y - this.oy;
      const d = Math.hypot(dx, dy);
      if (d > this.R){                       /* drag the base along past full deflection */
        this.ox += dx * (1 - this.R/d); this.oy += dy * (1 - this.R/d);
        dx *= this.R/d; dy *= this.R/d;
      }
      this.mag = Math.min(1, d / this.R);
      if (d > 0.001){ this.x = dx/Math.max(d, this.R*this.mag||1); this.y = dy/Math.max(d, this.R*this.mag||1); }
      const n = Math.hypot(dx, dy) || 1;
      this.x = dx/n * this.mag; this.y = dy/n * this.mag;
      if (this.mag < 0.16){ this.x = this.y = 0; this.mag = 0; }
    } else this.reset();
  },
  /* returns a normalised direction with magnitude, or null when idle */
  read(){
    this.poll();
    return (this.active && this.mag > 0) ? {x:this.x, y:this.y, mag:this.mag} : null;
  },
  draw(c){
    if (!this.active) return;
    const ox = this.ox|0, oy = this.oy|0;
    c.globalAlpha = 0.32; c.fillStyle = '#9ee5ff';
    for (let a=0;a<16;a++){
      const px = ox + Math.cos(a*Math.PI/8)*this.R, py = oy + Math.sin(a*Math.PI/8)*this.R;
      c.fillRect(px|0, py|0, 2, 2);
    }
    c.globalAlpha = 0.75; c.fillStyle = '#ffffff';
    c.fillRect((ox + this.x*this.R - 3)|0, (oy + this.y*this.R - 3)|0, 6, 6);
    c.globalAlpha = 1;
  }
};
