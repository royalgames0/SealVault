}

/* ============================================================
   19. FISH DASH - endless swimmer
   ============================================================ */
Object.assign(GAMES.dash, {
  start(){
    const g = this.s = {
      x:40, y:80, vy:0, hp:3+State.gear.blubber, maxhp:3+State.gear.blubber, t:0, dist:0,
      spd:1.5, ents:[], fish:0, gold:0, inv:0, dash:0, dashCd:0, over:0, spawn:0, bub:[],
      smash:0, score2:0, lumina:0, luminaSeen:0, msg:'', msgT:0
    };
    for (let i=0;i<24;i++) g.bub.push({x:rnd(VW), y:rnd(VH), s:rnd(2,1)|0, v:rnd(.5,.15)});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    /* dashing surges the whole world past you, not just your own speed */
    g.spd = 1.5 + g.dist/2600 + (g.dash > 0 ? 4.2 : 0);
    g.dist += g.spd;
    const sp = 1.55 + State.gear.speed*0.06 + (g.dash>0?1.1:0);
    let mx = 0, my = 0;
    if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
    if (Input.key('up')) my -= 1; if (Input.key('down')) my += 1;
    const st = Stick.read(g.x+12, g.y+7);
    if (st){ mx = st.x; my = st.y; }
    g.x = clamp(g.x + mx*sp, 6, 150); g.y = clamp(g.y + my*sp, 22, 142);
    if (Input.hit('b') && g.dashCd <= 0){
      g.dash = 22; g.dashCd = 95; Audio_.sfx('splash'); shake();
      Particles.burst(g.x+4, g.y+7, '#9ee5ff', 10, 2.6, 'ring');
    }
    if (g.dash > 0){
      g.dash--;
      /* smash through anything solid you touch while dashing */
      for (let i=g.ents.length-1;i>=0;i--){
        const e = g.ents[i];
        if (e.t === 'fish' || e.t === 'gfish' || e.t === 'lumina') continue;
        if (aabb({x:g.x, y:g.y+1, w:24, h:13}, {x:e.x, y:e.t==='net'? g.y : e.y, w:e.w, h:e.t==='net'? 13 : e.h})){
          if (e.t === 'net' && Math.abs(g.y+7 - e.y) < 16) continue;   /* already through the gap */
          g.ents.splice(i,1); g.smash++; g.score2 += 25;
          Audio_.sfx('hit'); Particles.burst(e.x+6, e.y+6, '#ffd166', 9, 2.4, 'sq');
        }
      }
      if (g.t % 2 === 0) Particles.burst(g.x+2, g.y+7, '#bfe9ff', 1, 0.6, 'ring');
    }
    if (g.dashCd > 0) g.dashCd--;
    if (g.inv > 0) g.inv--;
    if (State.equipped.trail && g.t%2===0) Particles.spawnTrail(State.equipped.trail, g.x+2, g.y+8, -2, 0);
    /* spawns */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(16, 42 - (g.dist/300|0));
      const r = Math.random();
      if (r < 0.34){ g.ents.push({t:'fish', x:VW+8, y:rnd(136,26), w:8,h:6, a:rnd(6.28)}); }
      else if (r < 0.42){ g.ents.push({t:'gfish', x:VW+8, y:rnd(136,26), w:9,h:7, a:rnd(6.28)}); }
      else if (r < 0.62){ g.ents.push({t:'rock', x:VW+10, y:rnd(120,30), w:16,h:14}); }
      else if (r < 0.82){ const gap = rnd(122,38); g.ents.push({t:'net', x:VW+10, y:gap, w:10, h:0}); }
      else { g.ents.push({t:'orca', x:VW+20, y:rnd(120,30), w:30,h:14, a:rnd(6.28), sp:rnd(1.4,.7)}); }
      if (chance(0.25)) for (let i=0;i<3;i++) g.ents.push({t:'fish', x:VW+8+i*10, y:rnd(130,30), w:8,h:6, a:rnd(6.28)});
      /* the Lumina Fish: about 1 spawn in 420, and only once per run */
      if (!g.luminaSeen && g.dist > 300 && chance(1/420)){
        g.luminaSeen = 1;
        g.ents.push({t:'lumina', x:VW+14, y:rnd(120,34), w:12, h:9, a:rnd(6.28)});
        g.msg = 'SOMETHING IS GLOWING...'; g.msgT = 130; Audio_.sfx('perfect');
      }
    }
    /* entities */
    const pbox = {x:g.x+4, y:g.y+3, w:16, h:9};
    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      e.x -= g.spd + (e.t==='orca'? e.sp : 0);
      if (e.t === 'fish' || e.t === 'gfish') e.y += Math.sin(g.t/18 + e.a)*0.5;
      if (e.t === 'orca') e.y += Math.sin(g.t/26 + e.a)*0.8;
      if (e.t === 'lumina'){
        /* darts about and drifts away from you - it does not want to be caught */
        e.y += Math.sin(g.t/11 + e.a)*1.4;
        e.x += Math.cos(g.t/17 + e.a)*0.5 + 0.35;
        e.y = clamp(e.y, 24, 138);
        if (g.t % 2 === 0) Particles.burst(e.x+5, e.y+4, chance(0.5)?'#b6ffe9':'#7bffe0', 1, 0.5, 'ring');
      }
      if (e.x < -40){ g.ents.splice(i,1); continue; }
      const mag = 3 + State.gear.magnet*3;
      if (e.t === 'lumina'){
        if (dist(e.x+5, e.y+4, g.x+12, g.y+7) < 14){
          g.ents.splice(i,1); g.lumina++;
          Particles.burst(e.x, e.y, '#7bffe0', 26, 3, 'star'); Audio_.sfx('legend'); shake();
          if (g.hp < g.maxhp){ g.hp++; g.msg = 'LUMINA FISH! LIFE RESTORED'; }
          else g.msg = 'LUMINA FISH!';
          g.msgT = 150;
          continue;
        }
      } else if (e.t === 'fish' || e.t === 'gfish'){
        const d = dist(e.x, e.y, g.x+12, g.y+7);
        if (d < 26 + mag){ e.x += (g.x+12-e.x)*0.12; e.y += (g.y+7-e.y)*0.12; }
        if (d < 12){
          g.ents.splice(i,1);
          if (e.t === 'gfish'){ g.gold++; Audio_.sfx('coin'); Particles.burst(e.x,e.y,'#ffd166',6,1.6,'star'); }
          else { g.fish++; Audio_.sfx('fish'); Particles.burst(e.x,e.y,'#9ee5ff',4,1.2,'sq'); }
          continue;
        }
      } else if (g.inv <= 0 && g.dash <= 0){
        let hit = false;
        if (e.t === 'net'){
          hit = (pbox.x < e.x+e.w && pbox.x+pbox.w > e.x) && !(pbox.y > e.y-16 && pbox.y+pbox.h < e.y+16);
        } else hit = aabb(pbox, {x:e.x, y:e.y, w:e.w, h:e.h});
        if (hit){
          g.hp--; g.inv = 70; Audio_.sfx('hurt'); shake();
          Particles.burst(g.x+12, g.y+7, '#ff5c7a', 8, 2, 'sq');
          if (g.hp <= 0){ g.over = 60; Audio_.sfx('fail'); }
        }
      }
    }
    for (const b of g.bub){ b.x -= b.v + g.spd*0.25; b.y -= 0.15; if (b.x < 0){ b.x = VW+4; b.y = rnd(VH); } if (b.y<18) b.y = 150; }
    Particles.update();
  },
  done(){
    const g = this.s;
    const m = Math.floor(g.dist/8);
    let bonusFish = 0, note = m + 'M - ' + g.fish + ' FISH', title = m>=500?'STRONG SWIM':'RUN COMPLETE';
    if (g.lumina){
      const first = !State.owned['trail_lumina'];
      State.stats.lumina = (State.stats.lumina||0) + 1;
      if (!first) bonusFish = 900;                 /* already have the cosmetic - pay out instead */
      note = first ? 'LUMINA FISH CAUGHT!' : 'LUMINA FISH - BONUS FISH!';
      title = 'LUMINA CATCH';
    }
    const score = m + g.fish*6 + g.gold*25 + g.score2 + (g.lumina?1000:0);
    finishGame({score:score, fish: m*0.55 + g.fish*3 + g.gold*14 + g.smash*6 + bonusFish,
      xp: m/7 + g.fish + (g.lumina?60:0), rolls: 1 + Math.floor(m/380) + (g.gold>=3?1:0) + (g.lumina?2:0),
      luck: g.gold*0.02 + (g.lumina?0.3:0), win: m >= 500 || g.lumina>0, title: title, note: note});
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#2a7ac0'); grd.addColorStop(.5,'#12508f'); grd.addColorStop(1,'#07264f');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (let i=0;i<5;i++){ const x = ((i*70 - g.dist*0.5) % 320) - 40; c.fillRect(x, 12, 14, VH); }
    c.fillStyle = '#dff3ff'; c.fillRect(0,12,VW,8); c.fillStyle='#9dc9f0'; c.fillRect(0,20,VW,2);
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (const b of g.bub) c.fillRect(b.x|0, b.y|0, b.s, b.s);
    /* kelp floor */
    c.fillStyle = '#0a2a4a'; c.fillRect(0,152,VW,8);
    for (let i=0;i<14;i++){
      const x = ((i*36 - g.dist*0.9) % 300) - 30;
      c.fillStyle = '#2a6a4a';
      for (let j=0;j<8;j++) c.fillRect(x + Math.sin((g.t/20)+j)*2, 152-j*4, 3, 4);
    }
    for (const e of g.ents){
      const x = e.x|0, y = e.y|0;
      switch(e.t){
        case 'fish': c.fillStyle='#9ee5ff'; c.fillRect(x,y,6,4); c.fillStyle='#4fd6ff'; c.fillRect(x+6,y+1,3,2);
          c.fillStyle='#0d1024'; c.fillRect(x+1,y+1,1,1); break;
        case 'gfish': c.fillStyle='#ffd166'; c.fillRect(x-1,y-1,8,6); c.fillStyle='#e0a05a'; c.fillRect(x+7,y,3,3);
          c.fillStyle='#0d1024'; c.fillRect(x,y,1,1); break;
        case 'rock': c.fillStyle='#4a5470'; c.fillRect(x,y,16,14); c.fillStyle='#6b7590'; c.fillRect(x+2,y+2,12,6);
          c.fillStyle='#39415c'; c.fillRect(x+3,y+9,9,4); break;
        case 'net':
          /* woven mesh with a swim-through gap, floats marking the edges */
          for (let yy=20; yy<VH; yy+=4){
            if (yy > e.y-16 && yy < e.y+16) continue;
            c.fillStyle='#d8d0a8'; c.fillRect(x, yy, 10, 1);
            c.fillStyle='#a89f78';
            for (let k=0;k<10;k+=2) c.fillRect(x + k + ((yy/4|0)%2?1:0), yy+2, 1, 1);
          }
          c.fillStyle='#8a8468'; c.fillRect(x+1, 20, 8, 2);
          c.fillStyle='#e05a5a'; c.fillRect(x, e.y-18, 10, 3); c.fillRect(x, e.y+15, 10, 3);
          c.fillStyle='#ffffff'; c.fillRect(x+1, e.y-17, 3, 1); c.fillRect(x+1, e.y+16, 3, 1);
          break;
        case 'orca':
          c.fillStyle='#141a2e'; c.fillRect(x,y,28,12); c.fillRect(x-4,y+3,6,6); c.fillRect(x+22,y-4,8,5);
          c.fillStyle='#f6fbff'; c.fillRect(x+2,y+7,14,4); c.fillRect(x+3,y+2,4,2);
          c.fillStyle='#f6fbff'; c.fillRect(x-3,y+5,3,2); break;
        case 'lumina': {
          const pu = (g.t/5|0)%2;
          if (!State.opt.noflash){
            c.globalAlpha = 0.18 + 0.10*Math.sin(g.t/6); c.fillStyle = '#7bffe0';
            c.fillRect(x-7, y-6, 24, 20); c.globalAlpha = 1;
          }
          c.fillStyle = pu ? '#e6fffa' : '#b6ffe9'; c.fillRect(x,y,10,7);
          c.fillStyle = '#7bffe0'; c.fillRect(x+10,y+1,4,5); c.fillRect(x-2,y+2,2,3);
          c.fillStyle = '#ffffff'; c.fillRect(x+2,y+1,4,2); c.fillRect(x+1,y+2,1,1);
          c.fillStyle = '#0d3a34'; c.fillRect(x+2,y+3,2,2);
          break; }
      }
    }
    Particles.draw(c);
    if (!(g.inv > 0 && (g.t/4|0)%2)){
      const o = playerLook({facing:1, frame:(g.t/6|0)%2, pose:'swim'});
      if (g.dash > 0) o.rot = -0.15;
      drawSeal(c, g.x, g.y, o);
    }
    if (g.dash > 0){ c.fillStyle='rgba(158,229,255,.5)'; for(let i=1;i<4;i++) c.fillRect(g.x-i*6, g.y+4, 4, 6); }
    Stick.draw(c);
    gameHUD(c, {hp:g.hp, maxhp:g.maxhp, left:'', right:Math.floor(g.dist/8)+'M',
                mid:'FISH '+g.fish+(g.gold?'  GOLD '+g.gold:'')});
    if (g.msgT > 0){ g.msgT--;
      drawTextC(c, g.msg, VW/2, 26, (g.t/6|0)%2 ? '#7bffe0' : '#ffffff', 1, '#0d1024'); }
    if (g.dashCd > 0){ c.fillStyle='#2a3768'; c.fillRect(VW-42,14,40,3); c.fillStyle='#4fd6ff'; c.fillRect(VW-42,14,40*(1-g.dashCd/80),3); }
    else drawText(c,'B: DASH', VW-46, 14, '#7bffe0', 1, '#0d1024');
    if (g.over) bigMsg(c, 'CAUGHT!', Math.floor(g.dist/8)+' METRES');
  }
});

  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.flash>0) g.flash--;
    if (g.hookFx>0) g.hookFx--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }

    if (g.state === 'cast'){
      const cfg = this.throwCfg();
      g.bar += g.dir * cfg.spd;
      if (g.bar > 100){ g.bar = 100; g.dir = -1; }
      if (g.bar < 0){ g.bar = 0; g.dir = 1; }
      if (Input.hit('a') || Input.ptr.tapped){
        const d = Math.abs(g.bar - 50), half = cfg.zone/2;
        if (d <= half*0.32){ g.quality = 2; g.msg = 'PERFECT CAST!'; Audio_.sfx('perfect'); }
        else if (d <= half){ g.quality = 1; g.msg = 'GOOD CAST'; Audio_.sfx('good'); }
        else { g.quality = 0; g.msg = 'SLOPPY CAST'; Audio_.sfx('fail'); }
        g.msgT = 60;
        g.state = 'sink'; g.by = ICE_TOP; g.bx = 120; g.onLine = []; g.depth = 0;
        g.ents = []; g.spawn = 24;
        /* a better cast sinks faster and finds richer water */
        g.vy = 0.30 + g.quality*0.10;
      }
      return;
    }

    if (g.state === 'reel'){
      g.reelT--;
      g.by -= 3.4;
      if (g.by <= ICE_TOP || g.reelT <= 0){ this.landLine(); }
      Particles.update();
      return;
    }

    /* ---- sinking: steer the bobber ---- */
    let mx = 0;
    if (Input.key('left')) mx -= 1;
    if (Input.key('right')) mx += 1;
    if (Input.ptr.down){ const d = Input.ptr.x - g.bx; if (Math.abs(d) > 4) mx = d>0?1:-1; }
    g.bx = clamp(g.bx + mx*(1.9 + State.gear.speed*0.05), 10, VW-10);
    /* slower descent while steering hard, so you can line things up */
    g.by += g.vy;
    g.depth = Math.max(0, Math.round((g.by - ICE_TOP) * 1.6));
    g.deepest = Math.max(g.deepest, g.depth);
    if (g.by > ICE_BOTTOM){ g.msg = 'HIT THE SEABED'; g.msgT = 60; g.reelT = 60; g.state = 'reel'; g.reelKeep = true; }

    /* spawn things at and below the lure */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(14, 34 - g.depth/9);
      const deepT = clamp(g.depth/120, 0, 1);
      const r = Math.random();
      if (r < 0.16 + deepT*0.16){
        /* predators: orca up top, squid and eels deeper */
        const kind = g.depth > 60 && chance(0.5) ? (chance(0.5)?'squid':'eel') : 'orca';
        g.ents.push({t:'threat', kind:kind, x: chance(0.5)? -24 : VW+24, y: g.by + rnd(70,14),
                     sp: (kind==='eel'? 1.5 : kind==='squid'? 0.85 : 1.15) * (1 + deepT*0.5),
                     dir: 0, w: kind==='orca'?30:kind==='squid'?16:22, h: kind==='orca'?13:12, wob:rnd(6.28)});
        g.ents[g.ents.length-1].dir = g.ents[g.ents.length-1].x < 0 ? 1 : -1;
      } else if (r < 0.26 + deepT*0.10){
        const tierMax = Math.min(ICE_TREASURE.length-1, Math.floor(deepT * ICE_TREASURE.length));
        const tier = clamp(Math.floor(rnd(tierMax+1)), 0, ICE_TREASURE.length-1);
        g.ents.push({t:'treasure', tier:tier, x:rnd(VW-24,12), y: g.by + rnd(80,26), w:12, h:10, wob:rnd(6.28)});
      } else {
        const tierMax = Math.min(ICE_FISH.length-1, Math.floor(deepT * ICE_FISH.length));
        const tier = clamp(Math.round(rnd(tierMax+0.6)), 0, ICE_FISH.length-1);
        g.ents.push({t:'fish', tier:tier, x: chance(0.5)? -16 : VW+16, y: g.by + rnd(80,10),
                     sp: rnd(0.9,0.35) + tier*0.12, dir:0, w:10+tier, h:6, wob:rnd(6.28)});
        g.ents[g.ents.length-1].dir = g.ents[g.ents.length-1].x < 0 ? 1 : -1;
      }
    }

    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      if (e.t !== 'treasure'){
        e.x += e.dir * e.sp;
        e.y += Math.sin(g.t/26 + e.wob)*0.35;
      } else e.y += Math.sin(g.t/34 + e.wob)*0.18;
      if (e.x < -60 || e.x > VW+60 || e.y < g.by - 90){ g.ents.splice(i,1); continue; }
      const hit = Math.abs(e.x + e.w/2 - g.bx) < e.w/2 + 5 && Math.abs(e.y + e.h/2 - g.by) < e.h/2 + 5;
      if (!hit) continue;
      if (e.t === 'fish'){
        g.onLine.push({tier:e.tier, kind:'fish'});
        g.ents.splice(i,1); g.hookFx = 12;
        Audio_.sfx('fish');
        Particles.burst(e.x, e.y, ICE_FISH[e.tier].col, 6, 1.6, 'sq');
        g.msg = ICE_FISH[e.tier].n + '  (' + g.onLine.length + '/10)'; g.msgT = 50;
        if (e.tier >= 4){ g.legend = true; State.stats.legendaryCatch = Math.max(State.stats.legendaryCatch||0, 1); }
        if (g.onLine.length >= 10){ g.msg = 'FULL LINE - REELING IN'; g.msgT = 70; g.reelT = 70; g.state = 'reel'; g.reelKeep = true; Audio_.sfx('perfect'); }
      } else if (e.t === 'treasure'){
        /* treasure snaps the rod straight back up and costs no line */
        g.treasures++;
        const tr = ICE_TREASURE[e.tier];
        g.score += Math.round(tr.v * this.throwCfg().mult);
        g.ents.splice(i,1);
        Audio_.sfx('legend'); shake();
        Particles.burst(e.x, e.y, tr.col, 16, 2.4, 'star');
        g.msg = tr.n + '! FREE CAST'; g.msgT = 90;
        g.reelT = 60; g.state = 'reel'; g.reelKeep = true; g.freeCast = true;
      } else {
        /* predator: lose the line and everything on it */
        g.lines--;
        g.onLine = [];
        g.ents.splice(i,1);
        Audio_.sfx('hurt'); shake();
        Particles.burst(g.bx, g.by, '#ff5c7a', 14, 2.4, 'sq');
        g.msg = (e.kind==='orca'?'ORCA':e.kind==='squid'?'SQUID':'EEL') + ' TOOK THE LINE!'; g.msgT = 90;
        g.flash = 16;
        if (g.lines <= 0){ g.over = 80; Audio_.sfx('fail'); }
        else { g.state = 'cast'; g.thrown++; g.bar = 0; g.dir = 1; }
      }
    }
    Particles.update();
  },
  landLine(){
    const g = this.s;
    let gained = 0;
    g.onLine.forEach(o=> gained += ICE_FISH[o.tier].v);
    gained = Math.round(gained * this.throwCfg().mult);
    g.score += gained;
    g.caught += g.onLine.length;
    if (g.onLine.length) { g.msg = 'BANKED ' + g.onLine.length + ' FISH  (+' + gained + ')'; g.msgT = 90; Audio_.sfx('coin'); }
    g.onLine = [];
    if (g.freeCast){ g.freeCast = false; }   /* treasure did not consume a line */
    else { g.thrown++; }
    g.banked++;
    if (g.thrown >= 3 && g.lines <= 0){ g.over = 70; return; }
    g.state = 'cast'; g.bar = 0; g.dir = 1;
  },
  done(){
    const g = this.s;
    const top = g.legend ? 'LEGENDARY HOOKED' : '';
    finishGame({score:g.score, fish:g.score*0.5, xp:g.score/7,
      rolls: 1 + Math.floor(g.score/900) + g.treasures, luck: g.treasures*0.06,
      win: g.score >= 600, cleared: g.caught > 0 || g.treasures > 0,
      title: g.lines > 0 ? 'LINES BANKED' : 'ALL LINES LOST',
      note: g.caught + ' FISH - ' + g.treasures + ' TREASURE' + (top?' - '+top:'')});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, {a:'#0a1130', b:'#3a5a9a', night:0.8});
    /* ice shelf with the hole */
    c.fillStyle = '#dff3ff'; c.fillRect(0,60,VW,14);
    c.fillStyle = '#9dc9f0'; c.fillRect(0,74,VW,2);
    c.fillStyle = '#04122c'; c.fillRect(104,60,32,16);
    c.fillStyle = '#0e3566'; c.fillRect(106,60,28,14);
    /* water, darker with depth */
    const grd = c.createLinearGradient(0,76,0,VH);
    grd.addColorStop(0,'#1a4a8a'); grd.addColorStop(1,'#04122c');
    c.fillStyle = grd; c.fillRect(0,76,VW,VH-76);
    for (let i=0;i<24;i++){
      const y = 80 + ((i*33 + g.t*0.35) % (VH-80));
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect((i*53)%VW, y, 2, 2);
    }
    c.fillStyle = '#0a2a4a'; c.fillRect(0, ICE_BOTTOM+6, VW, VH);

    /* seal at the hole */
    drawSeal(c, 62, 46, playerLook({facing:1, frame:(g.t/26|0)%2}));
    c.fillStyle = '#8a5a34'; c.fillRect(84,44,2,18);

    if (g.state !== 'cast'){
      /* line + bobber */
      c.fillStyle = '#c9c2a0'; c.fillRect(119, 62, 1, Math.max(0, g.by-62));
      /* what is hanging on the line */
      for (let i=0;i<g.onLine.length;i++){
        const o = g.onLine[i];
        c.fillStyle = ICE_FISH[o.tier].col;
        c.fillRect(114 + (i%5)*3, 64 + ((i/5)|0)*4, 2, 3);
      }
      /* entities */
      for (const e of g.ents){
        const x = e.x|0, y = e.y|0;
        if (e.t === 'fish'){
          const f = ICE_FISH[e.tier];
          c.fillStyle = f.col; c.fillRect(x, y, 6+e.tier, 4);
          c.fillStyle = f.col; c.fillRect(x + (e.dir>0?6+e.tier:-3), y+1, 3, 2);
          c.fillStyle = '#0d1024'; c.fillRect(x + (e.dir>0?1:4+e.tier), y+1, 1, 1);
          if (e.tier >= 4){ c.fillStyle='#ffffff'; c.fillRect(x+2, y-1, 2, 1); }
        } else if (e.t === 'treasure'){
          const tr = ICE_TREASURE[e.tier];
          const gl = (g.t/8|0)%2;
          c.fillStyle = gl ? tr.col : '#8a5a34'; c.fillRect(x, y, 12, 9);
          c.fillStyle = '#5e3b21'; c.fillRect(x, y+4, 12, 2); c.fillRect(x+5, y, 2, 9);
          c.fillStyle = '#fff3b0'; c.fillRect(x+1, y+1, 3, 2);
        } else {
          if (e.kind === 'orca'){
            c.fillStyle='#141a2e'; c.fillRect(x,y,28,12); c.fillRect(x+(e.dir>0?24:-4),y+3,6,6);
            c.fillStyle='#f6fbff'; c.fillRect(x+4,y+7,14,4); c.fillRect(x+3,y+2,4,2);
          } else if (e.kind === 'squid'){
            c.fillStyle='#b06bff'; c.fillRect(x+2,y,12,8);
            c.fillStyle='#8d4a96'; for(let k=0;k<4;k++) c.fillRect(x+2+k*3, y+8, 2, 5+((k+g.t/6|0)%3));
            c.fillStyle='#ffffff'; c.fillRect(x+4,y+2,2,2); c.fillRect(x+9,y+2,2,2);
          } else {
            c.fillStyle='#5a7f4a'; for(let k=0;k<6;k++) c.fillRect(x+k*4, y + Math.sin(g.t/7+k)*3, 4, 4);
            c.fillStyle='#0d1024'; c.fillRect(x+(e.dir>0?21:1), y+1, 1, 1);
          }
        }
      }
      /* the bobber itself */
      const bx = g.bx|0, by = g.by|0;
      c.fillStyle = g.hookFx>0 ? '#ffffff' : '#e05a5a'; c.fillRect(bx-3, by-4, 6, 4);
      c.fillStyle = '#f6fbff'; c.fillRect(bx-3, by, 6, 3);
      c.fillStyle = '#cdd8e8'; c.fillRect(bx-1, by+3, 2, 3);
      if (!State.opt.noflash && g.hookFx>0){ c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(bx-8,by-9,16,16); }
    }
    Particles.draw(c);

    /* HUD */
    gameHUD(c, {left:'LINES ' + '|'.repeat(Math.max(0,g.lines)), right:fmt(g.score),
                mid: g.state==='cast' ? 'CAST: '+this.throwCfg().n : g.depth+'M  ON LINE '+g.onLine.length+'/10',
                leftCol:'#ff9ecb'});
    if (g.flash > 0 && !State.opt.noflash){
      c.fillStyle = 'rgba(255,92,122,.30)'; c.fillRect(0,0,VW,VH);
    }
    if (g.state === 'cast'){
      const cfg = this.throwCfg();
      const bx = 24, bw = VW-48, by = 128;
      c.fillStyle = 'rgba(9,12,30,.85)'; c.fillRect(12, 96, VW-24, 52);
      drawTextC(c, 'CAST ' + (g.thrown+1) + ' - ' + cfg.n + ' (x' + cfg.mult.toFixed(2) + ')',
                VW/2, 102, cfg.n==='HARD' ? '#ff5c7a' : cfg.n==='NORMAL' ? '#ffd166' : '#7bffe0', 1);
      drawTextC(c, 'A ON THE GREEN', VW/2, 112, '#cfe0ff', 1);
      c.fillStyle = '#0d1024'; c.fillRect(bx-2, by-2, bw+4, 16);
      c.fillStyle = '#3a2a44'; c.fillRect(bx, by, bw, 12);
      const zw = bw * cfg.zone/100;
      c.fillStyle = '#2a7a48'; c.fillRect(bx + bw/2 - zw/2, by, zw, 12);
      c.fillStyle = '#5be584'; c.fillRect(bx + bw/2 - zw*0.16, by, zw*0.32, 12);
      const mx = bx + bw * g.bar/100;
      c.fillStyle = '#ffd166'; c.fillRect(mx-1, by-3, 3, 18);
    } else {
      drawTextC(c, 'LEFT / RIGHT TO STEER THE LURE', VW/2, 150, '#9ec4e8', 1, '#04122c');
    }
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 86,
      g.msg.indexOf('TOOK')>=0 ? '#ff5c7a' : g.msg.indexOf('!')>=0 ? '#ffd166' : '#ffffff', 1, '#0d1024');
    if (g.over) bigMsg(c, g.lines>0 ? 'DONE' : 'LINES GONE', fmt(g.score) + ' VALUE');
  }
});

/* ============================================================
   21. FLOE SURVIVAL - wave arena, auto-attack
   ============================================================ */
Object.assign(GAMES.floe, {
  start(){
    this.s = {x:120, y:88, facing:1, hp:3+State.gear.blubber, maxhp:3+State.gear.blubber, inv:0,
      wave:0, ents:[], t:0, atk:0, atkCd:0, kills:0, spawnT:60, waveT:0, boss:null, over:0,
      cleanWave:true, cleanStreak:0, msg:'', msgT:0, score:0};
    this.nextWave();
  },
  nextWave(){
    const g = this.s;
    g.wave++;
    if (g.wave > 1 && g.cleanWave){ g.cleanStreak++; State.stats.noHitWaves = Math.max(State.stats.noHitWaves||0, g.cleanStreak); }
    else if (g.wave > 1) g.cleanStreak = 0;
    g.cleanWave = true;
    g.msg = 'WAVE ' + g.wave; g.msgT = 70;
    const isBoss = g.wave % 10 === 0;
    const n = isBoss ? 3 : Math.min(14, 2 + g.wave);
    for (let i=0;i<n;i++) this.spawn(g.wave < 4 ? 'crab' : chance(0.4) ? 'gull' : 'crab');
    if (isBoss){
      const a = rnd(6.28);
      g.boss = {t:'boss', x:120+Math.cos(a)*80, y:88+Math.sin(a)*70, hp:24 + g.wave*4, max:24+g.wave*4,
                w:30, h:16, sp:0.42, hit:0};
      g.ents.push(g.boss);
      Audio_.play('boss'); g.msg = 'ORCA!'; g.msgT = 90;
    } else if (g.wave % 10 === 1 && g.wave > 1) Audio_.play('action');
  },
  spawn(type){
    const g = this.s, a = rnd(6.28);
    const x = 120 + Math.cos(a)*100, y = 88 + Math.sin(a)*86;
    if (type === 'gull') g.ents.push({t:'gull', x:x, y:y, hp:1, w:12,h:9, sp:0.85+g.wave*0.02, hit:0, dive:0});
    else g.ents.push({t:'crab', x:x, y:y, hp:2, w:12,h:9, sp:0.42+g.wave*0.015, hit:0});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    const sp = 1.15 + State.gear.speed*0.05;
    let mx=0,my=0;
    if (Input.key('left')) mx-=1; if (Input.key('right')) mx+=1;
    if (Input.key('up')) my-=1; if (Input.key('down')) my+=1;
    const st = Stick.read(); if (st){ mx = st.x; my = st.y; }
    else if (mx || my){ const n = Math.hypot(mx,my)||1; mx /= n; my /= n; }   /* even diagonal speed */
    if (mx) g.facing = mx > 0 ? 1 : -1;
    let nx = g.x + mx*sp, ny = g.y + my*sp;
    /* stay on the floe (ellipse) */
    const dx = (nx+12-120)/78, dy = (ny+7-88)/62;
    if (dx*dx + dy*dy <= 1){ g.x = nx; g.y = ny; }
    else { const m = Math.hypot(dx,dy); g.x = 120 + dx/m*78 - 12; g.y = 88 + dy/m*62 - 7; }
    if (State.equipped.trail && g.t%4===0 && (mx||my)) Particles.spawnTrail(State.equipped.trail, g.x+12, g.y+10, -mx, -my);
    if (g.inv>0) g.inv--;
    /* auto attack */
    if (g.atkCd > 0) g.atkCd--;
    if (g.atk > 0) g.atk--;
    if (g.atkCd <= 0){
      let target = null, bd = 30;
      for (const e of g.ents){ const d = dist(e.x+e.w/2, e.y+e.h/2, g.x+12, g.y+7); if (d < bd){ bd = d; target = e; } }
      if (target){
        g.atk = 12; g.atkCd = 34 - Math.min(12, g.wave); Audio_.sfx('swat');
        g.facing = (target.x+target.w/2) > (g.x+12) ? 1 : -1;
        for (const e of g.ents){
          if (dist(e.x+e.w/2, e.y+e.h/2, g.x+12 + g.facing*10, g.y+7) < 22){
            e.hp -= 1 + (State.gear.grip*0.2); e.hit = 8;
            Particles.burst(e.x+e.w/2, e.y+e.h/2, '#ffffff', 3, 1.4, 'plus');
          }
        }
      }
    }
    /* enemies */
    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      if (e.hit>0) e.hit--;
      const ang = Math.atan2(g.y+7-e.y-e.h/2, g.x+12-e.x-e.w/2);
      if (e.t === 'gull'){
        e.dive = (e.dive||0) + 1;
        const s = e.sp * (e.dive%120 < 40 ? 1.9 : 0.7);
        e.x += Math.cos(ang)*s; e.y += Math.sin(ang)*s + Math.sin(g.t/9+i)*0.3;
      } else {
        e.x += Math.cos(ang)*e.sp; e.y += Math.sin(ang)*e.sp;
      }
      if (e.hp <= 0){
        g.ents.splice(i,1); g.kills++; g.score += e.t==='boss'?500:e.t==='gull'?18:12;
        Particles.burst(e.x+e.w/2, e.y+e.h/2, e.t==='boss'?'#ffd166':'#ff9ecb', e.t==='boss'?18:6, 2, 'sq');
        Audio_.sfx(e.t==='boss'?'legend':'hit');
        if (e.t === 'boss'){ g.boss = null; Audio_.play('action'); addFishPop(g, 'BOSS DOWN'); }
        continue;
      }
      if (g.inv <= 0 && aabb({x:g.x+4,y:g.y+3,w:16,h:9}, {x:e.x,y:e.y,w:e.w,h:e.h})){
        g.hp--; g.inv = 66; g.cleanWave = false; g.cleanStreak = 0;
        Audio_.sfx('hurt'); shake();
        Particles.burst(g.x+12,g.y+7,'#ff5c7a',8,2,'sq');
        if (g.hp <= 0){ g.over = 66; Audio_.sfx('fail'); }
      }
    }
    if (!g.ents.length){ g.waveT++; if (g.waveT > 40){ g.waveT = 0; g.score += g.wave*40; this.nextWave(); } }
    Particles.update();
  },
  done(){
    const g = this.s;
    const score = g.score + g.wave*90;
    finishGame({score:score, fish: score*0.28, xp: score/9, rolls: 1 + Math.floor(g.wave/4),
      luck: g.wave*0.01, win: g.wave >= 10, cleared: g.wave > 1,
      title: g.wave>=10 ? 'FLOE HELD' : 'OVERRUN',
      note: 'WAVE ' + g.wave + '  -  ' + g.kills + ' KILLS' + (g.cleanStreak>=3?'  -  '+g.cleanStreak+' CLEAN':'')});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, {a:'#0a1a40', b:'#1e4a80', night:0.6});
    drawSeaBand(c, 11, VH-11, g.t, '#0e3566');
    /* floe */
    c.fillStyle = '#9dc9f0';
    for (let y=-63;y<=63;y++){ const w = Math.sqrt(Math.max(0,1-(y/62)*(y/62)))*79; c.fillRect(120-w, 88+y, w*2, 1); }
    c.fillStyle = '#e6f4ff';
    for (let y=-59;y<=57;y++){ const w = Math.sqrt(Math.max(0,1-(y/58)*(y/58)))*74; c.fillRect(120-w, 88+y, w*2, 1); }
    c.fillStyle = '#cfe9ff';
    for (let i=0;i<10;i++){ const a = i*2.1; c.fillRect(120+Math.cos(a)*50, 88+Math.sin(a)*40, 4, 2); }
    /* entities */
    for (const e of g.ents){
      const x = e.x|0, y = e.y|0, f = e.hit>0;
      if (e.t === 'crab'){
        c.fillStyle = f?'#ffffff':'#e0563f'; c.fillRect(x,y+2,12,7);
        c.fillStyle = f?'#ffffff':'#a03a28'; c.fillRect(x-2,y+1,3,3); c.fillRect(x+11,y+1,3,3);
        c.fillStyle='#0d1024'; c.fillRect(x+3,y+3,2,2); c.fillRect(x+7,y+3,2,2);
        c.fillStyle = f?'#ffffff':'#a03a28'; c.fillRect(x+1,y+9,2,2); c.fillRect(x+9,y+9,2,2);
      } else if (e.t === 'gull'){

        c.fillStyle = f?'#ffffff':'#f6fbff'; c.fillRect(x+2,y+3,8,5);
        c.fillStyle = f?'#ffffff':'#e6eef7'; c.fillRect(x-2,y+(fl?1:5),5,2); c.fillRect(x+9,y+(fl?1:5),5,2);
        c.fillStyle='#ffd166'; c.fillRect(x+10,y+4,3,2);
        c.fillStyle='#0d1024'; c.fillRect(x+7,y+4,1,1);
      } else if (e.t === 'boss'){
        c.fillStyle = f?'#ffffff':'#141a2e'; c.fillRect(x,y,30,14); c.fillRect(x-5,y+4,6,7); c.fillRect(x+22,y-6,7,7);
        c.fillStyle = f?'#ffffff':'#f6fbff'; c.fillRect(x+3,y+8,16,5); c.fillRect(x+4,y+2,5,2);
        c.fillStyle='#ff5c7a'; c.fillRect(x+24,y+5,4,2);
      }
    }
    Particles.draw(c);
    if (!(g.inv > 0 && (g.t/4|0)%2)){
      const o = playerLook({facing:g.facing, frame:(g.t/10|0)%2});
      drawSeal(c, g.x, g.y, o);
    }
    if (g.atk > 8){
      c.fillStyle = 'rgba(255,255,255,.85)';
      const ax = g.x + 12 + g.facing*14;
      c.fillRect(ax-4, g.y+2, 8, 3); c.fillRect(ax-2, g.y-1, 4, 9);
    }
    Stick.draw(c);
    gameHUD(c, {hp:g.hp, maxhp:g.maxhp, left:'', right:fmt(g.score), mid:'WAVE '+g.wave});
    if (g.boss){
      c.fillStyle='#3a1020'; c.fillRect(40,14,160,5);
      c.fillStyle='#ff5c7a'; c.fillRect(40,14,160*(g.boss.hp/g.boss.max),5);
      drawTextC(c,'ORCA',VW/2,20,'#ff9ecb',1);
    }
    if (g.cleanStreak > 0) drawText(c, 'CLEAN x'+g.cleanStreak, 3, 152, '#7bffe0', 1, '#0d1024');
    if (g.msgT > 40) bigMsg(c, g.msg, null, 62);
    if (g.over) bigMsg(c, 'DOWN', 'WAVE ' + g.wave);
  }
});
function addFishPop(g, txt){ g.msg = txt; g.msgT = 70; }

/* ============================================================
   22. PEARL MATCH - connected-group bonus room
   Groups are flood filled, so any blob of 3+ touching gems clears,
   not just straight lines. Swaps slide, cascades chain.
   ============================================================ */
const GEM_COL = [['#ff5c7a','#a02c46'],['#4fd6ff','#1b6a9a'],['#5be584','#2a7a48'],['#ffd166','#b07a1a'],['#b06bff','#6a3a9a']];
const GRID_X = 66, GRID_Y = 34, CELL = 18, GN = 6;
Object.assign(GAMES.pearl, {
  start(){
    const g = this.s = {grid:[], cx:2, cy:2, sel:null, moves:16, score:0, pearls:0, t:0,
      state:'intro', anim:0, over:0, combo:0, msg:'', msgT:0, slide:null, drops:[], best:0};
    for (let y=0;y<GN;y++){ g.grid[y] = []; for (let x=0;x<GN;x++) g.grid[y][x] = this.newGem(); }
    let guard = 0;
    while (this.findGroups().length && guard++ < 200){
      this.findGroups().forEach(grp=> grp.forEach(p=>{ g.grid[p.y][p.x] = this.newGem(); }));
    }
  },
  newGem(){ return chance(0.055) ? 5 : rndi(5); },
  at(x,y){ const g = this.s; return (x<0||y<0||x>=GN||y>=GN) ? -1 : g.grid[y][x]; },
  /* every connected blob of 3 or more matching gems */
  findGroups(){
    const g = this.s, seen = {}, out = [];
    for (let y=0;y<GN;y++) for (let x=0;x<GN;x++){
      const v = g.grid[y][x];
      if (v < 0 || seen[x+','+y]) continue;
      const stack = [{x:x,y:y}], grp = [];
      seen[x+','+y] = 1;
      while (stack.length){
        const p = stack.pop(); grp.push(p);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
          const nx = p.x+d[0], ny = p.y+d[1], k = nx+','+ny;
          if (seen[k]) return;
          if (this.at(nx,ny) !== v) return;
          seen[k] = 1; stack.push({x:nx, y:ny});
        });
      }
      if (grp.length >= 3) out.push(grp);
    }
    return out;
  },
  /* would swapping these two produce anything? */
  wouldMatch(a, b){
    const g = this.s;
    const t = g.grid[a.y][a.x]; g.grid[a.y][a.x] = g.grid[b.y][b.x]; g.grid[b.y][b.x] = t;
    const ok = this.findGroups().length > 0;
    const t2 = g.grid[a.y][a.x]; g.grid[a.y][a.x] = g.grid[b.y][b.x]; g.grid[b.y][b.x] = t2;
    return ok;
  },
  anyMoveLeft(){
    for (let y=0;y<GN;y++) for (let x=0;x<GN;x++){
      if (x < GN-1 && this.wouldMatch({x:x,y:y},{x:x+1,y:y})) return true;
      if (y < GN-1 && this.wouldMatch({x:x,y:y},{x:x,y:y+1})) return true;
    }
    return false;
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }

    if (g.state === 'intro'){
      if (Input.hit('a') || Input.hit('b') || Input.ptr.tapped || g.t > 420) g.state = 'idle';
      return;
    }
    /* the two gems slide past each other before anything resolves */
    if (g.state === 'slide'){
      g.slide.t++;
      if (g.slide.t >= 9){
        const s = g.slide, a = s.a, b = s.b;
        const t = g.grid[a.y][a.x]; g.grid[a.y][a.x] = g.grid[b.y][b.x]; g.grid[b.y][b.x] = t;
        g.slide = null;
        if (s.bad){ g.state = 'idle'; }
        else { g.moves--; g.state = 'resolve'; g.anim = 6; g.combo = 0; }
      }
      return;
    }
    if (g.state === 'resolve'){
      g.anim--;
      if (g.anim <= 0){
        const groups = this.findGroups();
        if (groups.length){
          g.combo++;
          let cleared = 0, pearls = 0;
          groups.forEach(grp=>{
            /* bigger blobs pay much better than the minimum three */
            const size = grp.length;
            grp.forEach(p=>{
              if (g.grid[p.y][p.x] === 5) pearls++;
              Particles.burst(GRID_X + p.x*CELL + 8, GRID_Y + p.y*CELL + 8,
                g.grid[p.y][p.x]===5 ? '#f2e9ff' : GEM_COL[g.grid[p.y][p.x]][0], 5, 1.6, 'sq');
              g.grid[p.y][p.x] = -1; cleared++;
            });
            g.score += Math.round(10 * size * (1 + (size-3)*0.55) * g.combo);
            if (size >= 6){ g.msg = size + ' IN ONE BLOB!'; g.msgT = 70; }
          });
          g.pearls += pearls;
          g.score += pearls * 60;
          g.best = Math.max(g.best, cleared);
          Audio_.sfx(pearls ? 'perfect' : g.combo > 1 ? 'good' : 'coin');
          if (g.combo > 1 && g.msgT <= 0){ g.msg = 'CASCADE x' + g.combo; g.msgT = 60; }
          /* gravity, and remember the fall distance so gems can be drawn dropping */
          g.drops = [];
          for (let x=0;x<GN;x++){
            let write = GN-1;
            for (let y=GN-1;y>=0;y--) if (g.grid[y][x] >= 0){
              g.grid[write][x] = g.grid[y][x];
              if (write!==y){ g.grid[y][x] = -1; g.drops.push({x:x, y:write, d:write-y}); }
              write--;
            }
            for (let y=write;y>=0;y--){ g.grid[y][x] = this.newGem(); g.drops.push({x:x, y:y, d:write+1}); }
          }
          g.anim = 10;
        } else {
          g.state = 'idle'; g.combo = 0; g.drops = [];
          if (g.moves <= 0){ g.over = 60; g.endReason = 'OUT OF MOVES'; Audio_.sfx('good'); }
          else if (!this.anyMoveLeft()){ g.over = 60; g.endReason = 'NO MOVES LEFT'; Audio_.sfx('fail'); }
        }
      }
      Particles.update(); return;
    }
    /* cursor */
    if (Input.hit('left')) g.cx = clamp(g.cx-1,0,GN-1);
    if (Input.hit('right')) g.cx = clamp(g.cx+1,0,GN-1);
    if (Input.hit('up')) g.cy = clamp(g.cy-1,0,GN-1);
    if (Input.hit('down')) g.cy = clamp(g.cy+1,0,GN-1);
    if (Input.ptr.tapped){
      const gx = Math.floor((Input.ptr.x - GRID_X)/CELL), gy = Math.floor((Input.ptr.y - GRID_Y)/CELL);
      if (gx>=0&&gx<GN&&gy>=0&&gy<GN){
        if (g.sel && (Math.abs(g.sel.x-gx)+Math.abs(g.sel.y-gy)) === 1) this.trySwap(g.sel, {x:gx,y:gy});
        else { g.sel = {x:gx,y:gy}; g.cx=gx; g.cy=gy; Audio_.sfx('blip'); }
      }
    }
    if (Input.hit('a')){
      if (g.sel && (Math.abs(g.sel.x-g.cx)+Math.abs(g.sel.y-g.cy)) === 1) this.trySwap(g.sel, {x:g.cx,y:g.cy});
      else if (g.sel && g.sel.x===g.cx && g.sel.y===g.cy) g.sel = null;
      else { g.sel = {x:g.cx, y:g.cy}; Audio_.sfx('blip'); }
    }
    if (Input.hit('b')) g.sel = null;
    Particles.update();
  },
  trySwap(a, b){
    const g = this.s;
    const good = this.wouldMatch(a, b);
    g.slide = {a:a, b:b, t:0, bad:!good};
    g.state = 'slide';
    g.sel = null;
    if (good) Audio_.sfx('select');
    else { Audio_.sfx('back'); g.msg = 'NO MATCH THERE'; g.msgT = 44; }
  },
  done(){
    const g = this.s;
    finishGame({score:g.score, fish:g.score*0.30, xp:g.score/13,
      rolls: 1 + Math.floor(g.pearls/2) + Math.floor(g.score/1800), luck: g.pearls*0.05,
      win:true, title:'BONUS ROOM CLEARED',
      note: g.pearls + ' PEARLS - BEST ' + g.best});
  },
  /* where a gem should be drawn, accounting for slide and drop animation */
  gemPos(x, y){
    const g = this.s;
    let px = GRID_X + x*CELL, py = GRID_Y + y*CELL;
    if (g.slide){
      const s = g.slide, k = s.bad ? (s.t < 5 ? s.t/5 : (9-s.t)/4) : s.t/9;
      if (s.a.x===x && s.a.y===y){ px += (s.b.x-s.a.x)*CELL*k; py += (s.b.y-s.a.y)*CELL*k; }
      else if (s.b.x===x && s.b.y===y){ px += (s.a.x-s.b.x)*CELL*k; py += (s.a.y-s.b.y)*CELL*k; }
    }
    if (g.state === 'resolve' && g.anim > 0 && g.drops.length){
      const d = g.drops.find(o=> o.x===x && o.y===y);
      if (d) py -= d.d * CELL * (g.anim/10);
    }
    return {x:px, y:py};
  },
  drawGem(c, v, px, py){
    if (v === 5){
      c.fillStyle = '#f2e9ff'; c.fillRect(px+2,py+2,12,12);
      c.fillStyle = '#cdd8e8'; c.fillRect(px+2,py+9,12,5);
      c.fillStyle = '#ffffff'; c.fillRect(px+4,py+4,4,3);
      c.fillStyle = '#b06bff'; c.fillRect(px+6,py+7,4,4);
      return;
    }
    c.fillStyle = GEM_COL[v][1]; c.fillRect(px+1,py+1,14,14);
    c.fillStyle = GEM_COL[v][0]; c.fillRect(px+2,py+2,12,12);
    c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(px+3,py+3,4,2);
    /* shape coding so the colours are not the only signal */
    c.fillStyle = 'rgba(13,16,36,.68)';
    if (v===0) c.fillRect(px+6,py+6,4,4);
    if (v===1){ c.fillRect(px+5,py+7,6,2); c.fillRect(px+7,py+5,2,6); }
    if (v===2){ c.fillRect(px+5,py+9,6,2); c.fillRect(px+7,py+5,2,2); }
    if (v===3){ c.fillRect(px+4,py+7,8,2); }
    if (v===4){ c.fillRect(px+7,py+4,2,8); }
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#1b2a5e'); grd.addColorStop(1,'#07173a');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    for (let i=0;i<20;i++){ c.fillStyle = 'rgba(158,229,255,.10)';
      c.fillRect((i*37 + g.t*0.2)%VW, (i*29 + Math.sin(g.t/40+i)*8)%VH, 2, 2); }
    c.fillStyle = 'rgba(9,12,30,.6)'; c.fillRect(GRID_X-4,GRID_Y-4,CELL*GN+8,CELL*GN+8);

    for (let y=0;y<GN;y++) for (let x=0;x<GN;x++){
      const v = g.grid[y][x]; if (v < 0) continue;
      const p = this.gemPos(x,y);
      this.drawGem(c, v, p.x, p.y);
    }
    if (g.sel){ c.strokeStyle = '#ffd166'; c.lineWidth = 1;
      c.strokeRect(GRID_X+0.5+g.sel.x*CELL, GRID_Y+0.5+g.sel.y*CELL, CELL-3, CELL-3); }
    const cx = GRID_X + g.cx*CELL, cy = GRID_Y + g.cy*CELL;
    c.strokeStyle = (g.t/8|0)%2 ? '#ffffff' : '#4fd6ff'; c.lineWidth = 1;
    c.strokeRect(cx-0.5, cy-0.5, CELL-1, CELL-1);

    drawSeal(c, 14, 100, playerLook({facing:1, frame:(g.t/20|0)%2}));
    Particles.draw(c);
    gameHUD(c, {left:'MOVES '+g.moves, right:fmt(g.score), mid:'PEARLS '+g.pearls,
                leftCol: g.moves<=3?'#ff5c7a':'#ffffff'});
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 22, '#ffd166', 1, '#0d1024');
    drawTextC(c, 'SWAP NEIGHBOURS - 3+ TOUCHING CLEARS', VW/2, 152, '#6f86b8', 1);

    if (g.state === 'intro'){
      c.fillStyle = 'rgba(6,9,24,.90)'; c.fillRect(10,18,VW-20,124);
      c.strokeStyle = '#4fd6ff'; c.lineWidth = 1; c.strokeRect(10.5,18.5,VW-21,123);
      drawTextC(c, 'PEARL MATCH', VW/2, 24, '#7bffe0', 1);
      const lines = [
        'SWAP TWO GEMS THAT TOUCH.',
        'ANY BLOB OF 3+ MATCHING GEMS CLEARS -',
        'NOT JUST STRAIGHT LINES. BIGGER BLOBS',
        'AND CASCADES SCORE FAR MORE.',
        '',
        'WHITE PEARL GEMS ADD LOOT ROLLS.',
        'YOU HAVE 16 MOVES.',
        '',
        'MOVE: ARROWS OR TAP    SWAP: A'
      ];
      lines.forEach((s,i)=> drawTextC(c, s, VW/2, 38 + i*11, i===5 ? '#f2e9ff' : '#cfe0ff', 1));
      drawTextC(c, (g.t/16|0)%2 ? 'PRESS A TO START' : '', VW/2, 132, '#ffd166', 1);
    }
    if (g.over){
      bigMsg(c, g.endReason === 'NO MOVES LEFT' ? 'NO MOVES LEFT' : 'ROOM CLEAR', fmt(g.score) + ' PTS');
    }
  }
});

/* ============================================================
   23. BELLY SLIDE RACE - rhythm slide
   ============================================================ */
Object.assign(GAMES.slide, {
  start(){
    const g = this.s = {wx:0, y:70, vy:0, spd:2.2, t:0, air:false, spin:0, spinT:0, combo:0, tricks:0,
      score:0, time:60*60, stumble:0, segs:[], msg:'', msgT:0, over:0, best:0, land:0, splash:0, falls:0};
    g.segs.push({x:0, w:200, type:'slope', y0:70, y1:76});
    for (let i=0;i<40;i++) this.addSeg();
  },
  addSeg(){
    const g = this.s, last = g.segs[g.segs.length-1];
    const x = last.x + last.w, y0 = last.y1;
    const r = Math.random();
    if (r < 0.20 && g.wx > 200) g.segs.push({x:x, w:26+rnd(24), type:'gap', y0:y0, y1:y0+rnd(6,-2)});
    else if (r < 0.42 && g.wx > 120) g.segs.push({x:x, w:34, type:'ramp', y0:y0, y1:y0-12});
    else g.segs.push({x:x, w:56+rnd(60), type:'slope', y0:y0, y1:clamp(y0 + rnd(14,-4), 46, 120)});
  },
  groundAt(wx){
    const g = this.s;
    for (const s of g.segs){
      if (wx >= s.x && wx < s.x + s.w){
        if (s.type === 'gap') return null;
        const t = (wx - s.x)/s.w;
        return lerp(s.y0, s.y1, t);
      }
    }
    return 90;
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; g.time--;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.time <= 0){ g.over = 60; g.msg='FINISH!'; g.msgT=60; Audio_.sfx('good'); }
    while (g.segs.length && g.segs[0].x + g.segs[0].w < g.wx - 80) g.segs.shift();
    while (g.segs[g.segs.length-1].x < g.wx + 400) this.addSeg();
    const px = g.wx + 60;
    const gy = this.groundAt(px);
    g.spd = clamp(g.spd + (g.stumble>0 ? -0.05 : 0.006), 1.1, 5.2) + (Input.key('right')?0.006:0) - (Input.key('left')?0.02:0);
    if (g.stumble > 0) g.stumble--;
    g.wx += g.spd;
    g.score += g.spd*0.4;
    /* physics */
    g.vy += 0.34;
    g.y += g.vy;
    /* fell in the water: sink, then climb back out where the ice resumes */
    if (g.splash > 0){
      g.splash--;
      g.y = Math.min(g.y + 0.6, 150);
      g.spd = Math.max(1.1, g.spd - 0.03);
      if (g.splash === 0){
        const land = this.groundAt(px);
        g.y = (land == null ? 150 : land - 8);
        g.vy = 0; g.stumble = 26;
      }
      Particles.update();
      if (g.splash % 6 === 0) Particles.burst(60, g.y, '#9ee5ff', 2, 1.2, 'ring');
      return;
    }
    if (gy == null){
      g.air = true;
      if (g.y > 138 && !g.splash){
        g.splash = 34; g.combo = 0; g.tricksThisAir = 0; g.spinT = 0; g.spin = 0;
        g.spd = Math.max(1.2, g.spd * 0.5);
        Audio_.sfx('splash'); shake(); g.msg = 'SPLASH! CLIMBING OUT'; g.msgT = 60;
        Particles.burst(60, 146, '#9ee5ff', 14, 2.4, 'ring');
      }
    } else {
      if (g.y >= gy - 8){
        if (g.air){
          /* landing */
          if (g.spinT > 0){ g.stumble = 45; g.spd = Math.max(1.3, g.spd*0.55); g.combo = 0; g.spinT = 0; g.spin = 0;
            Audio_.sfx('hurt'); shake(); g.msg = 'WIPEOUT'; g.msgT = 45; }
          else { g.land = 8; if (g.tricksThisAir){ g.combo++; const pts = 60*g.combo; g.score += pts;
            g.msg = 'TRICK +' + pts + (g.combo>1?'  x'+g.combo:''); g.msgT = 50; Audio_.sfx('perfect');
            Particles.burst(72, g.y, '#ffd166', 8, 2, 'star'); g.tricks++; } else Audio_.sfx('dig'); }
          g.tricksThisAir = 0;
        }
        g.air = false; g.y = gy - 8; g.vy = 0;
        if (g.t % 3 === 0) Particles.burst(58, g.y+9, '#ffffff', 1, 0.6, 'sq');
        if (State.equipped.trail && g.t%3===0) Particles.spawnTrail(State.equipped.trail, 60, g.y+8, -2, 0);
      } else g.air = true;
    }
    /* ramp launch */
    const seg = g.segs.find(s=> px >= s.x && px < s.x+s.w);
    if (seg && seg.type === 'ramp' && !g.air && px > seg.x + seg.w - 6){
      g.vy = -5.4 - g.spd*0.3; g.air = true; Audio_.sfx('jump');
    }
    if (Input.hit('a') && !g.air && g.stumble <= 0){ g.vy = -4.6; g.air = true; Audio_.sfx('jump'); }
    if ((Input.hit('b') || Input.ptr.tapped) && g.air && g.spinT <= 0){ g.spinT = 26; g.tricksThisAir = 1; }
    if (g.spinT > 0){ g.spinT--; g.spin += Math.PI*2/26; if (g.spinT === 0) g.spin = 0; }
    if (g.land > 0) g.land--;
    Particles.update();
  },
  done(){
    const g = this.s;
    const m = Math.floor(g.wx/10);
    finishGame({score:Math.round(g.score), fish: g.score*0.3, xp: g.score/10,
      rolls: 1 + Math.floor(g.tricks/4) + (m>600?1:0), luck: g.tricks*0.01, win: g.time<=0,
      title: g.time<=0 ? 'RACE FINISHED' : 'RUN ENDED',
      note: m + 'M  -  ' + g.tricks + ' TRICKS'});
  },
  draw(c){
    const g = this.s, cam = g.wx;
    drawSky(c, g.t, {a:'#123a72', b:'#9ed6ff', night:0});
    drawMountains(c, cam*0.6, {night:0});
    /* slope */
    for (const s of g.segs){
      const sx = s.x - cam, ex = sx + s.w;
      if (ex < -20 || sx > VW+20) continue;
      if (s.type === 'gap'){
        c.fillStyle = '#1a4a8a'; c.fillRect(Math.max(0,sx), s.y0, Math.min(VW,ex)-Math.max(0,sx), VH);
        c.fillStyle = 'rgba(255,255,255,.25)';
        for (let x=Math.max(0,sx); x<Math.min(VW,ex); x+=6) c.fillRect(x, s.y0+4+Math.sin(g.t/9+x)*2, 4, 1);
        continue;
      }
      for (let x=Math.max(0,sx|0); x<Math.min(VW,ex|0); x++){
        const t = (x - sx)/s.w, y = lerp(s.y0, s.y1, t)|0;
        c.fillStyle = '#f6fbff'; c.fillRect(x, y, 1, 5);
        c.fillStyle = '#dbecfb'; c.fillRect(x, y+5, 1, 14);
        c.fillStyle = '#b9d6ef'; c.fillRect(x, y+19, 1, 18);
        c.fillStyle = '#9dc9f0'; c.fillRect(x, y+37, 1, VH-y);
        const wx = (x + (cam|0));
        if (wx % 19 === 0){ c.fillStyle = '#a8cbe8'; c.fillRect(x, y+7, 1, 6); }
        if (wx % 31 === 0){ c.fillStyle = '#8fb8d8'; c.fillRect(x, y+24, 1, 9); }
        if (wx % 47 === 0){ c.fillStyle = '#7fa8cc'; c.fillRect(x, y+44, 1, 12); }
      }
      if (s.type === 'ramp'){ c.fillStyle = '#7bffe0'; c.fillRect(Math.max(0,ex-6), s.y1, 6, 2); }
    }
    Particles.draw(c);
    const o = playerLook({facing:1, frame:(g.t/5|0)%2, pose:'slide'});
    if (g.spinT > 0) o.rot = g.spin;
    if (g.stumble > 0) o.rot = Math.sin(g.t)*0.3;
    drawSeal(c, 60, g.y, o);
    if (g.land > 0){ c.fillStyle='rgba(255,255,255,.7)'; c.fillRect(52, g.y+13, 24, 2); }
    gameHUD(c, {left:Math.floor(g.wx/10)+'M', right:fmt(Math.round(g.score)), mid:Math.ceil(g.time/60)+'S',
                midCol: g.time < 600 ? '#ff5c7a' : '#7bffe0'});
    c.fillStyle='#2a3768'; c.fillRect(3,13,50,3);
    c.fillStyle='#4fd6ff'; c.fillRect(3,13,50*clamp(g.spd/5.2,0,1),3);
    if (g.combo > 1) drawText(c, 'COMBO x'+g.combo, 3, 19, '#ffd166', 1, '#0d1024');
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 34, '#ffffff', 1, '#0d1024');
    if (g.air && g.spinT<=0) drawTextC(c, 'B: TRICK', VW/2, 148, '#7bffe0', 1, '#0d1024');
    if (g.over) bigMsg(c, 'FINISH', Math.floor(g.wx/10)+'M  '+g.tricks+' TRICKS');
  }
});

/* ============================================================
   24. CLAM DIG - timing digs on the beach
   ============================================================ */
const DIG_TABLE = [
  {k:'clam',  n:'CLAM',        v:55,  w:34, col:'#e8cf9a'},
  {k:'shell', n:'EMPTY SHELL', v:5,   w:22, col:'#cdd8e8'},
  {k:'crab',  n:'ANGRY CRAB!', v:-40, w:16, col:'#e0563f'},
  {k:'pearl', n:'PEARL CLAM',  v:150, w:12, col:'#f2e9ff'},
  {k:'coin',  n:'LOST COIN',   v:90,  w:11, col:'#ffd166'},
  {k:'chest', n:'SUNKEN CHEST',v:320, w:5,  col:'#8a5a34'}
];
Object.assign(GAMES.dig, {
  start(){
    this.s = {x:110, t:0, time:50*60, score:0, digs:0, finds:{}, state:'walk', bar:0, dir:1, mercy:0,
      zone:30, msg:'DIG WHERE THE SAND BUBBLES', msgT:90, over:0, spots:[], reveal:null, revealT:0, pearls:0};
    for (let i=0;i<7;i++) this.s.spots.push({x: 16 + i*30 + rnd(10), used:0, wob:rnd(6.28)});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--; if (g.revealT>0) g.revealT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.state === 'walk'){
      g.time--;
      if (g.time <= 0){ g.over = 50; Audio_.sfx('good'); }
      const sp = 1.3 + State.gear.speed*0.05;
      let mx = 0;
      if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
      if (Input.ptr.down){ const d = Input.ptr.x - (g.x+12); if (Math.abs(d) > 6) mx = d>0?1:-1; }
      g.x = clamp(g.x + mx*sp, 4, VW-28);
      if (mx) g.face = mx;
      const near = g.spots.find(s=> !s.used && Math.abs(s.x - (g.x+12)) < 14);
      if (Input.hit('a') && near){ g.state = 'dig'; g.target = near; g.bar = 0; g.dir = 1;
        /* each miss widens the next window, so a bad streak self-corrects */
        g.zone = clamp(36 - g.digs*1.3 + g.mercy*5 + State.gear.grip*2, 14, 52); Audio_.sfx('blip'); }
    } else {
      g.bar += g.dir * Math.max(1.7, 2.4 + g.digs*0.16 - g.mercy*0.45);
      if (g.bar > 100){ g.bar = 100; g.dir = -1; }
      if (g.bar < 0){ g.bar = 0; g.dir = 1; }
      if (Input.hit('a') || Input.ptr.tapped){
        const d = Math.abs(g.bar - 50), half = g.zone/2;
        g.state = 'walk'; g.digs++; g.target.used = 1;
        Audio_.sfx('dig');
        Particles.burst(g.target.x, 120, '#e8cf9a', 8, 1.8, 'sq');
        if (d > half){
          g.mercy = Math.min(4, g.mercy + 1);
          g.msg = 'MISSED - NEXT DIG IS EASIER'; g.msgT = 60; g.score -= 10;
        }
        else {
          g.mercy = Math.max(0, g.mercy - 1);
          const perfect = d <= half*0.3;
          const item = this.roll(perfect);
          g.finds[item.k] = (g.finds[item.k]||0) + 1;
          g.score += item.v * (perfect?1.5:1);
          g.reveal = item; g.revealT = 70;
          g.msg = item.n + (perfect ? ' (PERFECT DIG)' : '');
          g.msgT = 70;
          if (item.k === 'crab'){ Audio_.sfx('hurt'); shake(); g.time -= 180; }
          else if (item.k === 'pearl' || item.k === 'chest'){ Audio_.sfx('perfect'); g.pearls++; }
          else Audio_.sfx('coin');
        }
        /* refresh spots */
        if (g.spots.filter(s=>!s.used).length < 3)
          for (let i=0;i<3;i++) g.spots.push({x: 12 + rnd(VW-40), used:0, wob:rnd(6.28)});
      }
    }
    Particles.update();
  },
  roll(perfect){
    const tab = DIG_TABLE.map(d=> Object.assign({}, d));
    if (perfect){ tab[2].w = 4; tab[3].w += 10; tab[5].w += 5; }
    const tot = tab.reduce((a,d)=>a+d.w,0);
    let r = Math.random()*tot;
    for (const d of tab){ r -= d.w; if (r <= 0) return d; }
    return tab[0];
  },
  done(){
    const g = this.s;
    const sc = Math.max(0, Math.round(g.score));
    finishGame({score:sc, fish:sc*0.55, xp:sc/7, rolls: 1 + g.pearls + Math.floor(sc/700),
      luck:g.pearls*0.06, win:true, title:'BEACH SWEPT',
      note: g.digs + ' DIGS - ' + (g.finds.clam||0) + ' CLAMS' + (g.pearls?' - '+g.pearls+' RARE':'')});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, skyPalette());
    drawSeaBand(c, 84, 26, g.t, '#2a6ab5');
    c.fillStyle = '#e8cf9a'; c.fillRect(0,106,VW,VH-106);
    c.fillStyle = '#d9be8e'; c.fillRect(0,106,VW,3);
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (let x=0;x<VW;x+=8) c.fillRect(x, 104 + Math.sin(g.t/20+x/9)*2, 6, 2);
    for (let i=0;i<24;i++){ c.fillStyle='#c9a86a'; c.fillRect((i*29+13)%VW, 118 + (i%6)*7, 2, 1); }
    /* dig spots */
    for (const s of g.spots){
      if (s.used) { c.fillStyle = '#b08f5a'; c.fillRect(s.x-6, 124, 12, 4); continue; }
      const b = Math.sin(g.t/14 + s.wob) > 0 ? 1 : 0;
      c.fillStyle = '#c9a86a'; c.fillRect(s.x-5, 124, 10, 4);
      c.fillStyle = '#8a7048'; c.fillRect(s.x-3+b, 122, 2, 2); c.fillRect(s.x+2-b, 125, 2, 2);
    }
    Particles.draw(c);
    drawSeal(c, g.x, 112, playerLook({facing:g.face||1, frame:(g.t/10|0)%2, pose: g.state==='dig'?'swim':'idle'}));
    if (g.state === 'dig'){
      const bx = 30, bw = VW-60, by = 60;
      c.fillStyle = '#0d1024'; c.fillRect(bx-2,by-2,bw+4,16);
      c.fillStyle = '#5a4a3a'; c.fillRect(bx,by,bw,12);
      const zw = bw*g.zone/100;
      c.fillStyle = '#2a7a48'; c.fillRect(bx+bw/2-zw/2, by, zw, 12);
      c.fillStyle = '#5be584'; c.fillRect(bx+bw/2-zw*0.15, by, zw*0.3, 12);
      c.fillStyle = '#ffd166'; c.fillRect(bx + bw*g.bar/100 - 1, by-3, 3, 18);
      drawTextC(c, 'A TO DIG', VW/2, 46, '#ffffff', 1, '#0d1024');
    }
    if (g.revealT > 0 && g.reveal){
      const it = g.reveal;
      c.fillStyle = it.col; c.fillRect(VW/2-8, 78, 16, 12);
      c.fillStyle = '#0d1024'; c.fillRect(VW/2-6, 84, 12, 2);
      if (it.k === 'crab'){ c.fillStyle='#0d1024'; c.fillRect(VW/2-5,81,2,2); c.fillRect(VW/2+3,81,2,2); }
    }
    gameHUD(c, {left:'DIGS '+g.digs, right:fmt(Math.max(0,Math.round(g.score))), mid:Math.ceil(g.time/60)+'S',
                midCol: g.time<600?'#ff5c7a':'#7bffe0'});
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 96, g.msg.indexOf('CRAB')>=0?'#ff5c7a':'#ffffff', 1, '#0d1024');
    if (g.over) bigMsg(c, 'TIDE IN', fmt(Math.max(0,Math.round(g.score))) + ' VALUE');
  }
});

/* ============================================================
   25. SYNCHRONIZED SWIM - rhythm routine
   ============================================================ */
const SYNC_DIRS = ['up','down','left','right'];
const SYNC_MAX_MISS = 10;
Object.assign(GAMES.sync, {
  start(){
    const g = this.s = {notes:[], t:0, combo:0, best:0, perfect:0, good:0, miss:0, score:0,
      judge:'', judgeT:0, over:0, hitFx:0, nextT:120, spd:2.0, level:1, lvlT:0, msg:'', msgT:0};
  },
  /* the routine never ends - it just gets faster until you drop ten */
  spawn(){
    const g = this.s;
    /* 0 to ~2.4 over about three minutes of play */
    const ramp = Math.min(1, g.t / 9000);
    g.level = 1 + Math.floor(ramp * 5);
    g.spd = 2.0 + ramp * 2.3;
    const gapMax = 42 - ramp * 20, gapMin = 26 - ramp * 13;
    g.notes.push({d: rndi(4), t: g.nextT, hit:0});
    /* doubles and triples creep in as it speeds up */
    if (Math.random() < ramp * 0.30) g.notes.push({d: rndi(4), t: g.nextT + 8, hit:0});
    g.nextT += rnd(gapMax, gapMin);
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.judgeT>0) g.judgeT--;
    if (g.hitFx>0) g.hitFx--;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    while (g.nextT < g.t + 260) this.spawn();
    const prevLevel = g.level;
    /* missed notes */
    for (const n of g.notes){
      if (!n.hit && g.t > n.t + 12){
        n.hit = -1; g.miss++; g.combo = 0; g.judge='MISS'; g.judgeT=26; Audio_.sfx('fail');
        if (g.miss >= SYNC_MAX_MISS){ g.over = 70; Audio_.sfx('fail'); shake(); }
        else if (g.miss === SYNC_MAX_MISS - 3){ g.msg = 'THREE LEFT!'; g.msgT = 80; }
      }
    }
    if (g.level > prevLevel){ g.msg = 'TEMPO UP - LEVEL ' + g.level; g.msgT = 90; Audio_.sfx('levelup'); }
    while (g.notes.length && g.notes[0].hit && g.notes[0].t < g.t - 40) g.notes.shift();
    let pressed = null;
    SYNC_DIRS.forEach(d=>{ if (Input.hit(d)) pressed = d; });
    if (Input.ptr.tapped){
      /* touch: tap the lane you want to hit */
      const lane = Math.floor((Input.ptr.y - 42) / 24);
      if (lane >= 0 && lane < 4) pressed = SYNC_DIRS[lane];
    }
    if (pressed){
      const di = SYNC_DIRS.indexOf(pressed);
      let bestN = null, bd = 999;
      for (const n of g.notes){ if (n.hit) continue; const d = Math.abs(n.t - g.t); if (d < bd){ bd = d; bestN = n; } }
      if (bestN && bd <= 12){
        if (bestN.d === di){
          const perfect = bd <= 4;
          bestN.hit = 1; g.combo++; g.best = Math.max(g.best, g.combo);
          /* streak multiplier grows the longer you hold on, and a miss resets it */
          const mult = 1 + Math.min(4, g.combo / 12);
          if (perfect){ g.perfect++; g.score += Math.round((60 + g.level*14) * mult); g.judge='PERFECT'; Audio_.sfx('perfect'); }
          else { g.good++; g.score += Math.round((30 + g.level*7) * mult); g.judge='GOOD'; Audio_.sfx('good'); }
          if (g.combo && g.combo % 25 === 0){ g.msg = g.combo + ' STREAK! x' + mult.toFixed(1); g.msgT = 90;
            Particles.burst(44, 80, '#ffd166', 14, 2.4, 'star'); }
          g.judgeT = 26; g.hitFx = 8;
          Particles.burst(44, 50 + di*24, perfect?'#ffd166':'#7bffe0', 5, 1.6, perfect?'star':'plus');
        } else {
          bestN.hit = -1; g.miss++; g.combo = 0; g.judge='WRONG WAY'; g.judgeT=26; Audio_.sfx('fail');
          if (g.miss >= SYNC_MAX_MISS){ g.over = 70; shake(); }
        }
      }
    }
    Particles.update();
  },
  done(){
    const g = this.s;
    const total = g.perfect + g.good + g.miss || 1;
    const acc = (g.perfect + g.good*0.6)/total;
    const grade = g.best >= 120 ? 'S' : g.best >= 80 ? 'A' : g.best >= 45 ? 'B' : g.best >= 20 ? 'C' : 'D';
    finishGame({score:g.score, fish:g.score*0.20, xp:g.score/16,
      rolls: 1 + Math.floor(g.best/35) + (g.level>=5?1:0), luck: acc*0.1, win: g.best >= 45,
      title:'ROUTINE GRADE ' + grade,
      note: 'BEST STREAK ' + g.best + ' - LV' + g.level});
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#1b3a7a'); grd.addColorStop(1,'#0a1d44');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    for (let i=0;i<3;i++){
      c.fillStyle = 'rgba(158,229,255,.10)';
      for (let x=0;x<VW;x+=4) c.fillRect(x, 20+i*46 + Math.sin(x/18 + g.t/16 + i)*5, 4, 8);
    }
    /* background chorus of seals swimming in formation */
    for (let i=0;i<4;i++){
      const x = 150 + Math.sin(g.t/30 + i*1.2)*30, y = 24 + i*30;
      drawSeal(c, x, y, {cos:{fur:['fur_harborgrey','fur_foamwhite','fur_slate','fur_pebblepup'][i]},
                         facing:-1, frame:(g.t/8|0)%2, pose:'swim', alpha:0.5});
    }
    /* lanes */
    for (let i=0;i<4;i++){
      const y = 44 + i*24;
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0,y,VW,16);
      c.fillStyle = g.hitFx>0 ? '#ffffff' : '#4fd6ff';
      c.fillRect(40, y, 2, 16);
      this.arrow(c, 30, y+2, i, '#8fa3d6');
    }
    /* notes */
    for (const n of g.notes){
      if (n.hit) continue;
      const x = 40 + (n.t - g.t) * g.spd;
      if (x < -12 || x > VW+12) continue;
      this.arrow(c, x, 46 + n.d*24, n.d, ['#ff5c7a','#4fd6ff','#5be584','#ffd166'][n.d]);
    }
    Particles.draw(c);
    drawSeal(c, 6, 108, playerLook({facing:1, frame:(g.t/6|0)%2, pose:'swim'}));
    gameHUD(c, {left:'STREAK '+g.combo, right:fmt(g.score), mid:'LV '+g.level,
                leftCol: g.combo>=25 ? '#ffd166' : '#ffffff'});
    /* lives left, as remaining misses */
    const left = SYNC_MAX_MISS - g.miss;
    for (let i=0;i<SYNC_MAX_MISS;i++){
      c.fillStyle = i < left ? (left <= 3 ? '#ff5c7a' : '#7bffe0') : '#2a3768';
      c.fillRect(3 + i*7, 152, 5, 5);
    }
    drawText(c, 'MISSES LEFT', 3, 144, left<=3 ? '#ff5c7a' : '#6f86b8', 1, '#0d1024');
    if (g.judgeT > 0) drawTextC(c, g.judge, VW/2, 130,
      g.judge==='PERFECT'?'#ffd166':g.judge==='GOOD'?'#7bffe0':'#ff5c7a', 2, '#0d1024');
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 16, '#ffd166', 1, '#0d1024');
    if (g.combo >= 12){
      const mult = 1 + Math.min(4, g.combo/12);
      drawText(c, 'x'+mult.toFixed(1), VW-30, 144, '#ffd166', 1, '#0d1024');
    }
    if (g.over) bigMsg(c, 'ROUTINE OVER', 'BEST STREAK ' + g.best);
  },
  arrow(c, x, y, d, col){
    /* solid triangle head plus a stem, so direction reads at a glance */
    c.fillStyle = col;
    if (d === 0){        /* up */
      c.fillRect(x+4,y,2,2); c.fillRect(x+3,y+2,4,1); c.fillRect(x+2,y+3,6,1); c.fillRect(x+1,y+4,8,1);
      c.fillRect(x+4,y+5,2,5);
    } else if (d === 1){ /* down */
      c.fillRect(x+4,y,2,5); c.fillRect(x+1,y+5,8,1); c.fillRect(x+2,y+6,6,1); c.fillRect(x+3,y+7,4,1); c.fillRect(x+4,y+8,2,2);
    } else if (d === 2){ /* left */
      c.fillRect(x,y+4,2,2); c.fillRect(x+1,y+3,1,4); c.fillRect(x+2,y+2,1,6); c.fillRect(x+3,y+1,1,8);
      c.fillRect(x+4,y+4,5,2);
    } else {             /* right */
      c.fillRect(x,y+4,5,2); c.fillRect(x+5,y+1,1,8); c.fillRect(x+6,y+2,1,6); c.fillRect(x+7,y+3,1,4); c.fillRect(x+8,y+4,2,2);
    }
  }
});

/* ============================================================
   26. ICEBERG BALANCE - physics teeter
   ============================================================ */
Object.assign(GAMES.balance, {
  start(){
    this.s = {a:0, av:0, px:0, t:0, w:88, over:0, score:0, gulls:[], snow:0, msg:'', msgT:0,
      waveT:rnd(120,60), best:0, shrink:0};
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    g.score += 1; g.w = Math.max(30, 88 - g.t/130);
    const grip = 1 - State.gear.grip*0.09;
    let mv = 0;
    if (Input.key('left')) mv -= 1; if (Input.key('right')) mv += 1;
    if (Input.ptr.down) mv = Input.ptr.x < VW/2 ? -1 : 1;
    /* Where you stand sets the tilt the berg WANTS to sit at, and it springs
       toward that. Driving the angle directly (rather than its acceleration)
       is what makes leaning feel like control instead of a fight. */
    g.px = clamp(g.px + mv*2.1, -g.w+8, g.w-8);
    g.px = clamp(g.px + Math.sin(g.a)*0.22*grip, -g.w+8, g.w-8);
    /* landed gulls are dead weight you have to stand against */
    let gullLoad = 0;
    for (const gu of g.gulls) if (gu.y >= 0) gullLoad += (gu.x/g.w) * 0.42;
    const target = (g.px/g.w) * 0.65 + gullLoad + Math.sin(g.t/64)*0.02;
    /* swells shove the berg, and grow through the run */
    const ramp = 1 + g.t/1900;
    g.waveT--;
    if (g.waveT <= 0){
      g.waveT = rnd(260,150);
      const push = rnd(0.026*ramp, 0.013*ramp) * (chance(0.5)?1:-1);
      g.av += push; g.msg = 'SWELL!'; g.msgT = 40; Audio_.sfx('wave');
    }
    g.av += (target - g.a) * 0.014;
    g.av *= 0.92;
    g.a = clamp(g.a + g.av, -1.2, 1.2);
    /* gulls land more often the longer you last */
    if (chance(0.0028 * (1 + g.t/1600)) && g.gulls.length < 5){
      g.gulls.push({x: rnd(g.w-10,-(g.w-10)), y:-40, land:0, wob:rnd(6.28)});
      g.msg = 'GULL INBOUND'; g.msgT = 40;
    }
    for (let i=g.gulls.length-1;i>=0;i--){
      const gu = g.gulls[i];
      if (gu.y < 0){ gu.y += 1.6; }
      else { gu.land++; if (gu.land > 300 || Math.abs(g.a) > 0.55){ g.gulls.splice(i,1); continue; } }
    }
    if (Math.abs(g.a) > 0.82){ g.over = 60; Audio_.sfx('fail'); shake(); }
    else if (Math.abs(g.a) > 0.60 && g.t % 18 === 0){ g.msg = 'LEAN BACK!'; g.msgT = 24; }
    if (State.equipped.trail && g.t%6===0) Particles.spawnTrail(State.equipped.trail, 120+g.px, 100, 0, 0);
    Particles.update();
  },
  done(){
    const g = this.s;
    const secs = Math.floor(g.t/60);

  draw(c){

    c.fillStyle = '#9dc9f0'; c.fillRect(-g.w, 4, g.w*2, 8);
    c.fillStyle = '#f6fbff'; c.fillRect(-g.w+6, -9, g.w*2-12, 4);
    c.fillStyle = '#cfe9ff';
    for (let i=0;i<8;i++) c.fillRect(-g.w+10+i*(g.w*2-20)/8, -6, 2, 6);
