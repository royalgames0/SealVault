/* ============================================================
   27. SEAGULL CHASE - defend the fish stash
   ============================================================ */
Object.assign(GAMES.gull, {
  start(){
    this.s = {x:110, face:1, t:0, time:55*60, gulls:[], piles:[{x:60,n:12},{x:120,n:12},{x:180,n:12}],
      swat:0, swatCd:0, hits:0, lost:0, decoy:null, decoyCd:0, over:0, msg:'', msgT:0, spawn:70,
      golden:0, radiant:0, radiantSeen:0};
  },
  totalFish(){ return this.s.piles.reduce((a,p)=>a+p.n,0); },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; g.time--; if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.time <= 0 || this.totalFish() <= 0){ g.over = 60; Audio_.sfx(this.totalFish()>0?'good':'fail'); }
    const sp = 1.5 + State.gear.speed*0.06;
    let mx = 0;
    if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
    if (Input.ptr.down){ const d = Input.ptr.x - (g.x+12); if (Math.abs(d) > 5) mx = d>0?1:-1; }
    g.x = clamp(g.x + mx*sp, 2, VW-26); if (mx) g.face = mx;
    if (g.swat > 0) g.swat--; if (g.swatCd > 0) g.swatCd--; if (g.decoyCd > 0) g.decoyCd--;
    if ((Input.hit('a') || Input.ptr.tapped) && g.swatCd <= 0){
      g.swat = 10; g.swatCd = 16; Audio_.sfx('swat');
      for (const gu of g.gulls){
        if (gu.dead) continue;
        if (dist(gu.x, gu.y, g.x+12 + g.face*10, g.y0||96) < 30){
          if (gu.carry){ this.dropFish(gu); }
          gu.hp--;
          if (gu.hp > 0){                       /* the radiant gull takes two hits */
            Particles.burst(gu.x, gu.y, '#fff3b0', 8, 2.2, 'star');
            gu.x += (gu.x < 120 ? -18 : 18); Audio_.sfx('hit');
            continue;
          }
          gu.dead = 26; g.hits++;
          if (gu.kind === 'radiant'){
            g.radiant++; g.msg = 'RADIANT GULL DOWN!'; g.msgT = 150;
            Particles.burst(gu.x, gu.y, '#ffd166', 26, 3, 'star'); Audio_.sfx('legend'); shake();
          } else if (gu.kind === 'golden'){
            g.golden++; Particles.burst(gu.x, gu.y, '#ffd166', 10, 2.2, 'star'); Audio_.sfx('coin');
          } else Particles.burst(gu.x, gu.y, '#ffffff', 6, 1.8, 'plus');
        }
      }
    }
    if (Input.hit('b') && g.decoyCd <= 0){ g.decoy = {x:g.x+12, t:300}; g.decoyCd = 420; Audio_.sfx('fish'); g.msg='DECOY DROPPED'; g.msgT=50; }
    if (g.decoy){ g.decoy.t--; if (g.decoy.t <= 0) g.decoy = null; }
    /* spawn */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(22, 78 - g.t/22);
      const side = chance(0.5) ? -14 : VW+14;
      let kind = 'gull';
      if (!g.radiantSeen && g.t > 400 && chance(1/340)){ kind = 'radiant'; g.radiantSeen = 1;
        g.msg = 'A RADIANT GULL!'; g.msgT = 140; Audio_.sfx('perfect'); }
      else if (chance(0.11)) kind = 'golden';
      g.gulls.push({x:side, y:rnd(50,16), kind:kind, carry:0, dead:0,
        sp: kind==='radiant' ? 1.9 : kind==='golden' ? rnd(1.7,1.1) : rnd(1.4,.8),
        hp: kind==='radiant' ? 2 : 1, wob:rnd(6.28), state:'in'});
    }
    for (let i=g.gulls.length-1;i>=0;i--){
      const gu = g.gulls[i];
      if (gu.dead){ gu.dead--; gu.y += 2.2; gu.x += (gu.x<120?-1:1); if (gu.dead<=0) g.gulls.splice(i,1); continue; }
      let tx, ty;
      if (gu.carry){ tx = gu.x < 120 ? -30 : VW+30; ty = -20; }
      else if (g.decoy){ tx = g.decoy.x; ty = 104; }
      else {
        const piles = g.piles.filter(p=>p.n>0);
        if (!piles.length){ tx = gu.x; ty = -20; }
        else { const p = piles[(i + (g.t/120|0)) % piles.length]; tx = p.x; ty = 104; gu.pile = p; }
      }
      const a = Math.atan2(ty-gu.y, tx-gu.x);
      gu.x += Math.cos(a)*gu.sp; gu.y += Math.sin(a)*gu.sp + Math.sin(g.t/8+gu.wob)*0.2;
      if (!gu.carry && gu.y > 98 && gu.pile && gu.pile.n > 0 && Math.abs(gu.x - gu.pile.x) < 10){
        /* golden and radiant gulls make off with two fish at a time */
        const take = (gu.kind === 'gull') ? 1 : 2;
        const got = Math.min(take, gu.pile.n);
        gu.pile.n -= got; gu.carry = got;
        Audio_.sfx('blip'); g.msg = got > 1 ? 'IT TOOK TWO!' : 'THIEF!'; g.msgT = 34;
        Particles.burst(gu.x, gu.y, '#ffd166', 3, 1, 'sq');
      }
      if (gu.carry && (gu.y < -18 || gu.x < -28 || gu.x > VW+28)){ g.lost += gu.carry; g.gulls.splice(i,1); }
      else if (!gu.carry && (gu.x < -30 || gu.x > VW+30) && gu.state === 'out') g.gulls.splice(i,1);
    }
    Particles.update();
  },
  dropFish(gu){
    const g = this.s;
    const back = gu.carry; gu.carry = 0;
    const p = g.piles.reduce((a,b)=> a.n <= b.n ? a : b);
    p.n += back;
    Particles.burst(gu.x, gu.y, '#ffd166', 4, 1.4, 'sq');
  },
  done(){
    const g = this.s;
    const saved = this.totalFish();
    const win = saved >= 18;
    if (win) recordWin('gull');
    let bonusFish = 0, title = win ? 'STASH DEFENDED' : 'STASH RAIDED';
    let note = saved + ' LEFT - ' + g.hits + ' SWATTED';
    if (g.radiant){
      const first = !State.owned['head_gildedplume'];
      State.stats.gilded = (State.stats.gilded||0) + 1;
      if (!first) bonusFish = 900;
      note = first ? 'RADIANT GULL DOWNED!' : 'RADIANT GULL - BONUS FISH!';
      title = 'RADIANT CATCH';
    }
    const score = saved*22 + g.hits*14 + g.golden*45 + (g.radiant?1000:0);
    finishGame({score:score, fish:score*0.4 + bonusFish, xp:score/9 + (g.radiant?60:0),
      rolls:1 + Math.floor(saved/12) + (win?1:0) + (g.radiant?2:0),
      luck:saved*0.004 + (g.radiant?0.3:0), win:win || g.radiant>0, title:title, note:note});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, skyPalette());
    drawSeaBand(c, 74, 18, g.t, '#2a6ab5');
    c.fillStyle = '#e6f4ff'; c.fillRect(0,92,VW,VH-92);
    c.fillStyle = '#cfe9ff'; c.fillRect(0,92,VW,3);
    for (let i=0;i<20;i++){ c.fillStyle='#dff3ff'; c.fillRect((i*23+7)%VW, 104+(i%5)*9, 3, 1); }
    /* piles */
    g.piles.forEach(p=>{
      for (let i=0;i<p.n;i++){
        const px = p.x - 10 + (i%5)*5, py = 112 - ((i/5)|0)*4;
        c.fillStyle = i%2 ? '#9ee5ff' : '#4fd6ff'; c.fillRect(px, py, 5, 3);
        c.fillStyle = '#0d1024'; c.fillRect(px+1, py+1, 1, 1);
      }
      c.fillStyle = '#8a5a34'; c.fillRect(p.x-13, 116, 26, 3);
      drawTextC(c, ''+p.n, p.x, 120, p.n>4?'#ffffff':'#ff5c7a', 1, '#0d1024');
    });
    if (g.decoy){ c.fillStyle='#ffd166'; c.fillRect(g.decoy.x-4, 106, 8, 4); c.fillStyle='#e0a05a'; c.fillRect(g.decoy.x+4,107,3,2);
      drawTextC(c,'DECOY',g.decoy.x,98,'#ffd166',1,'#0d1024'); }
    /* gulls */
    for (const gu of g.gulls){
      const x = gu.x|0, y = gu.y|0, fl = (g.t/5|0)%2, dead = gu.dead>0;
      const rad = gu.kind === 'radiant', gold = gu.kind === 'golden';
      if (rad && !State.opt.noflash){
        c.globalAlpha = 0.20 + 0.12*Math.sin(g.t/5); c.fillStyle = '#ffd166';
        c.fillRect(x-16, y-10, 32, 26); c.globalAlpha = 1;
      }
      const body = dead ? '#ff9ecb' : rad ? ((g.t/4|0)%2 ? '#fff8d0' : '#ffe9a8') : gold ? '#ffd166' : '#f6fbff';
      const wing = dead ? '#ff9ecb' : rad ? '#ffd166' : gold ? '#e0a05a' : '#e6eef7';
      c.fillStyle = body; c.fillRect(x-5, y, 10, 6);
      c.fillStyle = wing;
      c.fillRect(x-11, y+(fl?-3:3), 7, 2); c.fillRect(x+4, y+(fl?-3:3), 7, 2);
      c.fillStyle = rad ? '#ff9ecb' : '#ffd166'; c.fillRect(x+5, y+2, 4, 2);
      c.fillStyle = '#0d1024'; c.fillRect(x+2, y+1, 1, 1);
      c.fillStyle = '#8fa3b8'; c.fillRect(x-2, y+6, 1, 2); c.fillRect(x+1, y+6, 1, 2);
      if (rad){ c.fillStyle = '#ffffff'; c.fillRect(x-1, y-3, 2, 2); c.fillRect(x-3, y-2, 1, 1); c.fillRect(x+2, y-2, 1, 1); }
      if (gu.hp > 1){ c.fillStyle = '#ffffff'; c.fillRect(x-5, y-6, 10, 1); c.fillStyle = '#ff5c7a'; c.fillRect(x-5, y-6, 5, 1); }
      if (gu.carry){ c.fillStyle='#4fd6ff';
        for (let k=0;k<gu.carry;k++) c.fillRect(x-3+k*5, y+7, 4, 3); }
    }
    Particles.draw(c);
    g.y0 = 96;
    drawSeal(c, g.x, 92, playerLook({facing:g.face, frame:(g.t/8|0)%2}));
    if (g.swat > 4){
      c.fillStyle = 'rgba(255,255,255,.9)';
      const ax = g.x + 12 + g.face*16;
      c.fillRect(ax-6, 88, 12, 3); c.fillRect(ax-2, 82, 4, 12);
    }
    gameHUD(c, {left:'FISH '+this.totalFish(), right:Math.ceil(g.time/60)+'S', mid:'SWATS '+g.hits,
                leftCol:this.totalFish()<10?'#ff5c7a':'#ffd166'});
    if (g.decoyCd > 0){ c.fillStyle='#2a3768'; c.fillRect(VW-52,13,50,3); c.fillStyle='#5be584'; c.fillRect(VW-52,13,50*(1-g.decoyCd/420),3); }
    else drawText(c,'B: DECOY', VW-50, 13, '#5be584', 1);
    if (g.msgT>0) drawTextC(c, g.msg, VW/2, 30, '#ff9ecb', 1, '#0d1024');
    if (g.over) bigMsg(c, this.totalFish()>=18?'DEFENDED':'RAIDED', this.totalFish() + ' FISH LEFT');
  }
});

/* ============================================================
   28. DEEP DIVE - a breath-hold round trip through a trench
   You fly a narrowing cave, not a field of floating objects. Depth
   only counts once you make it back to the surface, so the whole
   game is judging when to turn around. Currents shove, the walls
   tighten, and the air only goes one way.
   ============================================================ */
const DIVE_SEG = 8;                 /* world pixels per terrain sample */
Object.assign(GAMES.dive, {
  start(){
    const maxO = 100 * (1 + State.gear.lungs*0.10);
    this.s = {
      x:120, vx:0, y:44, depth:0, vy:0, t:0, o2:maxO, maxO:maxO,
      wall:[], base:0, over:0, hurt:0, phase:'down', turn:0,
      pearls:0, msg:'DIVE - B TO SINK, UP TO RISE', msgT:110,
      best:0, scrape:0, banked:false, current:0, curT:120, glows:[]
    };
    /* seed the trench profile */
    for (let i=0;i<40;i++) this.pushSeg();
  },
  /* the cave is a centre line plus a half-width, both drifting */
  pushSeg(){
    const g = this.s;
    const i = g.wall.length;
    const d = i * DIVE_SEG;                       /* depth of this sample */
    const tight = clamp(d/5200, 0, 1);
    const half = 62 - tight*40 + Math.sin(i/7)*7 + Math.sin(i/2.7)*4;
    const mid = 120 + Math.sin(i/9)*34 + Math.sin(i/3.3)*14 + Math.sin(i/23)*24;
    g.wall.push({mid: clamp(mid, 40, 200), half: Math.max(15, half)});
    /* glowing pockets to graze for oxygen, denser deeper */
    if (i > 6 && Math.random() < 0.18 + tight*0.12)
      g.glows.push({i:i, x: clamp(mid + rnd(half*1.2, -half*1.2), 14, VW-14), taken:0,
                    kind: Math.random() < 0.22 + tight*0.2 ? 'pearl' : 'air'});
  },
  sampleAt(depth){
    const g = this.s;
    const i = depth / DIVE_SEG;
    const i0 = Math.max(0, Math.floor(i)), i1 = i0+1;
    while (g.wall.length <= i1 + 4) this.pushSeg();
    const a = g.wall[i0], b = g.wall[i1] || a, f = i - i0;
    return {mid: lerp(a.mid, b.mid, f), half: lerp(a.half, b.half, f)};
  },
  meters(){ return Math.floor(this.s.depth/4); },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.hurt>0) g.hurt--;
    if (g.scrape>0) g.scrape--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }

    /* steering */
    let mx = 0;
    if (Input.key('left')) mx -= 1;
    if (Input.key('right')) mx += 1;
    const st = Stick.read();
    if (st) mx = st.x;
    else if (Input.ptr.down){ const d = Input.ptr.x - g.x; if (Math.abs(d) > 4) mx = clamp(d/30,-1,1); }
    /* momentum, so the trench has to be flown rather than nudged */
    g.vx += mx * 0.42;
    g.vx *= 0.90;
    /* side currents push harder the deeper you are */
    g.curT--;
    if (g.curT <= 0){ g.curT = rnd(200,90); g.current = rnd(0.5,-0.5) * (0.4 + this.meters()/900);
      if (Math.abs(g.current) > 0.25){ g.msg = g.current>0 ? 'CURRENT PUSHING RIGHT' : 'CURRENT PUSHING LEFT'; g.msgT = 60; } }
    g.vx += g.current * 0.16;
    g.x = clamp(g.x + g.vx, 8, VW-8);

    /* vertical: down by default, up when you ask */
    const sinking = Input.key('b') || Input.key('down');
    const rising  = Input.key('up');
    if (rising){ g.phase = 'up'; g.vy = -1.75 - State.gear.speed*0.05; }
    else if (sinking){ g.phase = 'down'; g.vy = 2.45; }
    else { g.vy = g.phase === 'up' ? -1.15 : 1.15; }
    g.depth = Math.max(0, g.depth + g.vy);
    g.best = Math.max(g.best, this.meters());

    /* air: rising costs less than sinking, and depth costs more */
    const m = this.meters();
    g.o2 -= 0.048 + m/26000 + (sinking?0.022:0) + (rising?0.006:0);

    /* surfaced with air left: the run banks */
    if (g.depth <= 2 && g.t > 60){
      if (g.best > 0){ g.banked = true; g.over = 70; Audio_.sfx('legend'); g.msg = 'SURFACED!'; g.msgT = 70; }
    }
    if (g.o2 <= 0){ g.o2 = 0; g.over = 80; g.banked = false; Audio_.sfx('fail'); }

    /* walls */
    const s = this.sampleAt(g.depth);
    const left = s.mid - s.half, right = s.mid + s.half;
    if (g.x < left + 5 || g.x > right - 5){
      g.x = clamp(g.x, left + 5, right - 5);
      g.vx *= -0.35;
      if (g.scrape <= 0){
        g.scrape = 26; g.o2 -= 5; Audio_.sfx('hit'); shake();
        Particles.burst(g.x, 46, '#ff9ecb', 6, 1.8, 'sq');
        g.msg = 'SCRAPED THE WALL'; g.msgT = 45;
      }
    }
    /* pickups: only reachable by flying close to them */
    for (const p of g.glows){
      if (p.taken) continue;
      const py = 46 + (p.i*DIVE_SEG - g.depth);
      if (py < -20 || py > VH+20) continue;
      if (Math.abs(p.x - g.x) < 11 && Math.abs(py - 46) < 11){
        p.taken = 1;
        if (p.kind === 'pearl'){ g.pearls++; Audio_.sfx('perfect');
          Particles.burst(p.x, py, '#ffd166', 12, 2.2, 'star'); g.msg = 'DEEP PEARL!'; g.msgT = 60; }
        else { g.o2 = Math.min(g.maxO, g.o2 + 15); Audio_.sfx('bubble');
          Particles.burst(p.x, py, '#9ee5ff', 6, 1.4, 'ring'); }
      }
    }
    if (State.equipped.trail && g.t%3===0) Particles.spawnTrail(State.equipped.trail, g.x, 46, 0, g.vy>0?-1:1);
    Particles.update();
  },
  done(){
    const g = this.s;
    /* only banked depth counts - that is the whole tension */
    const m = g.banked ? g.best : Math.floor(g.best * 0.35);
    State.stats.deepest = Math.max(State.stats.deepest||0, m);
    finishGame({score:m, fish: m*0.75 + g.pearls*55, xp: m/4.5,
      rolls: 1 + g.pearls + Math.floor(m/420),
      luck: 0.04*g.pearls + m/9000, win: g.banked && m >= 450,
      title: g.banked ? (m>=900 ? 'ABYSS AND BACK' : 'SURFACED SAFELY') : 'BLACKED OUT',
      note: g.banked ? m+'M BANKED' : 'REACHED '+g.best+'M, LOST MOST'});
  },
  draw(c){
    const g = this.s, m = this.meters();
    const dark = clamp(m/950, 0, 1);
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0, `rgb(${(20*(1-dark))|0},${(70*(1-dark)+6)|0},${(130*(1-dark)+20)|0})`);
    grd.addColorStop(1, `rgb(${(3*(1-dark))|0},${(14*(1-dark))|0},${(38*(1-dark)+6)|0})`);
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);

    /* trench walls, drawn per screen row */
    for (let y=0;y<VH;y++){
      const d = g.depth + (y - 46);
      if (d < 0){ c.fillStyle = '#cfe9ff'; c.fillRect(0, y, VW, 1); continue; }
      const s = this.sampleAt(d);
      const l = Math.max(0, (s.mid - s.half)|0), r = Math.min(VW, (s.mid + s.half)|0);
      const shade = 26 + (y%3)*5 + dark*8;
      c.fillStyle = `rgb(${(38-shade*0.4)|0},${(54-shade*0.4)|0},${(84-shade*0.5)|0})`;
      c.fillRect(0, y, l, 1); c.fillRect(r, y, VW-r, 1);
      c.fillStyle = `rgb(${(70-dark*40)|0},${(96-dark*50)|0},${(140-dark*70)|0})`;
      c.fillRect(l-2, y, 2, 1); c.fillRect(r, y, 2, 1);
    }
    /* pickups */
    for (const p of g.glows){
      if (p.taken) continue;
      const py = 46 + (p.i*DIVE_SEG - g.depth);
      if (py < -12 || py > VH+12) continue;
      const pulse = (g.t/7|0)%2;
      if (p.kind === 'pearl'){
        if (!State.opt.noflash){ c.globalAlpha = 0.16; c.fillStyle = '#ffd166';
          c.fillRect(p.x-9, py-9, 18, 18); c.globalAlpha = 1; }
        c.fillStyle = pulse ? '#fff3b0' : '#ffd166'; c.fillRect(p.x-4, py-4, 8, 8);
        c.fillStyle = '#ffffff'; c.fillRect(p.x-2, py-3, 2, 2);
      } else {
        c.fillStyle = 'rgba(158,229,255,.9)';
        c.fillRect(p.x-3, py-4, 6, 1); c.fillRect(p.x-4, py-3, 8, 6); c.fillRect(p.x-3, py+3, 6, 1);
        c.fillStyle = '#ffffff'; c.fillRect(p.x-2, py-2, 2, 2);
      }
    }
    Particles.draw(c);
    /* the seal, nose down or nose up */
    if (!(g.hurt>0 && (g.t/4|0)%2)){
      const o = playerLook({facing:1, frame:(g.t/7|0)%2, pose:'swim',
                            rot: g.phase==='up' ? -1.1 : 1.1});
      drawSeal(c, g.x-12, 40, o);
    }
    Stick.draw(c);

    /* HUD */
    c.fillStyle = 'rgba(13,16,36,.72)'; c.fillRect(0,0,VW,11);
    c.fillStyle = '#0d2a3a'; c.fillRect(30,3,110,5);
    const o2p = g.o2/g.maxO;
    c.fillStyle = o2p > 0.5 ? '#4fd6ff' : o2p > 0.22 ? '#ffd166' : ((g.t/6|0)%2 ? '#ff5c7a':'#8a2438');
    c.fillRect(30,3,110*o2p,5);
    drawText(c, 'AIR', 8, 2, '#9ee5ff', 1);
    drawText(c, m + 'M', VW - textW(m+'M',1) - 3, 2, '#ffffff', 1);
    /* the round-trip gauge: how much of your air the climb back needs */
    const needed = clamp(m/900, 0, 1.2);
    c.fillStyle = '#2a3768'; c.fillRect(30, 9, 110, 1);
    c.fillStyle = needed > o2p ? '#ff5c7a' : '#7bffe0';
    c.fillRect(30, 9, Math.min(110, 110*needed), 1);
    if (needed > o2p * 0.92 && !g.over)
      drawTextC(c, (g.t/8|0)%2 ? 'TURN BACK NOW' : '', VW/2, 16, '#ff5c7a', 1, '#0d1024');
    if (g.pearls) drawText(c, 'PEARLS ' + g.pearls, 3, 152, '#ffd166', 1, '#0d1024');
    drawText(c, g.phase === 'up' ? 'RISING' : 'SINKING', VW-46, 152,
             g.phase==='up' ? '#7bffe0' : '#9ee5ff', 1, '#0d1024');
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 66, '#ffd166', 1, '#0d1024');
    if (g.scrape > 0 && !State.opt.noflash){ c.fillStyle = 'rgba(255,92,122,.18)'; c.fillRect(0,0,VW,VH); }
    if (g.over) bigMsg(c, g.banked ? 'SURFACED' : 'OUT OF AIR', g.banked ? m+'M BANKED' : 'DEPTH LOST');
  }
});

/* ============================================================
   29. AURORA WATCH - calm memory round
   ============================================================ */
const AUR_COL = [['#7bffe0','#2a9c88'],['#4fd6ff','#1b6a9a'],['#b06bff','#6a3a9a'],['#ffd166','#b07a1a']];
const AUR_KEY = ['up','left','down','right'];
Object.assign(GAMES.aurora, {
  start(){
    this.s = {round:1, seq:[], idx:0, state:'show', showI:0, showT:36, t:0, flash:-1, flashT:0,
      mistakes:0, score:0, over:0, msg:'WATCH THE LIGHTS', msgT:80, maxRound:6};
    this.build();
  },
  build(){ const g = this.s; g.seq = []; for (let i=0;i<g.round+2;i++) g.seq.push(rndi(4));
    g.showI = 0; g.showT = 80; g.state = 'pause'; g.idx = 0; },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--; if (g.flashT>0) g.flashT--; else g.flash = -1;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.state === 'pause'){        /* quiet beat before the lights start */
      if (--g.showT <= 0){ g.state = 'show'; g.showI = 0; g.showT = 46; }
      return;
    }
    if (g.state === 'show'){
      g.showT--;
      if (g.showT === 30){ g.flash = g.seq[g.showI]; g.flashT = 26;
        Audio_.blip([523,659,784,1047][g.flash], 0.26, 'triangle', 0.2); }
      if (g.showT <= 0){
        g.showI++;
        /* a clear gap between flashes, easing only slightly with the round */
        g.showT = Math.max(38, 52 - g.round*2);
        if (g.showI >= g.seq.length){ g.state = 'input'; g.msg = 'YOUR TURN'; g.msgT = 60; }
      }
      return;
    }
    let pressed = -1;
    AUR_KEY.forEach((k,i)=>{ if (Input.hit(k)) pressed = i; });
    if (Input.ptr.tapped){ const band = clamp(Math.floor((Input.ptr.y - 16)/22), 0, 3); pressed = band; }
    if (pressed >= 0){
      g.flash = pressed; g.flashT = 14;
      Audio_.blip([523,659,784,1047][pressed], 0.18, 'triangle', 0.2);
      if (g.seq[g.idx] === pressed){
        g.idx++; g.score += 25 + g.round*5;
        Particles.burst(rnd(VW), 20 + pressed*22, AUR_COL[pressed][0], 5, 1.2, 'plus');
        if (g.idx >= g.seq.length){
          g.round++;
          g.score += 120 * g.round;
          if (g.round > g.maxRound){
            if (g.mistakes === 0){ State.stats.flawlessAurora = (State.stats.flawlessAurora||0) + 1; }
            g.over = 70; Audio_.sfx('legend'); g.msg = 'THE SKY IS PLEASED'; g.msgT = 70;
          } else { Audio_.sfx('good'); g.msg = 'ROUND ' + g.round; g.msgT = 60; this.build(); }
        }
      } else {
        g.mistakes++; g.idx = 0; Audio_.sfx('fail'); shake();
        g.msg = 'MISSTEP - WATCH AGAIN'; g.msgT = 80;
        if (g.mistakes >= 3){ g.over = 70; g.msg = 'THE LIGHTS FADE'; }
        else { g.state = 'pause'; g.showI = 0; g.showT = 90; }
      }
    }
    Particles.update();
  },
  done(){
    const g = this.s;
    const flawless = g.mistakes === 0 && g.round > g.maxRound;
    finishGame({score:g.score, fish:g.score*0.4, xp:g.score/8,
      rolls: 1 + (g.round>3?1:0) + (flawless?2:0), luck: flawless?0.25:0.05,
      win: g.round > g.maxRound, title: flawless ? 'FLAWLESS VIGIL' : g.round>g.maxRound ? 'VIGIL COMPLETE' : 'LIGHTS FADED',
      note: 'ROUND ' + Math.min(g.round,g.maxRound) + '/' + g.maxRound + (flawless?' - NO MISTAKES':'  -  '+g.mistakes+' SLIPS')});
  },
  draw(c){
    const g = this.s;
    c.fillStyle = '#050a20'; c.fillRect(0,0,VW,VH);
    for (let i=0;i<50;i++){
      const x = (i*47)%VW, y = (i*31)%110;
      c.fillStyle = Math.sin(g.t/30+i)>0.4 ? '#ffffff' : '#8fa3d6';
      c.fillRect(x,y,1,1);
    }
    /* aurora bands */
    for (let b=0;b<4;b++){
      const on = g.flash === b && g.flashT > 0;
      const col = on ? AUR_COL[b][0] : AUR_COL[b][1];
      c.globalAlpha = on ? 0.95 : 0.42;
      c.fillStyle = col;
      for (let x=0;x<VW;x+=2){
        const h = 12 + Math.sin(x/22 + g.t/40 + b)*5 + (on?6:0);
        c.fillRect(x, 16 + b*22 + Math.sin(x/30 + g.t/30 + b*2)*3, 2, h);
      }
      c.globalAlpha = 1;
      if (on){ c.fillStyle = 'rgba(255,255,255,.30)'; c.fillRect(0, 16+b*22, VW, 4); }
      /* a big labelled key plate per band, lit when that band fires */
      const py = 15 + b*22, keyCol = AUR_COL[b][0];
      c.fillStyle = on ? keyCol : 'rgba(5,10,32,.92)';
      c.fillRect(3, py, 26, 19);
      c.fillStyle = keyCol;
      c.fillRect(3, py, 26, 1); c.fillRect(3, py+18, 26, 1);
      c.fillRect(3, py, 1, 19); c.fillRect(28, py, 1, 19);
      GAMES.aurora.arrow(c, 7, py + 4, b, on ? '#05070f' : keyCol);
      drawText(c, ['UP','LFT','DN','RGT'][b], 18, py + 6, on ? '#05070f' : keyCol, 1);
    }
    /* ice + watchers */
    c.fillStyle = '#0b1230'; c.fillRect(0,118,VW,VH-118);
    c.fillStyle = '#1b2a5e'; c.fillRect(0,118,VW,3);
    for (let i=0;i<3;i++){
      drawSeal(c, 150 + i*28, 122 + (i%2), {cos:{fur:['fur_slate','fur_charcoal','fur_deepnavy'][i]},
        facing:-1, frame:(g.t/40|0)%2, alpha:0.75});
    }
    Particles.draw(c);
    drawSeal(c, 20, 122, playerLook({facing:1, frame:(g.t/30|0)%2, pose:'idle'}));
    gameHUD(c, {left:'ROUND '+Math.min(g.round,g.maxRound)+'/'+g.maxRound, right:fmt(g.score),
                mid: g.state==='show' ? 'WATCH' : 'REPEAT ('+(g.idx)+'/'+g.seq.length+')',
                midCol: g.state==='show' ? '#8fa3d6' : '#7bffe0'});
    for (let i=0;i<3;i++){ c.fillStyle = i < (3-g.mistakes) ? '#7bffe0' : '#2a3768'; c.fillRect(VW-10-i*6, 13, 4, 4); }
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 112, '#ffffff', 1, '#050a20');
    if (g.state === 'pause') drawTextC(c, 'GET READY...', VW/2, 104, (g.t/14|0)%2 ? '#7bffe0':'#4a6a9a', 1, '#050a20');
    if (g.over) bigMsg(c, g.mistakes===0 && g.round>g.maxRound ? 'FLAWLESS' : 'GOODNIGHT', fmt(g.score)+' PTS');
  },
  /* chunky arrow glyph for the key plates */
  arrow(c, x, y, d, col){
    c.fillStyle = col;
    if (d === 0){ c.fillRect(x+3,y,2,2); c.fillRect(x+2,y+2,4,1); c.fillRect(x+1,y+3,6,1); c.fillRect(x+3,y+4,2,6); }
    else if (d === 2){ c.fillRect(x+3,y,2,6); c.fillRect(x+1,y+6,6,1); c.fillRect(x+2,y+7,4,1); c.fillRect(x+3,y+8,2,2); }
    else if (d === 1){ c.fillRect(x,y+4,2,2); c.fillRect(x+2,y+3,1,4); c.fillRect(x+3,y+2,1,6); c.fillRect(x+4,y+4,6,2); }
    else { c.fillRect(x+8,y+4,2,2); c.fillRect(x+7,y+3,1,4); c.fillRect(x+6,y+2,1,6); c.fillRect(x,y+4,6,2); }
  }
});

/* ============================================================
   30. MAIN LOOP + BOOT
   ============================================================ */
let lastT = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = ts - lastT; lastT = ts;
  if (dt > 200) dt = 200;
  acc += dt;
  const step = 1000/60;
  let guard = 0;
  while (acc >= step && guard++ < 4){
    acc -= step;
    tick();
  }
  render();
}
function tick(){
  Scene.t++;
  if (UI.anyOpen()){ Input.clear(); if ($('#scr-wardrobe').classList.contains('show')) UI.pvT = (UI.pvT||0)+1; return; }
  switch(Scene.name){
    case 'hub': Hub.update(); break;
    case 'game': if (Runner.g && Runner.g.update) Runner.g.update(); break;
    case 'results': Results.update(); break;
  }
  Input.clear();
}
function render(){
  ctx.imageSmoothingEnabled = false;
  /* full clear each frame so no scene can leak pixels into the next */
  ctx.globalAlpha = 1; ctx.fillStyle = '#05070f'; ctx.fillRect(0,0,VW,VH);
  switch(Scene.name){
    case 'hub': Hub.draw(ctx); break;
    case 'game': if (Runner.g && Runner.g.draw) Runner.g.draw(ctx); break;
    case 'results': Results.draw(ctx); break;
    default: ctx.fillStyle = '#070b1c'; ctx.fillRect(0,0,VW,VH);
  }
  if ($('#scr-wardrobe').classList.contains('show')) UI.pvDraw($('#pvcanvas').getContext('2d'));
}
/* keep the stage tall enough on short screens */
function fitStage(){
  const app = document.getElementById('app');
  const top = document.getElementById('topbar').offsetHeight;
  const under = document.getElementById('underbar').offsetHeight;
  const pad = document.getElementById('pad');
  const avail = app.clientHeight - top - under - 12;
  const wrap = document.getElementById('stagewrap');
  /* leave room for the control pad on short screens, otherwise go as big as we can */
  const maxByH = Math.max(150, avail - Math.min(210, app.clientHeight * 0.30));
  const maxByW = Math.min(860, app.clientWidth) - 8;
  const w = Math.min(maxByW, maxByH * 1.5);
  wrap.style.maxWidth = Math.round(w) + 'px';
  const wide = app.clientWidth > 760 && app.clientHeight > 620;
  pad.style.opacity = wide ? '0.55' : '1';
}
addEventListener('resize', fitStage);
addEventListener('orientationchange', ()=> setTimeout(fitStage, 120));

function boot(){
  loadGame();
  applyOptions();
  checkQuests(true);
  currentRotation();
  UI.refreshTop();
  Hub.init();
  setScene('hub');
  fitStage();
  saveGame();
  setInterval(()=>{ if (!UI.anyOpen()) saveGame(); }, 20000);
  addEventListener('visibilitychange', ()=>{ if (document.hidden){ saveGame(); FileSave.flush(); } });
  addEventListener('beforeunload', saveGame);
  addEventListener('pagehide', ()=>{ saveGame(); FileSave.flush(); });
  /* re-attach the linked save file first, so its own prompt never races the welcome */
  Promise.resolve(FileSave.boot()).catch(()=>{}).then(()=> setTimeout(firstRunWelcome, 350));
  requestAnimationFrame(frame);
}
function firstRunWelcome(){
  if ($('#modal').classList.contains('show')) return;        /* the file resume prompt owns the screen */
  if (FileSave.status === 'needs-permission') return;
  /* shown once ever, tracked by a flag - inferring it from progress meant it
     reappeared on every load until the player happened to earn some fish */
  if (State.flags.welcomed){ Install.maybeNudge(); return; }
  const box = modal('Welcome to Seal Vault',
    'You are a seal. So is everyone else.<br><br>Walk the floe with <kbd>ARROWS</kbd> or the pad, press <kbd>A</kbd> at the '+
    'VAULT GATE to dive into a minigame, and bring fish home for gear and cosmetics.'+
    '<div style="margin-top:10px">NAME YOUR SEAL</div>'+
    '<input id="newname" maxlength="8" placeholder="PIP" autocomplete="off" '+
    'style="width:100%;background:#0a1130;color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:6px;margin-top:4px">'+
    '<div class="muted" style="margin-top:8px">Progress saves in this browser. SYS has a backup file and an auto-save option.</div>',
    [{t:'LETS GO', keep:true},{t:'HOW TO PLAY', keep:true}]);
  const inp = box.querySelector('#newname');
  const btns = box.querySelectorAll('.row button');
  const commit = ()=>{
    const v = cleanName(inp.value);
    if (v) State.name = v;
    State.flags.welcomed = 1;
    saveGame(); UI.refreshTop(); closeModal();
    setTimeout(()=>{ if (!UI.anyOpen()) Install.maybeNudge(); }, 500);
  };
  btns[0].onclick = commit;
  btns[1].onclick = ()=>{ commit(); UI.open('scr-help'); };
  inp.addEventListener('keydown', e=>{ if (e.code === 'Enter'){ e.preventDefault(); commit(); } });
  setTimeout(()=>{ try { inp.focus(); } catch(e){} }, 60);
}
function cleanName(v){
  return String(v || '').replace(/[^A-Za-z0-9 ]/g,'').trim().toUpperCase().slice(0,8);
}
/* rename from anywhere: SYS, or the wardrobe preview */
function renameSeal(after){
  const box = modal('Name your seal',
    '<input id="nmbox" maxlength="8" autocomplete="off" value="'+State.name+'" '+
    'style="width:100%;background:#0a1130;color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:6px">'+
    '<div class="muted" style="margin-top:6px">UP TO 8 LETTERS OR NUMBERS.</div>',
    [{t:'SAVE', keep:true},{t:'CANCEL'}]);
  const inp = box.querySelector('#nmbox');
  const commit = ()=>{
    const v = cleanName(inp.value);
    if (v) State.name = v;
    closeModal(); saveGame(); UI.refreshTop();
    if (after) after();
  };
  box.querySelector('.row button').onclick = commit;
  inp.addEventListener('keydown', e=>{ if (e.code === 'Enter'){ e.preventDefault(); commit(); } });
  setTimeout(()=>{ try { inp.focus(); inp.select(); } catch(e){} }, 60);
}
/* debug/test hook - lets a harness drive the game without a human */
window.SV = {State:()=>State, COS:COS, GAMES:GAMES, start:startGame, scene:()=>Scene.name, UI:UI,
  finish:(o)=>finishGame(o||{score:1,fish:10,xp:5,rolls:1}), rollLoot:rollLoot, save:saveGame,
  grant:(id)=>grantItem(id), quests:QUESTS, hub:Hub, runner:Runner, audio:Audio_, input:Input,
  sealCanvas:sealCanvas, thumb:itemThumbCanvas, CANW:CANW, CANH:CANH, PADX:PADX, PADY:PADY,
  fileSave:FileSave, importText:importSaveText, load:loadGame, install:Install,
  version:'1.2.0'};
boot();

})();
</script>
