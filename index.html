   ============================================================ */
const Runner = {key:null, g:null, paused:false};
function startGame(key){
  const g = GAMES[key];
  if (!g || !g.start) { toast('VAULT SEALED'); return; }
  Runner.key = key; Runner.g = g; Runner.paused = false;
  Particles.clear();
  g.start();
  setScene('game');
  Audio_.play(g.music || 'action');
  updateHint();
}
function finishGame(o){
  const key = Runner.key;
  const fishMult = prestigeMult() * eventFishMult();
  const fish = Math.round((o.fish||0) * fishMult);
  const xp   = Math.round((o.xp||0) * eventXpMult());
  addFish(fish); addXP(xp);
  recordPlay(key, o.score, o.cleared !== false);
  if (o.win) recordWin(key);
  const loot = [];
  const rolls = clamp(o.rolls||0, 0, 6);
  for (let i=0;i<rolls;i++) loot.push(rollLoot(o.luck||0));
  const unlocked = checkQuests(true);
  saveGame(); UI.refreshTop();
  Results.set({key:key, title:o.title || (o.win ? 'VAULT CLEARED' : 'RUN COMPLETE'),
               score:o.score||0, fish:fish, xp:xp, loot:loot, unlocked:unlocked, note:o.note||''});
  setScene('results');
}
const Results = {
  data:null, reveal:0, t:0,
  set(d){ this.data = d; this.reveal = 0; this.t = 0;
    const best = d.loot.reduce((a,r)=>Math.max(a, r.dupe?-1:r.rarity), -1);
    setTimeout(()=>Audio_.sfx(best>=R_LEGEND?'legend':best>=R_EPIC?'unlock':'good'), 260);
  },
  update(){
    this.t++;
    if (this.t > 40 && this.reveal < this.data.loot.length && this.t % 26 === 0){
      this.reveal++;
      const r = this.data.loot[this.reveal-1];
      Audio_.sfx(r.dupe ? 'blip' : r.rarity >= R_EPIC ? 'unlock' : 'coin');
      if (!r.dupe && r.rarity >= R_EPIC && !State.opt.noflash) shake();
    }
    if (Input.hit('a') || (Input.ptr.tapped && this.t > 20)){
      if (this.reveal < this.data.loot.length && this.t > 40){ this.reveal = this.data.loot.length; }
      else { Hub.init(); setScene('hub'); }
    }
    if (Input.hit('b')) startGame(this.data.key);
    Particles.update();
  },
  draw(c){
    const d = this.data, t = this.t;
    const hasUnlock = d.unlocked && d.unlocked.length;
    drawSky(c, t, {a:'#0a1130', b:'#1b2a56', night:1});
    drawIceEdge(c, 134, '#cfe9ff', '#f6fbff');
    c.fillStyle = 'rgba(9,12,30,.86)'; c.fillRect(6,10,VW-12,108);
    c.strokeStyle = '#4fd6ff'; c.lineWidth = 1; c.strokeRect(6.5,10.5,VW-13,107);
    drawTextC(c, d.title, VW/2, 14, '#7bffe0', 1, '#0d1024');
    drawTextC(c, GAMES[d.key].n, VW/2, 24, '#ffffff', 1);
    drawText(c, 'SCORE ' + fmt(d.score), 12, 38, '#ffffff', 1);
    drawText(c, 'FISH  +' + fmt(d.fish), 12, 48, '#ffd166', 1);
    drawText(c, 'XP    +' + fmt(d.xp), 12, 58, '#7bffe0', 1);
    if ((State.stats.best[d.key]||0) <= d.score && d.score > 0)
      drawText(c, 'NEW BEST!', 12, 70, (t/8|0)%2 ? '#ffd166' : '#ff9ecb', 1);
    if (d.note) drawText(c, d.note.slice(0,15), 12, 82, '#9ee5ff', 1);
    /* loot column */
    const LX = 112, LW = 120, ROWS = hasUnlock ? 3 : 5;
    for (let i=0;i<Math.min(this.reveal, ROWS);i++){
      const r = d.loot[i], y = 32 + i*17;
      const col = RARITY[r.rarity].c;
      c.fillStyle = '#0b1230'; c.fillRect(LX,y,LW,15);
      c.fillStyle = col; c.fillRect(LX,y,2,15); c.fillRect(LX,y,LW,1); c.fillRect(LX,y+14,LW,1);
      if (r.item){
        c.drawImage(itemThumbCanvas(r.item), 4,7,32,26, LX+3, y+1, 16, 13);
        drawText(c, r.item.name.slice(0,10), LX+21, y+4, r.dupe ? '#8fa3d6' : '#ffffff', 1);
      } else drawText(c, 'PEARLS', LX+21, y+4, '#9ee5ff', 1);
      drawText(c, r.dupe ? '+'+r.pearls+'P' : 'NEW', LX+LW-34, y+4, r.dupe ? '#9ee5ff' : col, 1);
      drawRarityMark(c, LX+LW-10, y+4, 7, r.rarity);
    }
    const lootEndY = 32 + Math.min(this.reveal,ROWS)*17 + 2;
    if (this.reveal > ROWS) drawText(c, '+' + (this.reveal-ROWS) + ' MORE - SEE WARDROBE', LX, lootEndY, '#8fa3d6', 1);
    else if (this.reveal < d.loot.length && t > 40)
      drawText(c, 'OPENING...', LX, lootEndY, (t/10|0)%2 ? '#8fa3d6':'#4fd6ff', 1);
    /* quest unlock banner */
    if (hasUnlock){
      const u = d.unlocked[0];
      c.fillStyle = 'rgba(123,255,224,.16)'; c.fillRect(8,94,VW-16,22);
      c.fillStyle = RARITY[R_EXCL].c; c.fillRect(8,94,VW-16,1); c.fillRect(8,115,VW-16,1);
      drawTextC(c, 'QUEST UNLOCK', VW/2, 97, '#7bffe0', 1);
      drawTextC(c, u.name.slice(0,26), VW/2, 106, '#ffffff', 1);
    }
    /* seal doing its victory emote, in front of the panel */
    const o = playerLook({facing:1, frame:(t/8|0)%2});
    applyEmote(o, State.equipped.emote, t, 26, 128);
    drawSeal(c, 26 + (o.dx||0), 128 + (o.dy||0), o);
    Particles.draw(c);
    drawTextC(c, 'A: HUB    B: PLAY AGAIN', VW/2 + 30, 148, '#2a3f6a', 1, '#dbecfb');
  }
};
function doPrestige(){
  if (State.level < MAX_LEVEL || State.prestige >= MAX_PRESTIGE) return;
  State.prestige++;
  State.level = 1; State.xp = 0; State.fish = 0;
  GEAR.forEach(g=> State.gear[g.k] = 0);
  checkQuests();
  saveGame(); UI.refreshAll(); Hub.init();
  Audio_.sfx('legend');
  modal('Rebirth', 'You surface with a new trim and stronger instincts.<br><br>PRESTIGE ' + State.prestige +
    '<br>FISH +' + Math.round((prestigeMult()-1)*100) + '%<br>LUCK +' + (State.prestige*5) + '%', [{t:'ONWARD'}]);
}

function pointerSteer(px, py, spd){
  /* drag anywhere on the canvas to steer - used by the free-swim games */
  if (!Input.ptr.down) return null;
  const dx = Input.ptr.x - px, dy = Input.ptr.y - py, d = Math.hypot(dx,dy);
  if (d < 3) return {x:0,y:0};
  return {x: dx/d, y: dy/d};
}

  start(){
    const g = this.s = {
      x:40, y:80, vy:0, hp:3+State.gear.blubber, maxhp:3+State.gear.blubber, t:0, dist:0,
      spd:1.5, ents:[], fish:0, gold:0, inv:0, dash:0, dashCd:0, over:0, spawn:0, bub:[]
    };
    for (let i=0;i<24;i++) g.bub.push({x:rnd(VW), y:rnd(VH), s:rnd(2,1)|0, v:rnd(.5,.15)});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    g.spd = 1.5 + g.dist/2600;
    g.dist += g.spd;
    const sp = 1.55 + State.gear.speed*0.06 + (g.dash>0?1.6:0);
    let mx = 0, my = 0;
    if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
    if (Input.key('up')) my -= 1; if (Input.key('down')) my += 1;
    const ps = pointerSteer(g.x+12, g.y+7);
    if (ps){ mx = ps.x; my = ps.y; }
    g.x = clamp(g.x + mx*sp, 6, 150); g.y = clamp(g.y + my*sp, 22, 142);
    if (Input.hit('b') && g.dashCd <= 0){ g.dash = 16; g.dashCd = 80; Audio_.sfx('splash'); }
    if (g.dash > 0) g.dash--; if (g.dashCd > 0) g.dashCd--;
    if (g.inv > 0) g.inv--;
    if (State.equipped.trail && g.t%2===0) Particles.spawnTrail(State.equipped.trail, g.x+2, g.y+8, -2, 0);
    /* spawns */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(16, 42 - (g.dist/300|0));
      const r = Math.random();
      if (r < 0.34){ g.ents.push({t:'fish', x:VW+8, y:rnd(136,26), w:8,h:6, a:rnd(6.28)}); }
      else if (r < 0.42){ g.ents.push({t:'gfish', x:VW+8, y:rnd(136,26), w:9,h:7, a:rnd(6.28)}); }
      else if (r < 0.62){ g.ents.push({t:'rock', x:VW+10, y:rnd(120,30), w:16,h:14}); }
      else if (r < 0.82){ const gap = rnd(122,38); g.ents.push({t:'net', x:VW+10, y:gap, w:10, h:0}); }
      else { g.ents.push({t:'orca', x:VW+20, y:rnd(120,30), w:30,h:14, a:rnd(6.28), sp:rnd(1.4,.7)}); }
      if (chance(0.25)) for (let i=0;i<3;i++) g.ents.push({t:'fish', x:VW+8+i*10, y:rnd(130,30), w:8,h:6, a:rnd(6.28)});
    }
    /* entities */
    const pbox = {x:g.x+4, y:g.y+3, w:16, h:9};
    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      e.x -= g.spd + (e.t==='orca'? e.sp : 0);
      if (e.t === 'fish' || e.t === 'gfish') e.y += Math.sin(g.t/18 + e.a)*0.5;
      if (e.t === 'orca') e.y += Math.sin(g.t/26 + e.a)*0.8;
      if (e.x < -40){ g.ents.splice(i,1); continue; }
      const mag = 3 + State.gear.magnet*3;
      if (e.t === 'fish' || e.t === 'gfish'){
        const d = dist(e.x, e.y, g.x+12, g.y+7);
        if (d < 26 + mag){ e.x += (g.x+12-e.x)*0.12; e.y += (g.y+7-e.y)*0.12; }
        if (d < 12){
          g.ents.splice(i,1);
          if (e.t === 'gfish'){ g.gold++; Audio_.sfx('coin'); Particles.burst(e.x,e.y,'#ffd166',6,1.6,'star'); }
          else { g.fish++; Audio_.sfx('fish'); Particles.burst(e.x,e.y,'#9ee5ff',4,1.2,'sq'); }
          continue;
        }
      } else if (g.inv <= 0 && g.dash <= 0){
        let hit = false;
        if (e.t === 'net'){
          hit = (pbox.x < e.x+e.w && pbox.x+pbox.w > e.x) && !(pbox.y > e.y-16 && pbox.y+pbox.h < e.y+16);
        } else hit = aabb(pbox, {x:e.x, y:e.y, w:e.w, h:e.h});
        if (hit){
          g.hp--; g.inv = 70; Audio_.sfx('hurt'); shake();
          Particles.burst(g.x+12, g.y+7, '#ff5c7a', 8, 2, 'sq');
          if (g.hp <= 0){ g.over = 60; Audio_.sfx('fail'); }
        }
      }
    }
    for (const b of g.bub){ b.x -= b.v + g.spd*0.25; b.y -= 0.15; if (b.x < 0){ b.x = VW+4; b.y = rnd(VH); } if (b.y<18) b.y = 150; }
    Particles.update();
  },
  done(){
    const g = this.s;
    const m = Math.floor(g.dist/8);
    const score = m + g.fish*6 + g.gold*25;
    finishGame({score:score, fish: m*0.55 + g.fish*3 + g.gold*14, xp: m/7 + g.fish, rolls: 1 + Math.floor(m/380) + (g.gold>=3?1:0),
      luck: g.gold*0.02, win: m >= 500, title: m>=500?'STRONG SWIM':'RUN COMPLETE',
      note: m + 'M  -  ' + g.fish + ' FISH  -  ' + g.gold + ' GOLDEN'});
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#2a7ac0'); grd.addColorStop(.5,'#12508f'); grd.addColorStop(1,'#07264f');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (let i=0;i<5;i++){ const x = ((i*70 - g.dist*0.5) % 320) - 40; c.fillRect(x, 12, 14, VH); }
    c.fillStyle = '#dff3ff'; c.fillRect(0,12,VW,8); c.fillStyle='#9dc9f0'; c.fillRect(0,20,VW,2);
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (const b of g.bub) c.fillRect(b.x|0, b.y|0, b.s, b.s);
    /* kelp floor */
    c.fillStyle = '#0a2a4a'; c.fillRect(0,152,VW,8);
    for (let i=0;i<14;i++){
      const x = ((i*36 - g.dist*0.9) % 300) - 30;
      c.fillStyle = '#2a6a4a';
      for (let j=0;j<8;j++) c.fillRect(x + Math.sin((g.t/20)+j)*2, 152-j*4, 3, 4);
    }
    for (const e of g.ents){
      const x = e.x|0, y = e.y|0;
      switch(e.t){
        case 'fish': c.fillStyle='#9ee5ff'; c.fillRect(x,y,6,4); c.fillStyle='#4fd6ff'; c.fillRect(x+6,y+1,3,2);
          c.fillStyle='#0d1024'; c.fillRect(x+1,y+1,1,1); break;
        case 'gfish': c.fillStyle='#ffd166'; c.fillRect(x-1,y-1,8,6); c.fillStyle='#e0a05a'; c.fillRect(x+7,y,3,3);
          c.fillStyle='#0d1024'; c.fillRect(x,y,1,1); break;
        case 'rock': c.fillStyle='#4a5470'; c.fillRect(x,y,16,14); c.fillStyle='#6b7590'; c.fillRect(x+2,y+2,12,6);
          c.fillStyle='#39415c'; c.fillRect(x+3,y+9,9,4); break;
        case 'net':
          /* woven mesh with a swim-through gap, floats marking the edges */
          for (let yy=20; yy<VH; yy+=4){
            if (yy > e.y-16 && yy < e.y+16) continue;
            c.fillStyle='#d8d0a8'; c.fillRect(x, yy, 10, 1);
            c.fillStyle='#a89f78';
            for (let k=0;k<10;k+=2) c.fillRect(x + k + ((yy/4|0)%2?1:0), yy+2, 1, 1);
          }
          c.fillStyle='#8a8468'; c.fillRect(x+1, 20, 8, 2);
          c.fillStyle='#e05a5a'; c.fillRect(x, e.y-18, 10, 3); c.fillRect(x, e.y+15, 10, 3);
          c.fillStyle='#ffffff'; c.fillRect(x+1, e.y-17, 3, 1); c.fillRect(x+1, e.y+16, 3, 1);
          break;
        case 'orca':
          c.fillStyle='#141a2e'; c.fillRect(x,y,28,12); c.fillRect(x-4,y+3,6,6); c.fillRect(x+22,y-4,8,5);
          c.fillStyle='#f6fbff'; c.fillRect(x+2,y+7,14,4); c.fillRect(x+3,y+2,4,2);
          c.fillStyle='#f6fbff'; c.fillRect(x-3,y+5,3,2); break;
      }
    }
    Particles.draw(c);
    if (!(g.inv > 0 && (g.t/4|0)%2)){
      const o = playerLook({facing:1, frame:(g.t/6|0)%2, pose:'swim'});
      if (g.dash > 0) o.rot = -0.15;
      drawSeal(c, g.x, g.y, o);
    }
    if (g.dash > 0){ c.fillStyle='rgba(158,229,255,.5)'; for(let i=1;i<4;i++) c.fillRect(g.x-i*6, g.y+4, 4, 6); }
    gameHUD(c, {hp:g.hp, maxhp:g.maxhp, left:'', right:Math.floor(g.dist/8)+'M',
                mid:'FISH '+g.fish+(g.gold?'  GOLD '+g.gold:'')});
    if (g.dashCd > 0){ c.fillStyle='#2a3768'; c.fillRect(VW-42,14,40,3); c.fillStyle='#4fd6ff'; c.fillRect(VW-42,14,40*(1-g.dashCd/80),3); }
    else drawText(c,'B: DASH', VW-46, 14, '#7bffe0', 1, '#0d1024');
    if (g.over) bigMsg(c, 'CAUGHT!', Math.floor(g.dist/8)+' METRES');
  }
});

/* ============================================================
   20. ICE FISHING - tap timing, push your luck
   ============================================================ */
const CATCH_NAMES = [['SPRAT','SMELT','HERRING'],['COD','MACKEREL','POLLOCK'],['SALMON','HALIBUT','CHAR'],
  ['KING CRAB','GIANT SQUID','MOON FISH'],['GOLDEN TUNA','ANCIENT COD','GLASS EEL'],['LEVIATHAN FRY','ABYSS LANTERN','PEARL RAY']];
const CATCH_VAL = [12, 30, 70, 160, 380, 900];
Object.assign(GAMES.ice, {
  start(){
    this.s = {pos:0, dir:1, spd:1.6, zone:26, chain:0, lines:3, score:0, t:0, msg:'', msgT:0,
      caught:[], over:0, best:0, flashT:0, perfectRun:true, legend:false};
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.over){ if (--g.over <= 0) this.done(); return; }
    if (g.msgT > 0) g.msgT--;
    if (g.flashT > 0) g.flashT--;
    g.pos += g.dir * g.spd * (1 + State.gear.grip*-0.02);
    if (g.pos > 100){ g.pos = 100; g.dir = -1; } if (g.pos < 0){ g.pos = 0; g.dir = 1; }
    if (Input.hit('a') || Input.ptr.tapped){
      const d = Math.abs(g.pos - 50);
      const half = g.zone/2;
      if (d <= half*0.34){ this.hook(2); }
      else if (d <= half){ this.hook(1); }
      else this.miss();
    }
    if (Input.hit('b')) this.bank();
  },
  hook(quality){
    const g = this.s;
    g.chain++;
    let tier = clamp(Math.floor((g.chain-1)/2) + (quality===2?1:0), 0, 5);
    if (quality === 2) Audio_.sfx('perfect'); else Audio_.sfx('fish');
    if (quality !== 2) g.perfectRun = false;
    const val = Math.round(CATCH_VAL[tier] * (quality===2?1.5:1));
    g.score += val;
    g.caught.push({tier:tier, val:val});
    if (tier >= 4){ g.legend = true; State.stats.legendaryCatch = Math.max(State.stats.legendaryCatch||0, 1); }
    g.msg = pick(CATCH_NAMES[tier]) + (quality===2?'!!':'!'); g.msgT = 70; g.flashT = 10;
    g.spd = Math.min(5.2, g.spd + 0.32);
    g.zone = Math.max(9, g.zone - 1.7);
    Particles.burst(120, 116, tier>=4?'#ffd166':'#9ee5ff', 8, 2, tier>=4?'star':'ring');
  },
  miss(){
    const g = this.s;
    g.lines--; g.perfectRun = false; Audio_.sfx('fail'); shake();
    g.msg = 'LINE SNAPPED!'; g.msgT = 70;
    if (g.lines <= 0){ g.over = 70; g.msg = 'ALL LINES GONE'; }
    else { g.chain = Math.max(0, g.chain-2); g.spd = Math.max(1.6, g.spd-0.5); g.zone = Math.min(26, g.zone+2.5); }
  },
  bank(){ const g = this.s; if (!g.caught.length){ toast('NOTHING TO BANK YET'); return; } g.over = 45; g.banked = true; Audio_.sfx('good'); },
  done(){
    const g = this.s;
    const keep = g.banked ? 1 : 0.5;
    const score = Math.round(g.score * keep);
    const top = g.caught.reduce((a,c)=>Math.max(a,c.tier), -1);
    if (g.perfectRun && g.caught.length >= 5) State.stats.flawlessIce = (State.stats.flawlessIce||0)+1;
    finishGame({score:score, fish:score*0.55, xp:score/6, rolls: 1 + (top>=2?1:0) + (top>=4?1:0),
      luck: top*0.05, win: g.banked, cleared: g.caught.length>0,
      title: g.banked ? 'CATCH BANKED' : 'LINE LOST',
      note: g.caught.length + ' CATCHES' + (g.legend ? ' - LEGENDARY HOOKED' : '')});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, {a:'#0a1130', b:'#3a5a9a', night:0.8});
    c.fillStyle = '#dff3ff'; c.fillRect(0,60,VW,14);
    c.fillStyle = '#9dc9f0'; c.fillRect(0,74,VW,2);
    const grd = c.createLinearGradient(0,76,0,VH);
    grd.addColorStop(0,'#1a4a8a'); grd.addColorStop(1,'#04122c');
    c.fillStyle = grd; c.fillRect(0,76,VW,VH-76);
    c.fillStyle = '#04122c'; c.fillRect(104,60,32,16);
    c.fillStyle = '#0e3566'; c.fillRect(106,60,28,14);
    /* rod + line */
    c.fillStyle = '#8a5a34'; c.fillRect(84,44,2,18);
    c.fillStyle = '#c9c2a0';
    const hookY = 92 + Math.sin(g.t/30)*4;
    c.fillRect(119, 62, 1, hookY-62);
    c.fillStyle = '#cdd8e8'; c.fillRect(117, hookY, 4, 3);
    /* fish shadows */
    for (let i=0;i<7;i++){
      const x = (i*44 + g.t*(0.4+i*0.12)) % (VW+40) - 20;
      const y = 100 + (i%4)*13;
      c.fillStyle = 'rgba(158,229,255,.22)';
      c.fillRect(x, y, 9, 4); c.fillRect(x+9, y+1, 3, 2);
    }
    /* seal at the hole */
    drawSeal(c, 62, 46, playerLook({facing:1, frame:(g.t/26|0)%2}));
    /* caught stack */
    for (let i=0;i<g.caught.length && i<12;i++){
      const cc = g.caught[i];
      c.fillStyle = RARITY[Math.min(cc.tier,5)].c;
      c.fillRect(4 + i*7, 84, 5, 5);
    }
    /* timing bar */
    const bx = 24, bw = VW-48, by = 130;
    c.fillStyle = '#0d1024'; c.fillRect(bx-2, by-2, bw+4, 16);
    c.fillStyle = '#3a2a44'; c.fillRect(bx, by, bw, 12);
    const zw = bw * g.zone/100;
    c.fillStyle = '#2a7a48'; c.fillRect(bx + bw/2 - zw/2, by, zw, 12);
    c.fillStyle = '#5be584'; c.fillRect(bx + bw/2 - zw*0.17, by, zw*0.34, 12);
    const mx = bx + bw * g.pos/100;
    c.fillStyle = g.flashT>0 ? '#ffffff' : '#ffd166'; c.fillRect(mx-1, by-3, 3, 18);
    gameHUD(c, {left:'LINES ' + '|'.repeat(Math.max(0,g.lines)), right:fmt(g.score), mid:'CHAIN '+g.chain,
                leftCol:'#ff9ecb'});
    drawTextC(c, 'A: HOOK    B: BANK AND LEAVE', VW/2, 148, '#8fa3d6', 1);
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 108, g.msg.indexOf('SNAP')>=0 ? '#ff5c7a' : '#ffd166', 1, '#0d1024');
    drawTextC(c, 'DEEPER = RARER. BANK BEFORE THE LINE SNAPS.', VW/2, 120, '#6f86b8', 1);
    Particles.draw(c);
    if (g.over) bigMsg(c, g.banked ? 'BANKED' : 'LOST HALF', fmt(g.score) + ' VALUE');
  }
});

/* ============================================================
   21. FLOE SURVIVAL - wave arena, auto-attack
   ============================================================ */
Object.assign(GAMES.floe, {
  start(){
    this.s = {x:120, y:88, facing:1, hp:3+State.gear.blubber, maxhp:3+State.gear.blubber, inv:0,
      wave:0, ents:[], t:0, atk:0, atkCd:0, kills:0, spawnT:60, waveT:0, boss:null, over:0,
      cleanWave:true, cleanStreak:0, msg:'', msgT:0, score:0};
    this.nextWave();
  },
  nextWave(){
    const g = this.s;
    g.wave++;
    if (g.wave > 1 && g.cleanWave){ g.cleanStreak++; State.stats.noHitWaves = Math.max(State.stats.noHitWaves||0, g.cleanStreak); }
    else if (g.wave > 1) g.cleanStreak = 0;
    g.cleanWave = true;
    g.msg = 'WAVE ' + g.wave; g.msgT = 70;
    const isBoss = g.wave % 10 === 0;
    const n = isBoss ? 3 : Math.min(14, 2 + g.wave);
    for (let i=0;i<n;i++) this.spawn(g.wave < 4 ? 'crab' : chance(0.4) ? 'gull' : 'crab');
    if (isBoss){
      const a = rnd(6.28);
      g.boss = {t:'boss', x:120+Math.cos(a)*80, y:88+Math.sin(a)*70, hp:24 + g.wave*4, max:24+g.wave*4,
                w:30, h:16, sp:0.42, hit:0};
      g.ents.push(g.boss);
      Audio_.play('boss'); g.msg = 'ORCA!'; g.msgT = 90;
    } else if (g.wave % 10 === 1 && g.wave > 1) Audio_.play('action');
  },
  spawn(type){
    const g = this.s, a = rnd(6.28);
    const x = 120 + Math.cos(a)*100, y = 88 + Math.sin(a)*86;
    if (type === 'gull') g.ents.push({t:'gull', x:x, y:y, hp:1, w:12,h:9, sp:0.85+g.wave*0.02, hit:0, dive:0});
    else g.ents.push({t:'crab', x:x, y:y, hp:2, w:12,h:9, sp:0.42+g.wave*0.015, hit:0});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    const sp = 1.15 + State.gear.speed*0.05;
    let mx=0,my=0;
    if (Input.key('left')) mx-=1; if (Input.key('right')) mx+=1;
    if (Input.key('up')) my-=1; if (Input.key('down')) my+=1;
    const ps = pointerSteer(g.x+12, g.y+7); if (ps){ mx=ps.x; my=ps.y; }
    if (mx) g.facing = mx > 0 ? 1 : -1;
    let nx = g.x + mx*sp, ny = g.y + my*sp;
    /* stay on the floe (ellipse) */
    const dx = (nx+12-120)/78, dy = (ny+7-88)/62;
    if (dx*dx + dy*dy <= 1){ g.x = nx; g.y = ny; }
    else { const m = Math.hypot(dx,dy); g.x = 120 + dx/m*78 - 12; g.y = 88 + dy/m*62 - 7; }
    if (State.equipped.trail && g.t%4===0 && (mx||my)) Particles.spawnTrail(State.equipped.trail, g.x+12, g.y+10, -mx, -my);
    if (g.inv>0) g.inv--;
    /* auto attack */
    if (g.atkCd > 0) g.atkCd--;
    if (g.atk > 0) g.atk--;
    if (g.atkCd <= 0){
      let target = null, bd = 30;
      for (const e of g.ents){ const d = dist(e.x+e.w/2, e.y+e.h/2, g.x+12, g.y+7); if (d < bd){ bd = d; target = e; } }
      if (target){
        g.atk = 12; g.atkCd = 34 - Math.min(12, g.wave); Audio_.sfx('swat');
        g.facing = (target.x+target.w/2) > (g.x+12) ? 1 : -1;
        for (const e of g.ents){
          if (dist(e.x+e.w/2, e.y+e.h/2, g.x+12 + g.facing*10, g.y+7) < 22){
            e.hp -= 1 + (State.gear.grip*0.2); e.hit = 8;
            Particles.burst(e.x+e.w/2, e.y+e.h/2, '#ffffff', 3, 1.4, 'plus');
          }
        }
      }
    }
    /* enemies */
    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      if (e.hit>0) e.hit--;
      const ang = Math.atan2(g.y+7-e.y-e.h/2, g.x+12-e.x-e.w/2);
      if (e.t === 'gull'){
        e.dive = (e.dive||0) + 1;
        const s = e.sp * (e.dive%120 < 40 ? 1.9 : 0.7);
        e.x += Math.cos(ang)*s; e.y += Math.sin(ang)*s + Math.sin(g.t/9+i)*0.3;
      } else {
        e.x += Math.cos(ang)*e.sp; e.y += Math.sin(ang)*e.sp;
      }
      if (e.hp <= 0){
        g.ents.splice(i,1); g.kills++; g.score += e.t==='boss'?500:e.t==='gull'?18:12;
        Particles.burst(e.x+e.w/2, e.y+e.h/2, e.t==='boss'?'#ffd166':'#ff9ecb', e.t==='boss'?18:6, 2, 'sq');
        Audio_.sfx(e.t==='boss'?'legend':'hit');
        if (e.t === 'boss'){ g.boss = null; Audio_.play('action'); addFishPop(g, 'BOSS DOWN'); }
        continue;
      }
      if (g.inv <= 0 && aabb({x:g.x+4,y:g.y+3,w:16,h:9}, {x:e.x,y:e.y,w:e.w,h:e.h})){
        g.hp--; g.inv = 66; g.cleanWave = false; g.cleanStreak = 0;
        Audio_.sfx('hurt'); shake();

  done(){

    c.fillStyle = '#e6f4ff';
    for (let y=-59;y<=57;y++){ const w = Math.sqrt(Math.max(0,1-(y/58)*(y/58)))*74; c.fillRect(120-w, 88+y, w*2, 1); }
    c.fillStyle = '#cfe9ff';
    for (let i=0;i<10;i++){ const a = i*2.1; c.fillRect(120+Math.cos(a)*50, 88+Math.sin(a)*40, 4, 2); }
    /* entities */

      } else if (e.t === 'gull'){
        const fl = (g.t/6|0)%2;

        c.fillStyle = f?'#ffffff':'#e6eef7'; c.fillRect(x-2,y+(fl?1:5),5,2); c.fillRect(x+9,y+(fl?1:5),5,2);
        c.fillStyle='#ffd166'; c.fillRect(x+10,y+4,3,2);
        c.fillStyle='#0d1024'; c.fillRect(x+7,y+4,1,1);

        c.fillStyle = f?'#ffffff':'#f6fbff'; c.fillRect(x+3,y+8,16,5); c.fillRect(x+4,y+2,5,2);

/* ============================================================
   22. PEARL MATCH - match-3 bonus room
   ============================================================ */
const GEM_COL = [['#ff5c7a','#a02c46'],['#4fd6ff','#1b6a9a'],['#5be584','#2a7a48'],['#ffd166','#b07a1a'],['#b06bff','#6a3a9a']];
Object.assign(GAMES.pearl, {
  start(){
    const g = this.s = {grid:[], cx:2, cy:2, sel:null, moves:16, score:0, pearls:0, t:0, state:'idle',
                        anim:0, fall:[], over:0, combo:0, msg:'', msgT:0};
    for (let y=0;y<6;y++){ g.grid[y] = []; for (let x=0;x<6;x++) g.grid[y][x] = this.newGem(x,y); }
    let guard = 0;
    while (this.findMatches().length && guard++ < 60){
      this.findMatches().forEach(m=>{ g.grid[m.y][m.x] = this.newGem(m.x,m.y); });
    }
  },
  newGem(){ return chance(0.055) ? 5 : rndi(5); },
  at(x,y){ const g = this.s; return (x<0||y<0||x>5||y>5) ? -1 : g.grid[y][x]; },
  findMatches(){
    const g = this.s, out = [], seen = {};
    for (let y=0;y<6;y++) for (let x=0;x<6;x++){
      const v = g.grid[y][x]; if (v < 0) continue;
      let n = 1; while (this.at(x+n,y) === v) n++;
      if (n >= 3) for (let i=0;i<n;i++){ const k = (x+i)+','+y; if (!seen[k]){ seen[k]=1; out.push({x:x+i,y:y}); } }
      n = 1; while (this.at(x,y+n) === v) n++;
      if (n >= 3) for (let i=0;i<n;i++){ const k = x+','+(y+i); if (!seen[k]){ seen[k]=1; out.push({x:x,y:y+i}); } }
    }
    return out;
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.state === 'resolve'){
      g.anim--;
      if (g.anim <= 0){
        const m = this.findMatches();
        if (m.length){
          g.combo++;
          let pearls = 0;
          m.forEach(p=>{ if (g.grid[p.y][p.x] === 5) pearls++; });
          g.pearls += pearls;
          g.score += m.length * 12 * g.combo + pearls * 60;
          m.forEach(p=>{
            Particles.burst(66 + p.x*18 + 8, 34 + p.y*18 + 8, g.grid[p.y][p.x]===5?'#f2e9ff':GEM_COL[g.grid[p.y][p.x]][0], 5, 1.6, 'sq');
            g.grid[p.y][p.x] = -1;
          });
          Audio_.sfx(pearls ? 'perfect' : g.combo > 1 ? 'good' : 'coin');
          if (g.combo > 1){ g.msg = 'COMBO x' + g.combo; g.msgT = 60; }
          /* gravity */
          for (let x=0;x<6;x++){
            let write = 5;
            for (let y=5;y>=0;y--) if (g.grid[y][x] >= 0){ g.grid[write][x] = g.grid[y][x]; if (write!==y) g.grid[y][x] = -1; write--; }
            for (let y=write;y>=0;y--) g.grid[y][x] = this.newGem();
          }
          g.anim = 12;
        } else { g.state = 'idle'; g.combo = 0; if (g.moves <= 0) g.over = 50; }
      }
      Particles.update(); return;
    }
    /* cursor */
    if (Input.hit('left')) g.cx = clamp(g.cx-1,0,5);
    if (Input.hit('right')) g.cx = clamp(g.cx+1,0,5);
    if (Input.hit('up')) g.cy = clamp(g.cy-1,0,5);
    if (Input.hit('down')) g.cy = clamp(g.cy+1,0,5);
    if (Input.ptr.tapped){
      const gx = Math.floor((Input.ptr.x - 66)/18), gy = Math.floor((Input.ptr.y - 34)/18);
      if (gx>=0&&gx<6&&gy>=0&&gy<6){
        if (g.sel && (Math.abs(g.sel.x-gx)+Math.abs(g.sel.y-gy)) === 1) this.trySwap(g.sel, {x:gx,y:gy});
        else { g.sel = {x:gx,y:gy}; g.cx=gx; g.cy=gy; Audio_.sfx('blip'); }
      }
    }
    if (Input.hit('a')){
      if (g.sel && (Math.abs(g.sel.x-g.cx)+Math.abs(g.sel.y-g.cy)) === 1) this.trySwap(g.sel, {x:g.cx,y:g.cy});
      else if (g.sel && g.sel.x===g.cx && g.sel.y===g.cy) g.sel = null;
      else { g.sel = {x:g.cx, y:g.cy}; Audio_.sfx('blip'); }
    }
    if (Input.hit('b')) g.sel = null;
    Particles.update();
  },
  trySwap(a, b){
    const g = this.s;
    const t = g.grid[a.y][a.x]; g.grid[a.y][a.x] = g.grid[b.y][b.x]; g.grid[b.y][b.x] = t;
    if (!this.findMatches().length){
      const t2 = g.grid[a.y][a.x]; g.grid[a.y][a.x] = g.grid[b.y][b.x]; g.grid[b.y][b.x] = t2;
      Audio_.sfx('back'); g.msg = 'NO MATCH'; g.msgT = 40;
    } else {
      g.moves--; g.state = 'resolve'; g.anim = 8; g.combo = 0; Audio_.sfx('select');
    }
    g.sel = null;
  },
  done(){
    const g = this.s;
    finishGame({score:g.score, fish:g.score*0.32, xp:g.score/12,
      rolls: 1 + Math.floor(g.pearls/2) + Math.floor(g.score/1600), luck: g.pearls*0.05,
      win:true, title:'BONUS ROOM CLEARED', note: g.pearls + ' PEARL GEMS - ' + fmt(g.score) + ' PTS'});
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#1b2a5e'); grd.addColorStop(1,'#07173a');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    for (let i=0;i<20;i++){ c.fillStyle = 'rgba(158,229,255,.10)';
      c.fillRect((i*37 + g.t*0.2)%VW, (i*29 + Math.sin(g.t/40+i)*8)%VH, 2, 2); }
    c.fillStyle = 'rgba(9,12,30,.6)'; c.fillRect(62,30,116,116);
    for (let y=0;y<6;y++) for (let x=0;x<6;x++){
      const v = g.grid[y][x]; if (v < 0) continue;
      const px = 66 + x*18, py = 34 + y*18;
      if (v === 5){
        c.fillStyle = '#f2e9ff'; c.fillRect(px+2,py+2,12,12);
        c.fillStyle = '#cdd8e8'; c.fillRect(px+2,py+9,12,5);
        c.fillStyle = '#ffffff'; c.fillRect(px+4,py+4,4,3);
      } else {
        c.fillStyle = GEM_COL[v][1]; c.fillRect(px+1,py+1,14,14);
        c.fillStyle = GEM_COL[v][0]; c.fillRect(px+2,py+2,12,12);
        c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(px+3,py+3,4,2);
        /* shape coding for colour-blind play */
        c.fillStyle = 'rgba(13,16,36,.65)';
        if (v===0) c.fillRect(px+6,py+6,4,4);
        if (v===1){ c.fillRect(px+5,py+7,6,2); c.fillRect(px+7,py+5,2,6); }
        if (v===2){ c.fillRect(px+5,py+9,6,2); c.fillRect(px+7,py+5,2,2); }
        if (v===3){ c.fillRect(px+4,py+7,8,2); }
        if (v===4){ c.fillRect(px+7,py+4,2,8); }
      }
    }
    if (g.sel){ c.strokeStyle = '#ffd166'; c.lineWidth = 1; c.strokeRect(66.5+g.sel.x*18, 34.5+g.sel.y*18, 15, 15); }
    const cx = 66 + g.cx*18, cy = 34 + g.cy*18;
    c.strokeStyle = (g.t/8|0)%2 ? '#ffffff' : '#4fd6ff'; c.lineWidth = 1;
    c.strokeRect(cx-0.5, cy-0.5, 17, 17);
    /* side seal */
    drawSeal(c, 18, 100, playerLook({facing:1, frame:(g.t/20|0)%2}));
    Particles.draw(c);
    gameHUD(c, {left:'MOVES '+g.moves, right:fmt(g.score), mid:'PEARLS '+g.pearls, leftCol: g.moves<=3?'#ff5c7a':'#ffffff'});
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 22, '#ffd166', 1, '#0d1024');
    drawTextC(c, 'MATCH 3 - PEARL GEMS ADD LOOT ROLLS', VW/2, 150, '#6f86b8', 1);
    if (g.over) bigMsg(c, 'ROOM CLEAR', fmt(g.score) + ' PTS');
  }
});

/* ============================================================
   23. BELLY SLIDE RACE - rhythm slide
   ============================================================ */
Object.assign(GAMES.slide, {
  start(){
    const g = this.s = {wx:0, y:70, vy:0, spd:2.2, t:0, air:false, spin:0, spinT:0, combo:0, tricks:0,
      score:0, time:60*60, stumble:0, segs:[], msg:'', msgT:0, over:0, best:0, land:0};
    g.segs.push({x:0, w:200, type:'slope', y0:70, y1:76});
    for (let i=0;i<40;i++) this.addSeg();
  },
  addSeg(){
    const g = this.s, last = g.segs[g.segs.length-1];
    const x = last.x + last.w, y0 = last.y1;
    const r = Math.random();
    if (r < 0.20 && g.wx > 200) g.segs.push({x:x, w:26+rnd(24), type:'gap', y0:y0, y1:y0+rnd(6,-2)});
    else if (r < 0.42 && g.wx > 120) g.segs.push({x:x, w:34, type:'ramp', y0:y0, y1:y0-12});
    else g.segs.push({x:x, w:56+rnd(60), type:'slope', y0:y0, y1:clamp(y0 + rnd(14,-4), 46, 120)});
  },
  groundAt(wx){
    const g = this.s;
    for (const s of g.segs){
      if (wx >= s.x && wx < s.x + s.w){
        if (s.type === 'gap') return null;
        const t = (wx - s.x)/s.w;
        return lerp(s.y0, s.y1, t);
      }
    }
    return 90;
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; g.time--;
    if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.time <= 0){ g.over = 60; g.msg='FINISH!'; g.msgT=60; Audio_.sfx('good'); }
    while (g.segs.length && g.segs[0].x + g.segs[0].w < g.wx - 80) g.segs.shift();
    while (g.segs[g.segs.length-1].x < g.wx + 400) this.addSeg();
    const px = g.wx + 60;
    const gy = this.groundAt(px);
    g.spd = clamp(g.spd + (g.stumble>0 ? -0.05 : 0.006), 1.1, 5.2) + (Input.key('right')?0.006:0) - (Input.key('left')?0.02:0);
    if (g.stumble > 0) g.stumble--;
    g.wx += g.spd;
    g.score += g.spd*0.4;
    /* physics */
    g.vy += 0.34;
    g.y += g.vy;
    if (gy == null){
      g.air = true;
      if (g.y > 150){ g.y = 150; g.vy = 0; g.stumble = 40; g.spd = 1.4; g.combo = 0;
        if (!g.fell){ Audio_.sfx('fail'); shake(); g.msg='SPLASH!'; g.msgT=45; g.fell = 12; } }
    } else {
      g.fell = 0;
      if (g.y >= gy - 8){
        if (g.air){
          /* landing */
          if (g.spinT > 0){ g.stumble = 45; g.spd = Math.max(1.3, g.spd*0.55); g.combo = 0; g.spinT = 0; g.spin = 0;
            Audio_.sfx('hurt'); shake(); g.msg = 'WIPEOUT'; g.msgT = 45; }
          else { g.land = 8; if (g.tricksThisAir){ g.combo++; const pts = 60*g.combo; g.score += pts;
            g.msg = 'TRICK +' + pts + (g.combo>1?'  x'+g.combo:''); g.msgT = 50; Audio_.sfx('perfect');
            Particles.burst(72, g.y, '#ffd166', 8, 2, 'star'); g.tricks++; } else Audio_.sfx('dig'); }
          g.tricksThisAir = 0;
        }
        g.air = false; g.y = gy - 8; g.vy = 0;
        if (g.t % 3 === 0) Particles.burst(58, g.y+9, '#ffffff', 1, 0.6, 'sq');
        if (State.equipped.trail && g.t%3===0) Particles.spawnTrail(State.equipped.trail, 60, g.y+8, -2, 0);
      } else g.air = true;
    }
    /* ramp launch */
    const seg = g.segs.find(s=> px >= s.x && px < s.x+s.w);
    if (seg && seg.type === 'ramp' && !g.air && px > seg.x + seg.w - 6){
      g.vy = -5.4 - g.spd*0.3; g.air = true; Audio_.sfx('jump');
    }
    if (Input.hit('a') && !g.air && g.stumble <= 0){ g.vy = -4.6; g.air = true; Audio_.sfx('jump'); }
    if ((Input.hit('b') || Input.ptr.tapped) && g.air && g.spinT <= 0){ g.spinT = 26; g.tricksThisAir = 1; }
    if (g.spinT > 0){ g.spinT--; g.spin += Math.PI*2/26; if (g.spinT === 0) g.spin = 0; }
    if (g.land > 0) g.land--;
    Particles.update();
  },
  done(){
    const g = this.s;
    const m = Math.floor(g.wx/10);
    finishGame({score:Math.round(g.score), fish: g.score*0.3, xp: g.score/10,
      rolls: 1 + Math.floor(g.tricks/4) + (m>600?1:0), luck: g.tricks*0.01, win: g.time<=0,
      title: g.time<=0 ? 'RACE FINISHED' : 'RUN ENDED',
      note: m + 'M  -  ' + g.tricks + ' TRICKS'});
  },
  draw(c){
    const g = this.s, cam = g.wx;
    drawSky(c, g.t, {a:'#123a72', b:'#9ed6ff', night:0});
    drawMountains(c, cam*0.6, {night:0});
    /* slope */
    for (const s of g.segs){
      const sx = s.x - cam, ex = sx + s.w;
      if (ex < -20 || sx > VW+20) continue;
      if (s.type === 'gap'){
        c.fillStyle = '#1a4a8a'; c.fillRect(Math.max(0,sx), s.y0, Math.min(VW,ex)-Math.max(0,sx), VH);
        c.fillStyle = 'rgba(255,255,255,.25)';
        for (let x=Math.max(0,sx); x<Math.min(VW,ex); x+=6) c.fillRect(x, s.y0+4+Math.sin(g.t/9+x)*2, 4, 1);
        continue;
      }
      for (let x=Math.max(0,sx|0); x<Math.min(VW,ex|0); x++){
        const t = (x - sx)/s.w, y = lerp(s.y0, s.y1, t)|0;
        c.fillStyle = '#f6fbff'; c.fillRect(x, y, 1, 5);
        c.fillStyle = '#dbecfb'; c.fillRect(x, y+5, 1, 14);
        c.fillStyle = '#b9d6ef'; c.fillRect(x, y+19, 1, 18);
        c.fillStyle = '#9dc9f0'; c.fillRect(x, y+37, 1, VH-y);
        const wx = (x + (cam|0));
        if (wx % 19 === 0){ c.fillStyle = '#a8cbe8'; c.fillRect(x, y+7, 1, 6); }
        if (wx % 31 === 0){ c.fillStyle = '#8fb8d8'; c.fillRect(x, y+24, 1, 9); }
        if (wx % 47 === 0){ c.fillStyle = '#7fa8cc'; c.fillRect(x, y+44, 1, 12); }
      }
      if (s.type === 'ramp'){ c.fillStyle = '#7bffe0'; c.fillRect(Math.max(0,ex-6), s.y1, 6, 2); }
    }
    Particles.draw(c);
    const o = playerLook({facing:1, frame:(g.t/5|0)%2, pose:'slide'});
    if (g.spinT > 0) o.rot = g.spin;
    if (g.stumble > 0) o.rot = Math.sin(g.t)*0.3;
    drawSeal(c, 60, g.y, o);
    if (g.land > 0){ c.fillStyle='rgba(255,255,255,.7)'; c.fillRect(52, g.y+13, 24, 2); }
    gameHUD(c, {left:Math.floor(g.wx/10)+'M', right:fmt(Math.round(g.score)), mid:Math.ceil(g.time/60)+'S',
                midCol: g.time < 600 ? '#ff5c7a' : '#7bffe0'});
    c.fillStyle='#2a3768'; c.fillRect(3,13,50,3);
    c.fillStyle='#4fd6ff'; c.fillRect(3,13,50*clamp(g.spd/5.2,0,1),3);
    if (g.combo > 1) drawText(c, 'COMBO x'+g.combo, 3, 19, '#ffd166', 1, '#0d1024');
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 34, '#ffffff', 1, '#0d1024');
    if (g.air && g.spinT<=0) drawTextC(c, 'B: TRICK', VW/2, 148, '#7bffe0', 1, '#0d1024');
    if (g.over) bigMsg(c, 'FINISH', Math.floor(g.wx/10)+'M  '+g.tricks+' TRICKS');
  }
});

  {k:'clam',  n:'CLAM',        v:55,  w:34, col:'#e8cf9a'},

];
Object.assign(GAMES.dig, {
  start(){
    this.s = {x:110, t:0, time:50*60, score:0, digs:0, finds:{}, state:'walk', bar:0, dir:1,
      zone:30, msg:'DIG WHERE THE SAND BUBBLES', msgT:90, over:0, spots:[], reveal:null, revealT:0, pearls:0};
    for (let i=0;i<7;i++) this.s.spots.push({x: 16 + i*30 + rnd(10), used:0, wob:rnd(6.28)});
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--; if (g.revealT>0) g.revealT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.state === 'walk'){
      g.time--;
      if (g.time <= 0){ g.over = 50; Audio_.sfx('good'); }
      const sp = 1.3 + State.gear.speed*0.05;
      let mx = 0;
      if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
      if (Input.ptr.down){ const d = Input.ptr.x - (g.x+12); if (Math.abs(d) > 6) mx = d>0?1:-1; }
      g.x = clamp(g.x + mx*sp, 4, VW-28);
      if (mx) g.face = mx;
      const near = g.spots.find(s=> !s.used && Math.abs(s.x - (g.x+12)) < 14);
      if (Input.hit('a') && near){ g.state = 'dig'; g.target = near; g.bar = 0; g.dir = 1;
        g.zone = clamp(34 - g.digs*1.6 + State.gear.grip*2, 12, 34); Audio_.sfx('blip'); }
    } else {
      g.bar += g.dir * (2.4 + g.digs*0.18);
      if (g.bar > 100){ g.bar = 100; g.dir = -1; }
      if (g.bar < 0){ g.bar = 0; g.dir = 1; }
      if (Input.hit('a') || Input.ptr.tapped){
        const d = Math.abs(g.bar - 50), half = g.zone/2;
        g.state = 'walk'; g.digs++; g.target.used = 1;
        Audio_.sfx('dig');
        Particles.burst(g.target.x, 120, '#e8cf9a', 8, 1.8, 'sq');
        if (d > half){ g.msg = 'MISSED - SAND COLLAPSED'; g.msgT = 60; g.score -= 10; }
        else {
          const perfect = d <= half*0.3;
          const item = this.roll(perfect);
          g.finds[item.k] = (g.finds[item.k]||0) + 1;
          g.score += item.v * (perfect?1.5:1);
          g.reveal = item; g.revealT = 70;
          g.msg = item.n + (perfect ? ' (PERFECT DIG)' : '');
          g.msgT = 70;
          if (item.k === 'crab'){ Audio_.sfx('hurt'); shake(); g.time -= 180; }
          else if (item.k === 'pearl' || item.k === 'chest'){ Audio_.sfx('perfect'); g.pearls++; }
          else Audio_.sfx('coin');
        }
        /* refresh spots */
        if (g.spots.filter(s=>!s.used).length < 3)
          for (let i=0;i<3;i++) g.spots.push({x: 12 + rnd(VW-40), used:0, wob:rnd(6.28)});
      }
    }
    Particles.update();
  },
  roll(perfect){
    const tab = DIG_TABLE.map(d=> Object.assign({}, d));
    if (perfect){ tab[2].w = 4; tab[3].w += 10; tab[5].w += 5; }
    const tot = tab.reduce((a,d)=>a+d.w,0);
    let r = Math.random()*tot;
    for (const d of tab){ r -= d.w; if (r <= 0) return d; }
    return tab[0];
  },
  done(){
    const g = this.s;
    const sc = Math.max(0, Math.round(g.score));
    finishGame({score:sc, fish:sc*0.55, xp:sc/7, rolls: 1 + g.pearls + Math.floor(sc/700),
      luck:g.pearls*0.06, win:true, title:'BEACH SWEPT',
      note: g.digs + ' DIGS - ' + (g.finds.clam||0) + ' CLAMS' + (g.pearls?' - '+g.pearls+' RARE':'')});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, skyPalette());
    drawSeaBand(c, 84, 26, g.t, '#2a6ab5');
    c.fillStyle = '#e8cf9a'; c.fillRect(0,106,VW,VH-106);
    c.fillStyle = '#d9be8e'; c.fillRect(0,106,VW,3);
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (let x=0;x<VW;x+=8) c.fillRect(x, 104 + Math.sin(g.t/20+x/9)*2, 6, 2);
    for (let i=0;i<24;i++){ c.fillStyle='#c9a86a'; c.fillRect((i*29+13)%VW, 118 + (i%6)*7, 2, 1); }
    /* dig spots */
    for (const s of g.spots){
      if (s.used) { c.fillStyle = '#b08f5a'; c.fillRect(s.x-6, 124, 12, 4); continue; }
      const b = Math.sin(g.t/14 + s.wob) > 0 ? 1 : 0;
      c.fillStyle = '#c9a86a'; c.fillRect(s.x-5, 124, 10, 4);
      c.fillStyle = '#8a7048'; c.fillRect(s.x-3+b, 122, 2, 2); c.fillRect(s.x+2-b, 125, 2, 2);
    }
    Particles.draw(c);
    drawSeal(c, g.x, 112, playerLook({facing:g.face||1, frame:(g.t/10|0)%2, pose: g.state==='dig'?'swim':'idle'}));
    if (g.state === 'dig'){
      const bx = 30, bw = VW-60, by = 60;
      c.fillStyle = '#0d1024'; c.fillRect(bx-2,by-2,bw+4,16);
      c.fillStyle = '#5a4a3a'; c.fillRect(bx,by,bw,12);
      const zw = bw*g.zone/100;
      c.fillStyle = '#2a7a48'; c.fillRect(bx+bw/2-zw/2, by, zw, 12);
      c.fillStyle = '#5be584'; c.fillRect(bx+bw/2-zw*0.15, by, zw*0.3, 12);
      c.fillStyle = '#ffd166'; c.fillRect(bx + bw*g.bar/100 - 1, by-3, 3, 18);
      drawTextC(c, 'A TO DIG', VW/2, 46, '#ffffff', 1, '#0d1024');
    }
    if (g.revealT > 0 && g.reveal){
      const it = g.reveal;
      c.fillStyle = it.col; c.fillRect(VW/2-8, 78, 16, 12);
      c.fillStyle = '#0d1024'; c.fillRect(VW/2-6, 84, 12, 2);
      if (it.k === 'crab'){ c.fillStyle='#0d1024'; c.fillRect(VW/2-5,81,2,2); c.fillRect(VW/2+3,81,2,2); }
    }
    gameHUD(c, {left:'DIGS '+g.digs, right:fmt(Math.max(0,Math.round(g.score))), mid:Math.ceil(g.time/60)+'S',
                midCol: g.time<600?'#ff5c7a':'#7bffe0'});
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 96, g.msg.indexOf('CRAB')>=0?'#ff5c7a':'#ffffff', 1, '#0d1024');
    if (g.over) bigMsg(c, 'TIDE IN', fmt(Math.max(0,Math.round(g.score))) + ' VALUE');
  }
});

/* ============================================================
   25. SYNCHRONIZED SWIM - rhythm routine
   ============================================================ */
const SYNC_DIRS = ['up','down','left','right'];
Object.assign(GAMES.sync, {
  start(){
    const g = this.s = {notes:[], t:0, idx:0, combo:0, best:0, perfect:0, good:0, miss:0, score:0,
      judge:'', judgeT:0, over:0, hitFx:0, lead:0};
    const r = mulberry32(hashStr('sync'+dayIndex()+State.stats.plays.sync));
    let tt = 90;
    for (let i=0;i<44;i++){
      g.notes.push({d:(r()*4)|0, t:tt, hit:0});
      tt += (r() < 0.25) ? 16 : (r() < 0.5 ? 24 : 32);
    }
    g.endT = tt + 120;
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++;
    if (g.judgeT>0) g.judgeT--;
    if (g.hitFx>0) g.hitFx--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.t > g.endT){ g.over = 70; Audio_.sfx('perfect'); }
    /* missed notes */
    for (const n of g.notes){
      if (!n.hit && g.t > n.t + 12){ n.hit = -1; g.miss++; g.combo = 0; g.judge='MISS'; g.judgeT=26; Audio_.sfx('fail'); }
    }
    let pressed = null;
    SYNC_DIRS.forEach(d=>{ if (Input.hit(d)) pressed = d; });
    if (Input.ptr.tapped){
      /* touch: tap the lane you want to hit */
      const lane = Math.floor((Input.ptr.y - 42) / 24);
      if (lane >= 0 && lane < 4) pressed = SYNC_DIRS[lane];
    }
    if (pressed){
      const di = SYNC_DIRS.indexOf(pressed);
      let bestN = null, bd = 999;
      for (const n of g.notes){ if (n.hit) continue; const d = Math.abs(n.t - g.t); if (d < bd){ bd = d; bestN = n; } }
      if (bestN && bd <= 12){
        if (bestN.d === di){
          const perfect = bd <= 4;
          bestN.hit = 1; g.combo++; g.best = Math.max(g.best, g.combo);
          if (perfect){ g.perfect++; g.score += 100 + g.combo*4; g.judge='PERFECT'; Audio_.sfx('perfect'); }
          else { g.good++; g.score += 55 + g.combo*2; g.judge='GOOD'; Audio_.sfx('good'); }
          g.judgeT = 26; g.hitFx = 8;
          Particles.burst(44, 50 + di*24, perfect?'#ffd166':'#7bffe0', 5, 1.6, perfect?'star':'plus');
        } else { bestN.hit = -1; g.miss++; g.combo = 0; g.judge='WRONG WAY'; g.judgeT=26; Audio_.sfx('fail'); }
      }
    }
    Particles.update();
  },
  done(){
    const g = this.s;
    const total = g.perfect + g.good + g.miss || 1;
    const acc = (g.perfect + g.good*0.6)/total;
    const grade = acc > 0.95 ? 'S' : acc > 0.85 ? 'A' : acc > 0.7 ? 'B' : acc > 0.5 ? 'C' : 'D';
    finishGame({score:g.score, fish:g.score*0.24, xp:g.score/14,
      rolls: 1 + (acc>0.7?1:0) + (acc>0.92?1:0), luck: acc*0.1, win: acc > 0.7,
      title:'ROUTINE GRADE ' + grade,
      note: g.perfect+' PERFECT  '+g.good+' GOOD  '+g.miss+' MISS  -  x'+g.best});
  },
  draw(c){
    const g = this.s;
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0,'#1b3a7a'); grd.addColorStop(1,'#0a1d44');
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    for (let i=0;i<3;i++){
      c.fillStyle = 'rgba(158,229,255,.10)';
      for (let x=0;x<VW;x+=4) c.fillRect(x, 20+i*46 + Math.sin(x/18 + g.t/16 + i)*5, 4, 8);
    }
    /* background chorus of seals swimming in formation */
    for (let i=0;i<4;i++){
      const x = 150 + Math.sin(g.t/30 + i*1.2)*30, y = 24 + i*30;
      drawSeal(c, x, y, {cos:{fur:['fur_harborgrey','fur_foamwhite','fur_slate','fur_pebblepup'][i]},
                         facing:-1, frame:(g.t/8|0)%2, pose:'swim', alpha:0.5});
    }
    /* lanes */
    for (let i=0;i<4;i++){
      const y = 44 + i*24;
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0,y,VW,16);
      c.fillStyle = g.hitFx>0 ? '#ffffff' : '#4fd6ff';
      c.fillRect(40, y, 2, 16);
      this.arrow(c, 30, y+2, i, '#8fa3d6');
    }
    /* notes */
    for (const n of g.notes){
      if (n.hit) continue;
      const x = 40 + (n.t - g.t) * 2.6;
      if (x < -12 || x > VW+12) continue;
      this.arrow(c, x, 46 + n.d*24, n.d, ['#ff5c7a','#4fd6ff','#5be584','#ffd166'][n.d]);
    }
    Particles.draw(c);
    drawSeal(c, 6, 108, playerLook({facing:1, frame:(g.t/6|0)%2, pose:'swim'}));
    gameHUD(c, {left:'COMBO '+g.combo, right:fmt(g.score), mid:'P'+g.perfect+' G'+g.good+' M'+g.miss});
    if (g.judgeT > 0) drawTextC(c, g.judge, VW/2, 130,
      g.judge==='PERFECT'?'#ffd166':g.judge==='GOOD'?'#7bffe0':'#ff5c7a', 2, '#0d1024');
    const prog = clamp(g.t/g.endT,0,1);
    c.fillStyle='#2a3768'; c.fillRect(0,VH-4,VW,4); c.fillStyle='#7bffe0'; c.fillRect(0,VH-4,VW*prog,4);
    if (g.over) bigMsg(c, 'ENCORE!', g.perfect + ' PERFECT');
  },
  arrow(c, x, y, d, col){
    /* solid triangle head plus a stem, so direction reads at a glance */
    c.fillStyle = col;
    if (d === 0){        /* up */
      c.fillRect(x+4,y,2,2); c.fillRect(x+3,y+2,4,1); c.fillRect(x+2,y+3,6,1); c.fillRect(x+1,y+4,8,1);
      c.fillRect(x+4,y+5,2,5);
    } else if (d === 1){ /* down */
      c.fillRect(x+4,y,2,5); c.fillRect(x+1,y+5,8,1); c.fillRect(x+2,y+6,6,1); c.fillRect(x+3,y+7,4,1); c.fillRect(x+4,y+8,2,2);
    } else if (d === 2){ /* left */
      c.fillRect(x,y+4,2,2); c.fillRect(x+1,y+3,1,4); c.fillRect(x+2,y+2,1,6); c.fillRect(x+3,y+1,1,8);
      c.fillRect(x+4,y+4,5,2);
    } else {             /* right */
      c.fillRect(x,y+4,5,2); c.fillRect(x+5,y+1,1,8); c.fillRect(x+6,y+2,1,6); c.fillRect(x+7,y+3,1,4); c.fillRect(x+8,y+4,2,2);
    }
  }
});

/* ============================================================
   26. ICEBERG BALANCE - physics teeter
   ============================================================ */
Object.assign(GAMES.balance, {
  start(){
    this.s = {a:0, av:0, px:0, t:0, w:88, over:0, score:0, gulls:[], snow:0, msg:'', msgT:0,
      waveT:rnd(120,60), best:0, shrink:0};
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    g.score += 1; g.w = Math.max(30, 88 - g.t/90);
    const grip = 1 - State.gear.grip*0.09;
    let mv = 0;
    if (Input.key('left')) mv -= 1; if (Input.key('right')) mv += 1;
    if (Input.ptr.down) mv = Input.ptr.x < VW/2 ? -1 : 1;
    g.px = clamp(g.px + mv*1.25, -g.w+8, g.w-8);
    /* slide downhill */
    g.px = clamp(g.px + Math.sin(g.a)*2.6*grip, -g.w+8, g.w-8);
    /* torque */
    let torque = (g.px/g.w) * 0.0021;
    for (const gu of g.gulls) torque += (gu.x/g.w) * 0.0016;
    g.waveT--;
    if (g.waveT <= 0){
      g.waveT = rnd(150,70);
      const push = rnd(0.05,0.02) * (chance(0.5)?1:-1);
      g.av += push; g.msg = 'SWELL!'; g.msgT = 40; Audio_.sfx('wave');
    }
    torque += Math.sin(g.t/64)*0.0006;
    g.av += torque; g.av *= 0.982; g.a += g.av;
    /* gulls land and add weight */
    if (chance(0.006) && g.gulls.length < 4){
      g.gulls.push({x: rnd(g.w-10,-(g.w-10)), y:-40, land:0, wob:rnd(6.28)});
      g.msg = 'GULL INBOUND'; g.msgT = 40;
    }
    for (let i=g.gulls.length-1;i>=0;i--){
      const gu = g.gulls[i];
      if (gu.y < 0){ gu.y += 1.6; }
      else { gu.land++; if (gu.land > 240 || Math.abs(g.a) > 0.35){ g.gulls.splice(i,1); continue; } }
    }
    if (Math.abs(g.a) > 0.62){ g.over = 60; Audio_.sfx('fail'); shake(); }
    if (State.equipped.trail && g.t%6===0) Particles.spawnTrail(State.equipped.trail, 120+g.px, 100, 0, 0);
    Particles.update();
  },
  done(){
    const g = this.s;
    const secs = Math.floor(g.t/60);
    finishGame({score:secs*10, fish:secs*7, xp:secs*2.2, rolls: 1 + Math.floor(secs/22),
      luck:secs*0.004, win:secs>=30, cleared:true, title: secs>=30?'STEADY AS A ROCK':'TIPPED OVER',
      note: secs + ' SECONDS BALANCED'});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, skyPalette());
    drawSeaBand(c, 108, VH-108, g.t, '#1a4a8a');
    c.save();
    c.translate(120, 112); c.rotate(g.a);
    /* berg */
    c.fillStyle = '#e6f4ff'; c.fillRect(-g.w, -6, g.w*2, 12);
    c.fillStyle = '#9dc9f0'; c.fillRect(-g.w, 4, g.w*2, 8);
    c.fillStyle = '#f6fbff'; c.fillRect(-g.w+6, -9, g.w*2-12, 4);
    c.fillStyle = '#cfe9ff';
    for (let i=0;i<8;i++) c.fillRect(-g.w+10+i*(g.w*2-20)/8, -6, 2, 6);
    /* seal */
    drawSeal(c, g.px-12, -22, playerLook({facing: g.a>0?1:-1, frame:(g.t/12|0)%2}));
    /* gulls */
    for (const gu of g.gulls){
      const x = gu.x, y = gu.y < 0 ? gu.y - 14 : -14;
      const fl = (g.t/6|0)%2;
      c.fillStyle = '#f6fbff'; c.fillRect(x-4, y, 8, 5);
      c.fillStyle = '#e6eef7'; c.fillRect(x-8, y+(gu.y<0?(fl?-2:2):0), 5, 2); c.fillRect(x+3, y+(gu.y<0?(fl?-2:2):0), 5, 2);
      c.fillStyle = '#ffd166'; c.fillRect(x+4, y+1, 3, 2);
      c.fillStyle = '#0d1024'; c.fillRect(x+1, y+1, 1, 1);
      c.fillStyle = '#8fa3b8'; c.fillRect(x-2, y+5, 1, 2); c.fillRect(x+1, y+5, 1, 2);
    }
    c.restore();
    Particles.draw(c);
    /* tilt meter */
    const tilt = clamp(g.a/0.62, -1, 1);
    c.fillStyle = '#0d1024'; c.fillRect(60, 18, 120, 8);
    c.fillStyle = '#2a3768'; c.fillRect(62, 20, 116, 4);
    c.fillStyle = '#5be584'; c.fillRect(112, 20, 16, 4);
    c.fillStyle = Math.abs(tilt) > 0.75 ? '#ff5c7a' : '#ffd166';
    c.fillRect(118 + tilt*56, 17, 3, 10);
    drawTextC(c, 'BALANCE', VW/2, 28, '#8fa3d6', 1);
    gameHUD(c, {left:'', right:Math.floor(g.t/60)+'S', mid:'WIDTH '+Math.round(g.w*2)});
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 40, '#ffd166', 1, '#0d1024');
    drawTextC(c, 'LEAN AGAINST THE TILT', VW/2, 150, '#6f86b8', 1);
    if (g.over) bigMsg(c, 'SPLASH!', Math.floor(g.t/60) + ' SECONDS');
  }
});

/* ============================================================
   27. SEAGULL CHASE - defend the fish stash

Object.assign(GAMES.gull, {
  start(){

  },

  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; g.time--; if (g.msgT>0) g.msgT--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.time <= 0 || this.totalFish() <= 0){ g.over = 60; Audio_.sfx(this.totalFish()>0?'good':'fail'); }
    const sp = 1.5 + State.gear.speed*0.06;
    let mx = 0;
    if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
    if (Input.ptr.down){ const d = Input.ptr.x - (g.x+12); if (Math.abs(d) > 5) mx = d>0?1:-1; }
    g.x = clamp(g.x + mx*sp, 2, VW-26); if (mx) g.face = mx;
    if (g.swat > 0) g.swat--; if (g.swatCd > 0) g.swatCd--; if (g.decoyCd > 0) g.decoyCd--;
    if ((Input.hit('a') || Input.ptr.tapped) && g.swatCd <= 0){
      g.swat = 10; g.swatCd = 16; Audio_.sfx('swat');
      for (const gu of g.gulls){
        if (dist(gu.x, gu.y, g.x+12 + g.face*10, g.y0||96) < 30){
          if (gu.carry){ this.dropFish(gu); }
          gu.dead = 26; g.hits++;
          Particles.burst(gu.x, gu.y, '#ffffff', 6, 1.8, 'plus');
        }
      }
    }
    if (Input.hit('b') && g.decoyCd <= 0){ g.decoy = {x:g.x+12, t:300}; g.decoyCd = 420; Audio_.sfx('fish'); g.msg='DECOY DROPPED'; g.msgT=50; }
    if (g.decoy){ g.decoy.t--; if (g.decoy.t <= 0) g.decoy = null; }
    /* spawn */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(22, 78 - g.t/22);
      const side = chance(0.5) ? -14 : VW+14;
      g.gulls.push({x:side, y:rnd(50,16), tx:0, ty:0, carry:0, dead:0, sp:rnd(1.4,.8), wob:rnd(6.28), state:'in'});
    }
    for (let i=g.gulls.length-1;i>=0;i--){
      const gu = g.gulls[i];
      if (gu.dead){ gu.dead--; gu.y += 2.2; gu.x += (gu.x<120?-1:1); if (gu.dead<=0) g.gulls.splice(i,1); continue; }
      let tx, ty;
      if (gu.carry){ tx = gu.x < 120 ? -30 : VW+30; ty = -20; }
      else if (g.decoy){ tx = g.decoy.x; ty = 104; }
      else {
        const piles = g.piles.filter(p=>p.n>0);
        if (!piles.length){ tx = gu.x; ty = -20; }
        else { const p = piles[(i + (g.t/120|0)) % piles.length]; tx = p.x; ty = 104; gu.pile = p; }
      }
      const a = Math.atan2(ty-gu.y, tx-gu.x);
      gu.x += Math.cos(a)*gu.sp; gu.y += Math.sin(a)*gu.sp + Math.sin(g.t/8+gu.wob)*0.2;
      if (!gu.carry && gu.y > 98 && gu.pile && gu.pile.n > 0 && Math.abs(gu.x - gu.pile.x) < 10){
        gu.pile.n--; gu.carry = 1; Audio_.sfx('blip'); g.msg = 'THIEF!'; g.msgT = 30;
        Particles.burst(gu.x, gu.y, '#ffd166', 3, 1, 'sq');
      }
      if (gu.carry && (gu.y < -18 || gu.x < -28 || gu.x > VW+28)){ g.lost++; g.gulls.splice(i,1); }
      else if (!gu.carry && (gu.x < -30 || gu.x > VW+30) && gu.state === 'out') g.gulls.splice(i,1);
    }
    Particles.update();
  },
  dropFish(gu){
    const g = this.s;
    gu.carry = 0;
    const p = g.piles.reduce((a,b)=> a.n <= b.n ? a : b);
    p.n++;
    Particles.burst(gu.x, gu.y, '#ffd166', 4, 1.4, 'sq');
  },
  done(){
    const g = this.s;
    const saved = this.totalFish();
    const win = saved >= 18;
    if (win) recordWin('gull');
    const score = saved*22 + g.hits*14;
    finishGame({score:score, fish:score*0.4, xp:score/9, rolls:1 + Math.floor(saved/12) + (win?1:0),
      luck:saved*0.004, win:win, title: win ? 'STASH DEFENDED' : 'STASH RAIDED',
      note: saved + ' FISH LEFT - ' + g.hits + ' GULLS SWATTED - ' + g.lost + ' STOLEN'});
  },
  draw(c){
    const g = this.s;
    drawSky(c, g.t, skyPalette());
    drawSeaBand(c, 74, 18, g.t, '#2a6ab5');
    c.fillStyle = '#e6f4ff'; c.fillRect(0,92,VW,VH-92);
    c.fillStyle = '#cfe9ff'; c.fillRect(0,92,VW,3);
    for (let i=0;i<20;i++){ c.fillStyle='#dff3ff'; c.fillRect((i*23+7)%VW, 104+(i%5)*9, 3, 1); }
    /* piles */
    g.piles.forEach(p=>{
      for (let i=0;i<p.n;i++){
        const px = p.x - 10 + (i%5)*5, py = 112 - ((i/5)|0)*4;
        c.fillStyle = i%2 ? '#9ee5ff' : '#4fd6ff'; c.fillRect(px, py, 5, 3);
        c.fillStyle = '#0d1024'; c.fillRect(px+1, py+1, 1, 1);
      }
      c.fillStyle = '#8a5a34'; c.fillRect(p.x-13, 116, 26, 3);
      drawTextC(c, ''+p.n, p.x, 120, p.n>4?'#ffffff':'#ff5c7a', 1, '#0d1024');
    });
    if (g.decoy){ c.fillStyle='#ffd166'; c.fillRect(g.decoy.x-4, 106, 8, 4); c.fillStyle='#e0a05a'; c.fillRect(g.decoy.x+4,107,3,2);
      drawTextC(c,'DECOY',g.decoy.x,98,'#ffd166',1,'#0d1024'); }
    /* gulls */
    for (const gu of g.gulls){
      const x = gu.x|0, y = gu.y|0, fl = (g.t/5|0)%2, dead = gu.dead>0;
      c.fillStyle = dead ? '#ff9ecb' : '#f6fbff'; c.fillRect(x-5, y, 10, 6);
      c.fillStyle = dead ? '#ff9ecb' : '#e6eef7';
      c.fillRect(x-11, y+(fl?-3:3), 7, 2); c.fillRect(x+4, y+(fl?-3:3), 7, 2);
      c.fillStyle = '#ffd166'; c.fillRect(x+5, y+2, 4, 2);
      c.fillStyle = '#0d1024'; c.fillRect(x+2, y+1, 1, 1);
      c.fillStyle = '#8fa3b8'; c.fillRect(x-2, y+6, 1, 2); c.fillRect(x+1, y+6, 1, 2);
      if (gu.carry){ c.fillStyle='#4fd6ff'; c.fillRect(x-2, y+7, 5, 3); }
    }
    Particles.draw(c);
    g.y0 = 96;
    drawSeal(c, g.x, 92, playerLook({facing:g.face, frame:(g.t/8|0)%2}));
    if (g.swat > 4){
      c.fillStyle = 'rgba(255,255,255,.9)';
      const ax = g.x + 12 + g.face*16;
      c.fillRect(ax-6, 88, 12, 3); c.fillRect(ax-2, 82, 4, 12);
    }
    gameHUD(c, {left:'FISH '+this.totalFish(), right:Math.ceil(g.time/60)+'S', mid:'SWATS '+g.hits,
                leftCol:this.totalFish()<10?'#ff5c7a':'#ffd166'});
    if (g.decoyCd > 0){ c.fillStyle='#2a3768'; c.fillRect(VW-52,13,50,3); c.fillStyle='#5be584'; c.fillRect(VW-52,13,50*(1-g.decoyCd/420),3); }
    else drawText(c,'B: DECOY', VW-50, 13, '#5be584', 1);
    if (g.msgT>0) drawTextC(c, g.msg, VW/2, 30, '#ff9ecb', 1, '#0d1024');
    if (g.over) bigMsg(c, this.totalFish()>=18?'DEFENDED':'RAIDED', this.totalFish() + ' FISH LEFT');
  }
});

/* ============================================================
   28. DEEP DIVE - one breath, straight down
   ============================================================ */
Object.assign(GAMES.dive, {
  start(){
    const maxO = 100 * (1 + State.gear.lungs*0.10);
    this.s = {x:112, depth:0, vy:1.15, t:0, o2:maxO, maxO:maxO, ents:[], over:0, hurt:0,
      loot:0, msg:'', msgT:0, spawn:0, best:0, rising:0};
  },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--; if (g.hurt>0) g.hurt--;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    const sp = 1.35 + State.gear.speed*0.05;
    let mx = 0;
    if (Input.key('left')) mx -= 1; if (Input.key('right')) mx += 1;
    if (Input.ptr.down){ const d = Input.ptr.x - (g.x+12); if (Math.abs(d) > 5) mx = d>0?1:-1; }
    g.x = clamp(g.x + mx*sp, 4, VW-28);
    const fast = Input.key('b') || Input.key('down');
    g.vy = fast ? 2.5 : 1.15;
    if (Input.key('up')) g.vy = 0.45;
    g.depth += g.vy;
    g.o2 -= 0.055 + g.depth/260000 + (fast?0.02:0);
    if (g.o2 <= 0){ g.o2 = 0; g.over = 70; Audio_.sfx('fail'); }
    if (State.equipped.trail && g.t%3===0) Particles.spawnTrail(State.equipped.trail, g.x+12, 44, 0, -1);
    /* spawn field */
    g.spawn--;
    if (g.spawn <= 0){
      g.spawn = Math.max(11, 30 - g.depth/400);
      const r = Math.random(), m = this.meters();
      if (r < 0.30) g.ents.push({t:'bubble', x:rnd(VW-16,8), y:VH+10, r:5});
      else if (r < 0.76) g.ents.push({t:'jelly', x:rnd(VW-20,8), y:VH+10, r:7, a:rnd(6.28), sp:rnd(.7,.2)});
      else if (r < 0.90) g.ents.push({t:'urchin', x:rnd(VW-20,8), y:VH+10, r:7});
      else g.ents.push({t:'chest', x:rnd(VW-24,8), y:VH+10, r:8, deep:m});
    }
    const mag = 4 + State.gear.magnet*3;
    for (let i=g.ents.length-1;i>=0;i--){
      const e = g.ents[i];
      e.y -= g.vy;
      if (e.t === 'jelly'){ e.x += Math.sin(g.t/30 + e.a)*e.sp; e.y -= Math.sin(g.t/22+e.a)*0.2; }
      if (e.y < -20){ g.ents.splice(i,1); continue; }
      const d = dist(e.x, e.y, g.x+12, 46);
      if (e.t === 'bubble' && d < 14 + mag){ e.x += (g.x+12-e.x)*0.15; e.y += (46-e.y)*0.15; }
      if (d < 13){
        if (e.t === 'bubble'){ g.o2 = Math.min(g.maxO, g.o2 + 13); Audio_.sfx('bubble');
          Particles.burst(e.x,e.y,'#9ee5ff',4,1.2,'ring'); g.ents.splice(i,1); }
        else if (e.t === 'chest'){ g.loot++; Audio_.sfx('perfect'); g.msg='DEEP CACHE!'; g.msgT=50;
          Particles.burst(e.x,e.y,'#ffd166',10,2,'star'); g.ents.splice(i,1); }
        else if (g.hurt <= 0){
          g.o2 -= 16; g.hurt = 60; Audio_.sfx('hurt'); shake();
          Particles.burst(g.x+12,46,'#ff5c7a',7,1.8,'sq');
          g.msg = e.t==='jelly' ? 'STUNG!' : 'SPIKED!'; g.msgT = 40;
        }
      }
    }
    Particles.update();
  },
  meters(){ return Math.floor(this.s.depth/4); },
  done(){
    const g = this.s, m = this.meters();
    State.stats.deepest = Math.max(State.stats.deepest||0, m);
    finishGame({score:m, fish: m*0.7 + g.loot*40, xp: m/5, rolls: 1 + g.loot + Math.floor(m/450),
      luck: 0.04*g.loot + m/9000, win: m >= 600, title: m>=900 ? 'ABYSS REACHED' : 'SURFACED',
      note: m + 'M DEEP' + (g.loot? '  -  ' + g.loot + ' CACHES':'')});
  },
  draw(c){
    const g = this.s, m = this.meters();
    const dark = clamp(m/900, 0, 1);
    const grd = c.createLinearGradient(0,0,0,VH);
    grd.addColorStop(0, `rgb(${(26*(1-dark))|0},${(74*(1-dark)+8)|0},${(138*(1-dark)+24)|0})`);
    grd.addColorStop(1, `rgb(${(4*(1-dark))|0},${(18*(1-dark))|0},${(44*(1-dark)+8)|0})`);
    c.fillStyle = grd; c.fillRect(0,0,VW,VH);
    /* passing motes for a sense of speed */
    for (let i=0;i<30;i++){
      const y = ((i*53 - g.depth*1.4) % (VH+20) + VH+20) % (VH+20) - 10;
      c.fillStyle = 'rgba(255,255,255,.18)';
      c.fillRect((i*37)%VW, y, 1, 2);
    }
    for (const e of g.ents){
      const x = e.x|0, y = e.y|0;
      if (e.t === 'bubble'){
        c.fillStyle = 'rgba(158,229,255,.85)';
        c.fillRect(x-3,y-4,6,1); c.fillRect(x-4,y-3,8,6); c.fillRect(x-3,y+3,6,1);
        c.fillStyle = '#ffffff'; c.fillRect(x-2,y-2,2,2);
      } else if (e.t === 'jelly'){
        const pulse = (g.t/10|0)%2;
        c.fillStyle = '#d79aff'; c.fillRect(x-6,y-4,12,6); c.fillRect(x-4,y-6,8,2);
        c.fillStyle = '#b06bff';
        for (let i=0;i<4;i++) c.fillRect(x-5+i*3, y+2, 1, 5+pulse*2+((i*3)%3));
        c.fillStyle = '#f2d9ff'; c.fillRect(x-3,y-3,3,2);
      } else if (e.t === 'urchin'){
        c.fillStyle = '#2a1a3a'; c.fillRect(x-5,y-5,10,10);
        c.fillStyle = '#5a2a6a';
        c.fillRect(x-8,y-1,16,2); c.fillRect(x-1,y-8,2,16);
        c.fillRect(x-6,y-6,3,3); c.fillRect(x+3,y+3,3,3); c.fillRect(x-6,y+3,3,3); c.fillRect(x+3,y-6,3,3);
      } else {
        const glow = (g.t/8|0)%2;
        c.fillStyle = glow ? '#ffd166' : '#e0a05a'; c.fillRect(x-7,y-5,14,10);
        c.fillStyle = '#8a5a34'; c.fillRect(x-7,y-1,14,2); c.fillRect(x-2,y-5,4,10);
        c.fillStyle = '#fff3b0'; c.fillRect(x-6,y-4,3,2);
      }
    }
    Particles.draw(c);
    if (!(g.hurt>0 && (g.t/4|0)%2)){
      const o = playerLook({facing:1, frame:(g.t/7|0)%2, pose:'swim', rot:1.1});
      drawSeal(c, g.x, 40, o);
    }
    /* oxygen */
    c.fillStyle = 'rgba(13,16,36,.7)'; c.fillRect(0,0,VW,11);
    c.fillStyle = '#0d2a3a'; c.fillRect(30,3,120,5);
    const o2p = g.o2/g.maxO;
    c.fillStyle = o2p > 0.5 ? '#4fd6ff' : o2p > 0.22 ? '#ffd166' : ((g.t/6|0)%2 ? '#ff5c7a':'#8a2438');
    c.fillRect(30,3,120*o2p,5);
    drawText(c, 'O2', 12, 2, '#9ee5ff', 1);
    drawText(c, m + 'M', VW - textW(m+'M',1) - 3, 2, '#ffffff', 1);
    if (m >= 900) drawTextC(c, 'ABYSS', VW/2, 14, (g.t/8|0)%2?'#7bffe0':'#b06bff', 1, '#0d1024');
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 68, '#ffd166', 1, '#0d1024');
    drawTextC(c, 'B: SINK FAST   UP: SLOW', VW/2, 150, '#4a6a9a', 1);
    if (g.over) bigMsg(c, 'OUT OF AIR', m + ' METRES');
  }
});

/* ============================================================
   29. AURORA WATCH - calm memory round
   ============================================================ */
const AUR_COL = [['#7bffe0','#2a9c88'],['#4fd6ff','#1b6a9a'],['#b06bff','#6a3a9a'],['#ffd166','#b07a1a']];
const AUR_KEY = ['up','left','down','right'];
Object.assign(GAMES.aurora, {
  start(){
    this.s = {round:1, seq:[], idx:0, state:'show', showI:0, showT:36, t:0, flash:-1, flashT:0,
      mistakes:0, score:0, over:0, msg:'WATCH THE LIGHTS', msgT:80, maxRound:6};
    this.build();
  },
  build(){ const g = this.s; g.seq = []; for (let i=0;i<g.round+2;i++) g.seq.push(rndi(4)); g.showI = 0; g.showT = 30; g.state='show'; g.idx=0; },
  update(){
    const g = this.s;
    if (quitCheck()) return;
    g.t++; if (g.msgT>0) g.msgT--; if (g.flashT>0) g.flashT--; else g.flash = -1;
    if (g.over){ if (--g.over <= 0) this.done(); Particles.update(); return; }
    if (g.state === 'show'){
      g.showT--;
      if (g.showT === 22){ g.flash = g.seq[g.showI]; g.flashT = 20;
        Audio_.blip([523,659,784,1047][g.flash], 0.22, 'triangle', 0.2); }
      if (g.showT <= 0){
        g.showI++;
        g.showT = Math.max(20, 34 - g.round*2);
        if (g.showI >= g.seq.length){ g.state = 'input'; g.msg = 'YOUR TURN'; g.msgT = 50; }
      }
      return;
    }
    let pressed = -1;
    AUR_KEY.forEach((k,i)=>{ if (Input.hit(k)) pressed = i; });
    if (Input.ptr.tapped){ const band = clamp(Math.floor((Input.ptr.y - 16)/22), 0, 3); pressed = band; }
    if (pressed >= 0){
      g.flash = pressed; g.flashT = 14;
      Audio_.blip([523,659,784,1047][pressed], 0.18, 'triangle', 0.2);
      if (g.seq[g.idx] === pressed){
        g.idx++; g.score += 25 + g.round*5;
        Particles.burst(rnd(VW), 20 + pressed*22, AUR_COL[pressed][0], 5, 1.2, 'plus');
        if (g.idx >= g.seq.length){
          g.round++;
          g.score += 120 * g.round;
          if (g.round > g.maxRound){
            if (g.mistakes === 0){ State.stats.flawlessAurora = (State.stats.flawlessAurora||0) + 1; }
            g.over = 70; Audio_.sfx('legend'); g.msg = 'THE SKY IS PLEASED'; g.msgT = 70;
          } else { Audio_.sfx('good'); g.msg = 'ROUND ' + g.round; g.msgT = 60; this.build(); }
        }
      } else {
        g.mistakes++; g.idx = 0; Audio_.sfx('fail'); shake();
        g.msg = 'MISSTEP - WATCH AGAIN'; g.msgT = 70;
        if (g.mistakes >= 3){ g.over = 70; g.msg = 'THE LIGHTS FADE'; }
        else { g.state = 'show'; g.showI = 0; g.showT = 40; }
      }
    }
    Particles.update();
  },
  done(){
    const g = this.s;
    const flawless = g.mistakes === 0 && g.round > g.maxRound;
    finishGame({score:g.score, fish:g.score*0.4, xp:g.score/8,
      rolls: 1 + (g.round>3?1:0) + (flawless?2:0), luck: flawless?0.25:0.05,
      win: g.round > g.maxRound, title: flawless ? 'FLAWLESS VIGIL' : g.round>g.maxRound ? 'VIGIL COMPLETE' : 'LIGHTS FADED',
      note: 'ROUND ' + Math.min(g.round,g.maxRound) + '/' + g.maxRound + (flawless?' - NO MISTAKES':'  -  '+g.mistakes+' SLIPS')});
  },
  draw(c){
    const g = this.s;
    c.fillStyle = '#050a20'; c.fillRect(0,0,VW,VH);
    for (let i=0;i<50;i++){
      const x = (i*47)%VW, y = (i*31)%110;
      c.fillStyle = Math.sin(g.t/30+i)>0.4 ? '#ffffff' : '#8fa3d6';
      c.fillRect(x,y,1,1);
    }
    /* aurora bands */
    for (let b=0;b<4;b++){
      const on = g.flash === b && g.flashT > 0;
      const col = on ? AUR_COL[b][0] : AUR_COL[b][1];
      c.globalAlpha = on ? 0.95 : 0.42;
      c.fillStyle = col;
      for (let x=0;x<VW;x+=2){
        const h = 12 + Math.sin(x/22 + g.t/40 + b)*5 + (on?6:0);
        c.fillRect(x, 16 + b*22 + Math.sin(x/30 + g.t/30 + b*2)*3, 2, h);
      }
      c.globalAlpha = 1;
      if (on){ c.fillStyle = 'rgba(255,255,255,.30)'; c.fillRect(0, 16+b*22, VW, 4); }
      /* key hint chip so the mapping is always readable */
      c.fillStyle = 'rgba(5,10,32,.85)'; c.fillRect(2, 20 + b*22, 11, 11);
      c.fillStyle = on ? '#ffffff' : AUR_COL[b][0]; c.fillRect(2, 20 + b*22, 11, 1);
      drawText(c, ['^','<','V','>'][b], 5, 22 + b*22, on ? '#ffffff' : AUR_COL[b][0], 1);
    }
    /* ice + watchers */
    c.fillStyle = '#0b1230'; c.fillRect(0,118,VW,VH-118);
    c.fillStyle = '#1b2a5e'; c.fillRect(0,118,VW,3);
    for (let i=0;i<3;i++){
      drawSeal(c, 150 + i*28, 122 + (i%2), {cos:{fur:['fur_slate','fur_charcoal','fur_deepnavy'][i]},
        facing:-1, frame:(g.t/40|0)%2, alpha:0.75});
    }
    Particles.draw(c);
    drawSeal(c, 20, 122, playerLook({facing:1, frame:(g.t/30|0)%2, pose:'idle'}));
    gameHUD(c, {left:'ROUND '+Math.min(g.round,g.maxRound)+'/'+g.maxRound, right:fmt(g.score),
                mid: g.state==='show' ? 'WATCH' : 'REPEAT ('+(g.idx)+'/'+g.seq.length+')',
                midCol: g.state==='show' ? '#8fa3d6' : '#7bffe0'});
    for (let i=0;i<3;i++){ c.fillStyle = i < (3-g.mistakes) ? '#7bffe0' : '#2a3768'; c.fillRect(VW-10-i*6, 13, 4, 4); }
    if (g.msgT > 0) drawTextC(c, g.msg, VW/2, 112, '#ffffff', 1, '#050a20');
    if (g.over) bigMsg(c, g.mistakes===0 && g.round>g.maxRound ? 'FLAWLESS' : 'GOODNIGHT', fmt(g.score)+' PTS');
  }
});

/* ============================================================
   30. MAIN LOOP + BOOT
   ============================================================ */
let lastT = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = ts - lastT; lastT = ts;
  if (dt > 200) dt = 200;
  acc += dt;
  const step = 1000/60;
  let guard = 0;
  while (acc >= step && guard++ < 4){
    acc -= step;
    tick();
  }
  render();
}
function tick(){
  Scene.t++;
  if (UI.anyOpen()){ Input.clear(); if ($('#scr-wardrobe').classList.contains('show')) UI.pvT = (UI.pvT||0)+1; return; }
  switch(Scene.name){
    case 'hub': Hub.update(); break;
    case 'game': if (Runner.g && Runner.g.update) Runner.g.update(); break;
    case 'results': Results.update(); break;
  }
  Input.clear();
}
function render(){
  ctx.imageSmoothingEnabled = false;
  /* full clear each frame so no scene can leak pixels into the next */
  ctx.globalAlpha = 1; ctx.fillStyle = '#05070f'; ctx.fillRect(0,0,VW,VH);
  switch(Scene.name){
    case 'hub': Hub.draw(ctx); break;
    case 'game': if (Runner.g && Runner.g.draw) Runner.g.draw(ctx); break;
    case 'results': Results.draw(ctx); break;
    default: ctx.fillStyle = '#070b1c'; ctx.fillRect(0,0,VW,VH);
  }
  if ($('#scr-wardrobe').classList.contains('show')) UI.pvDraw($('#pvcanvas').getContext('2d'));
}
/* keep the stage tall enough on short screens */
function fitStage(){
  const app = document.getElementById('app');
  const top = document.getElementById('topbar').offsetHeight;
  const under = document.getElementById('underbar').offsetHeight;
  const pad = document.getElementById('pad');
  const avail = app.clientHeight - top - under - 12;
  const wrap = document.getElementById('stagewrap');
  /* leave room for the control pad on short screens, otherwise go as big as we can */
  const maxByH = Math.max(150, avail - Math.min(210, app.clientHeight * 0.30));
  const maxByW = Math.min(860, app.clientWidth) - 8;
  const w = Math.min(maxByW, maxByH * 1.5);
  wrap.style.maxWidth = Math.round(w) + 'px';
  const wide = app.clientWidth > 760 && app.clientHeight > 620;
  pad.style.opacity = wide ? '0.55' : '1';
}
addEventListener('resize', fitStage);
addEventListener('orientationchange', ()=> setTimeout(fitStage, 120));

function boot(){
  loadGame();
  applyOptions();
  checkQuests(true);
  currentRotation();
  UI.refreshTop();
  Hub.init();
  setScene('hub');
  fitStage();
  saveGame();
  /* first-run welcome */
  if (State.stats.totalRolls === 0 && !State.lifetimeFish){
    setTimeout(()=>{
      modal('Welcome to Seal Vault',
        'You are a seal. So is everyone else.<br><br>Walk the floe with <kbd>ARROWS</kbd> or the pad, press <kbd>A</kbd> at the '+
        'VAULT GATE to dive into a minigame, and bring fish home for gear and cosmetics.<br><br>'+
        '<span class="muted">Progress saves in this browser. SYS > EXPORT SAVE makes a backup file.</span>',
        [{t:'LETS GO'},{t:'HOW TO PLAY', fn:()=>UI.open('scr-help')}]);
    }, 400);
  }
  setInterval(()=>{ if (!UI.anyOpen()) saveGame(); }, 20000);
  addEventListener('visibilitychange', ()=>{ if (document.hidden) saveGame(); });
  addEventListener('beforeunload', saveGame);
  requestAnimationFrame(frame);
}
/* debug/test hook - lets a harness drive the game without a human */
window.SV = {State:()=>State, COS:COS, GAMES:GAMES, start:startGame, scene:()=>Scene.name, UI:UI,
  finish:(o)=>finishGame(o||{score:1,fish:10,xp:5,rolls:1}), rollLoot:rollLoot, save:saveGame,
  grant:(id)=>grantItem(id), quests:QUESTS, hub:Hub, runner:Runner, audio:Audio_, input:Input,
  sealCanvas:sealCanvas, thumb:itemThumbCanvas, CANW:CANW, CANH:CANH, PADX:PADX, PADY:PADY,
  version:'1.0.0'};
boot();

})();
</script>
